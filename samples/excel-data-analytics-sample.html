<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Learn Excel for data analytics by doing: clean, summarise and analyse realistic business data with instant feedback. Works offline.">
<title>Excel for Data Analytics - Basics to Advanced: free sample</title>
<style>
/* Uses only fonts already on the device, so the file works offline and contacts no outside server. */
/* Look: a ledger workbook. Ruled grid lines, ledger-green ink, a highlighter for cells you fill in. */
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --fg:#18201B; --muted:#5B665E; --line:#DCE1DC; --soft:#EEF2EE; --grid:#E3E8E3; --head:#F1F4F1;
  --ink:#146C43; --ink-2:#0F5535; --ink-soft:#DFF0E6; --hl:#FFF4C2; --hl-line:#D9A400;
  --good:#16804F; --good-soft:#DFF3E8; --bad:#B8382F; --bad-soft:#FBE3E1; --warn:#8A5A00; --warn-soft:#FBF0D9;
  --r1:#2F6FDE; --r2:#C2410C; --r3:#7C3AED; --r4:#0E8A8A; --r5:#BE185D; --r6:#65731A;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --card:#161D19; --fg:#E4EBE6; --muted:#9AA79F; --line:#2A342E; --soft:#1B231F; --grid:#26302A; --head:#1A221E;
  --ink:#5FCB94; --ink-2:#7DD9A9; --ink-soft:#183A28; --hl:#3A3214; --hl-line:#C99A1C;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14;
  --r1:#7FA8F5; --r2:#F59A6B; --r3:#B69AF7; --r4:#5CC9C9; --r5:#F08DB8; --r6:#B8C764; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --card:#161D19; --fg:#E4EBE6; --muted:#9AA79F; --line:#2A342E; --soft:#1B231F; --grid:#26302A; --head:#1A221E;
  --ink:#5FCB94; --ink-2:#7DD9A9; --ink-soft:#183A28; --hl:#3A3214; --hl-line:#C99A1C;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14;
  --r1:#7FA8F5; --r2:#F59A6B; --r3:#B69AF7; --r4:#5CC9C9; --r5:#F08DB8; --r6:#B8C764; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.8vw,2.5rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.06rem;font-weight:700}
p{margin:0}
a{color:var(--ink)}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.wrap{max-width:none;margin:0 auto;padding-inline:clamp(16px,2.5vw,40px)}
.muted{color:var(--muted)} .small{font-size:.87rem}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.hide{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:.95rem;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.06rem}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:.84rem;white-space:nowrap}
.chip b{font-family:var(--f-mono)}
.tabs{background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-block:20px 48px}
.ed-banner{background:var(--warn-soft);color:var(--warn);font-size:.86rem;text-align:center;padding:6px 16px}
.ed-banner a{color:inherit;font-weight:700}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:650;min-height:42px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{background:var(--ink-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.88rem}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.lv-Newbie{background:var(--ink-soft);color:var(--ink);border-color:transparent}
.tag.lv-Master{background:var(--hl);color:var(--warn);border-color:var(--hl-line)}
.tag.lock{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* home */
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:center;margin-bottom:24px}
@media (min-width:760px){.hero{grid-template-columns:1.3fr 1fr}}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:56ch}
.hero-grid{font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.hero-grid .fxl{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--head)}
.hero-grid .fxl b{color:var(--ink)}
.hero-grid table{border-collapse:collapse;width:100%}
.hero-grid td{border:1px solid var(--grid);padding:5px 8px;text-align:right;white-space:nowrap}
.hero-grid td:first-child{text-align:left;color:var(--muted)}
.hero-grid td.hl{background:var(--hl);box-shadow:inset 0 0 0 2px var(--hl-line);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.path{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.mod:hover{border-color:var(--ink)}
.mod .num{width:40px;height:40px;border-radius:9px;border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:800}
.mod.done .num{background:var(--ink);color:var(--card)}
.mod .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.mod .meta .bar{max-width:260px}
.mod .side{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:right}
.mod.locked{opacity:.85}
.mod.locked .num{border-color:var(--muted);color:var(--muted)}

/* module page */
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.exlist{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.exrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.exrow:hover{border-color:var(--ink)}
.exrow .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex:none}
.exrow.done .st{background:var(--good);border-color:var(--good);color:var(--card)}
.exrow.started .st{border-color:var(--hl-line);background:var(--hl)}
.exrow.locked{opacity:.7}

/* exercise */
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.learn{border-left:4px solid var(--ink)}
.learn p+p{margin-top:8px}
.syn{margin-top:10px;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.task .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;border:2px solid var(--hl-line);background:var(--hl);color:var(--warn);margin-top:1px}
.task.ok .ic{background:var(--good);border-color:var(--good);color:var(--card)}
.task.no .ic{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.task.cur{border-color:var(--hl-line);box-shadow:0 0 0 2px var(--hl) }
.task .fb{margin-top:6px;font-size:.9rem;border-radius:6px;padding:6px 9px}
.task .fb.bad{background:var(--bad-soft);color:var(--bad)}
.task .fb.good{background:var(--good-soft);color:var(--good)}
.task .fb.hint{background:var(--warn-soft);color:var(--warn)}
.task .fb.ans{background:var(--soft);color:var(--fg);border:1px dashed var(--line)}
.task button.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline}

/* the sheet */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fxbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--head)}
.namebox{width:64px;flex:none;font-family:var(--f-mono);font-weight:700;display:grid;place-items:center;border-right:1px solid var(--line);font-size:.92rem}
.fxlabel{flex:none;display:grid;place-items:center;padding:0 8px;font-style:italic;font-family:Georgia,serif;color:var(--muted);border-right:1px solid var(--line)}
.fxbar input{flex:1 1 auto;min-width:0;border:0;background:var(--card);padding:10px;font-family:var(--f-mono);font-size:1rem;outline:none}
.fxbar input[readonly]{background:var(--head);color:var(--muted)}
.fxbar input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.fxbar .go{border:0;border-left:1px solid var(--line);background:var(--ink);color:var(--card);font-weight:800;padding:0 16px}
.fxbar .go[disabled]{background:var(--head);color:var(--muted)}
.fxinfo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);font-size:.86rem;min-height:34px}
.sig{font-family:var(--f-mono);color:var(--muted)}
.sig b{color:var(--ink)}
.prev{font-family:var(--f-mono)}
.prev.err{color:var(--bad)}
.ac{border-bottom:1px solid var(--line);background:var(--card);max-height:260px;overflow-y:auto}
.ac button{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid);background:none;padding:8px 10px;min-height:40px;color:var(--fg);font:inherit}
.ac button b{font-family:var(--f-mono);color:var(--ink)}
.ac .aca{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ac .acd{flex-basis:100%;font-size:.82rem;color:var(--muted)}
.ac button[aria-selected="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--ink)}
.ac .ach{padding:4px 10px;font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.chips button{flex:none;font-family:var(--f-mono);font-size:.9rem;min-width:36px;min-height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px 9px}
.chips button:hover{border-color:var(--ink)}
.gridwrap{overflow:auto;max-height:68vh;outline:none}
table.grid{border-collapse:separate;border-spacing:0;font-size:.92rem;font-variant-numeric:tabular-nums}
table.grid th{position:sticky;top:0;background:var(--head);color:var(--muted);font-weight:600;font-size:.78rem;border-right:1px solid var(--grid);border-bottom:1px solid var(--line);padding:3px 6px;z-index:2;user-select:none}
table.grid th.rh{position:sticky;left:0;z-index:1;min-width:38px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--grid)}
table.grid th.corner{left:0;z-index:3}
table.grid th.on{background:var(--ink-soft);color:var(--ink)}
table.grid td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:4px 8px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;cursor:cell;position:relative;background:var(--card)}
table.grid td.n{text-align:right}
table.grid td.b{text-align:center}
table.grid td.hd{font-weight:700;background:var(--soft)}
table.grid td.tk{background:var(--hl)}
table.grid td.anchor{box-shadow:inset 0 0 0 2px var(--hl-line)}
table.grid td.fill{background:var(--hl);background:color-mix(in srgb,var(--hl) 55%,var(--card))}
table.grid td.okc{background:var(--good-soft)}
table.grid td.badc{background:var(--bad-soft)}
table.grid td.e{color:var(--bad);font-weight:700}
table.grid td.sel{box-shadow:inset 0 0 0 2px var(--ink)!important;z-index:1}
table.grid td.fx{font-style:normal}
table.grid td[data-rc]{outline:2px dashed var(--rc);outline-offset:-3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:8px 10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.win{border:2px solid var(--good);background:var(--good-soft);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.win h3{color:var(--good)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}

/* quiz */
.q{display:grid;gap:8px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;width:100%}
.opt:hover{border-color:var(--ink)}
.opt .k{width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{font-size:.92rem;background:var(--soft);border-radius:8px;padding:8px 10px}

/* guide */
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.fn{display:grid;gap:4px}
.fn .nm{font-family:var(--f-mono);font-weight:800;color:var(--ink)}
.fn .sy{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.fn .eg{font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* progress and certificate */
.lvl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:.72rem;text-align:center;color:var(--muted)}
.lvl div{border-top:4px solid var(--line);padding-top:4px}
.lvl div.on{border-color:var(--ink);color:var(--ink);font-weight:700}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px;font-family:var(--f-mono);font-size:.82rem}
input.txt{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.cert{background:#FFFDF6;color:#1d2a22;border:10px double #146C43;border-radius:6px;padding:clamp(18px,5vw,48px);text-align:center;display:grid;gap:10px;max-width:820px;margin:0 auto}
.cert .t1{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;color:#146C43}
.cert .nm{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,5vw,2.8rem);font-style:italic;border-bottom:1px solid #b9c7bd;padding-bottom:6px;margin:4px auto 0;min-width:60%}
.cert .sm{font-size:.82rem;color:#4a574f}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.92rem}
.okbox{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-size:.92rem}
.upsell{border:2px solid var(--hl-line);background:var(--hl);border-radius:var(--r);padding:16px;display:grid;gap:8px;color:var(--fg)}
.foot{border-top:1px solid var(--line);padding:18px 0 28px;font-size:.82rem;color:var(--muted)}
.prose p+p,.prose ul+p,.prose p+ul{margin-top:8px}
.prose ul{margin:6px 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:650;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:1.2rem}.mod{grid-template-columns:auto 1fr}.mod .side{display:none}.namebox{width:52px}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute;left:0;top:0;width:100%;border-width:8px}
}
/* Practice lab: an Excel-like sheet */
.xl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.xg{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding-right:10px;border-right:1px solid var(--line)}
.xg:last-child{border-right:0}
.xb{font:inherit;font-size:.84rem;min-height:32px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.xb:hover{border-color:var(--ink)}
select.xb{padding-right:4px}
input.namebox.nbx{width:84px;flex:none;font-size:.92rem;border:0;border-right:1px solid var(--line);background:var(--card);color:var(--fg);text-align:center;padding:0 4px;outline:none}
input.namebox.nbx:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.xlw{position:relative;height:60vh;max-height:none;min-height:300px;touch-action:pan-x pan-y}
.xgrid td{cursor:cell;min-width:9ch;max-width:320px;user-select:none;-webkit-user-select:none}
.xgrid td.bo{font-weight:700}
table.grid.xgrid td.sel{z-index:auto}
.xgrid td.insel{background:var(--ink-soft);background:color-mix(in srgb,var(--ink) 13%,var(--card))}
.xgrid td.fillp{outline:1px dashed var(--fg);outline-offset:-2px}
.xgrid th[data-col],.xgrid th[data-row],.xgrid th.corner{cursor:pointer}

<script>
window.APP_CONFIG = {"edition":"sample","version":"v1.0 (October 2026)","email":"digiprostore99@gmail.com","store":"https://99digiprostore.myinstamojo.com"};
window.MODS = [{"id":"m01","no":1,"title":"Spreadsheet basics","level":"Newbie","sample":true,"blurb":"Cells, addresses and your first formulas. Add, subtract, multiply, divide, percentages and fill down.","ex":[{"id":"m01e01","t":"Your first formula","learn":"\u003cp>A spreadsheet is a grid. Each box is a \u003cb>cell\u003c/b>, named by its column letter and row number. \u003ccode>B2\u003c/code> means column B, row 2.\u003c/p>\u003cp>Every formula starts with \u003ccode>=\u003c/code>. After it, you point at cells instead of typing numbers. If a number changes later, the answer updates by itself. That's the whole point of a spreadsheet.\u003c/p>","syn":"=B2+B3","data":[["Month","Sales (₹)"],["April",125000],["May",148000],["Total",null]],"fmt":{"B":"inr0"},"tasks":[{"cell":"B4","ask":"In \u003cb>B4\u003c/b>, add April and May sales.","sol":"=B2+B3","hint":"Click B4, type \u003ccode>=B2+B3\u003c/code> and press Enter. You can also type \u003ccode>=\u003c/code>, click B2, type \u003ccode>+\u003c/code>, then click B3."}],"tip":"In real Excel, you can type = and then click cells with the mouse. Excel writes the address for you.","lesson":{"why":"\u003cp>A spreadsheet is a grid of boxes called \u003cb>cells\u003c/b>. Each cell has an address: its column letter and row number. \u003ccode>B2\u003c/code> means column B, row 2.\u003c/p>\u003cp>A \u003cb>formula\u003c/b> is how you ask the sheet to calculate. It always starts with \u003ccode>=\u003c/code>. Instead of typing the numbers, you point at the cells that hold them. When a number changes, the answer updates by itself.\u003c/p>","demo":{"data":[["Expense","Amount (₹)"],["Rent",15000],["Electricity",3200],["Total",null]],"fmt":{"B":"inr0"},"steps":[{"say":"Here's a small expense sheet. Rent is in column B, row 2, so its address is \u003cb>B2\u003c/b>.","hl":["B2"]},{"say":"Electricity is in \u003cb>B3\u003c/b>.","hl":["B3"]},{"say":"To total them, click the empty cell \u003cb>B4\u003c/b> and type an equals sign, then the two addresses joined with a plus.","hl":["B2","B3"],"at":"B4","f":"=B2+B3"},{"say":"Press Enter. The cell shows the answer, ₹18,200. The formula is still there in the formula bar above the grid.","at":"B4","f":"=B2+B3","enter":true},{"say":"Now the magic: rent goes up to ₹16,000. Change B2 and the total updates to ₹19,200 by itself. That's why we point at cells, not numbers.","hl":["B2"],"at":"B4","set":{"B2":16000}}]},"remember":["Every formula starts with \u003ccode>=\u003c/code>.","Point at cells (\u003ccode>B2\u003c/code>), don't type the numbers (\u003ccode>15000\u003c/code>).","Change an input and every answer that uses it updates."]}},{"id":"m01e02","t":"Subtract to find profit","learn":"\u003cp>Use \u003ccode>-\u003c/code> to subtract. Profit is revenue minus expenses, so the formula points at both cells.\u003c/p>\u003cp>Try changing your thinking from \"what is the number?\" to \"which cells make the number?\" That habit is what makes you fast later.\u003c/p>","syn":"=B2-B3","data":[["Item","Amount (₹)"],["Revenue",480000],["Expenses",365000],["Profit",null]],"fmt":{"B":"inr0"},"tasks":[{"cell":"B4","ask":"In \u003cb>B4\u003c/b>, work out profit (revenue minus expenses).","sol":"=B2-B3","hint":"\u003ccode>=B2-B3\u003c/code>"}],"lesson":{"why":"\u003cp>The minus sign \u003ccode>-\u003c/code> subtracts one cell from another. Profit, balance due, variance and savings are all subtractions.\u003c/p>\u003cp>Order matters. \u003ccode>=B2-C2\u003c/code> is not the same as \u003ccode>=C2-B2\u003c/code>: one gives a positive answer and the other a negative one. Say it in words first (\"budget minus actual\"), then write it.\u003c/p>","demo":{"data":[["Item","Budget (₹)","Actual (₹)","Saved (₹)"],["Travel",20000,16500,null],["Printing",8000,9200,null]],"fmt":{"B":"inr0","C":"inr0","D":"inr0"},"steps":[{"say":"The travel budget was ₹20,000 (\u003cb>B2\u003c/b>) and we actually spent ₹16,500 (\u003cb>C2\u003c/b>). How much did we save?","hl":["B2","C2"]},{"say":"Saved = budget minus actual. In \u003cb>D2\u003c/b>, type the formula in that same order.","hl":["B2","C2"],"at":"D2","f":"=B2-C2"},{"say":"Press Enter: ₹3,500 saved.","at":"D2","f":"=B2-C2","enter":true},{"say":"Same formula for printing in \u003cb>D3\u003c/b>. This time the answer is negative, -₹1,200, because we spent more than the budget. A minus answer is useful information, not an error.","hl":["B3","C3"],"at":"D3","f":"=B3-C3","enter":true}]},"remember":["\u003ccode>-\u003c/code> subtracts.","Say it in words first, then write it in the same order.","A negative answer means the second number was bigger."]}},{"id":"m01e03","t":"Multiply an invoice line","learn":"\u003cp>Use \u003ccode>*\u003c/code> (star) to multiply. On a keyboard it's Shift+8. An invoice line amount is quantity times rate.\u003c/p>","syn":"=B2*C2","data":[["Item","Qty","Rate (₹)","Amount (₹)"],["Ledger notebooks",40,85,null]],"fmt":{"C":"inr0","D":"inr0"},"tasks":[{"cell":"D2","ask":"In \u003cb>D2\u003c/b>, multiply quantity by rate.","sol":"=B2*C2","hint":"\u003ccode>=B2*C2\u003c/code>"}],"lesson":{"why":"\u003cp>The star \u003ccode>*\u003c/code> multiplies (Shift + 8 on most keyboards). Quantity × rate is the most common formula in accounts: invoice lines, wages, stock value.\u003c/p>","demo":{"data":[["Staff","Hours","Rate per hour (₹)","Pay (₹)"],["Suresh",160,180,null]],"fmt":{"C":"inr0","D":"inr0"},"steps":[{"say":"Suresh worked 160 hours (\u003cb>B2\u003c/b>) at ₹180 an hour (\u003cb>C2\u003c/b>).","hl":["B2","C2"]},{"say":"Pay = hours × rate. In \u003cb>D2\u003c/b>, type \u003ccode>=B2*C2\u003c/code>.","hl":["B2","C2"],"at":"D2","f":"=B2*C2"},{"say":"Press Enter: ₹28,800.","at":"D2","f":"=B2*C2","enter":true},{"say":"If his hours change to 172, the pay updates to ₹30,960 without touching the formula.","hl":["B2"],"at":"D2","set":{"B2":172}}]},"remember":["\u003ccode>*\u003c/code> multiplies.","Amount = quantity × rate, written as \u003ccode>=B2*C2\u003c/code>."]}},{"id":"m01e04","t":"Divide to find cost per unit","learn":"\u003cp>Use \u003ccode>/\u003c/code> to divide. Cost per unit is total cost divided by units produced. It is one of the first numbers any costing report shows.\u003c/p>","syn":"=B2/B3","data":[["Detail","Value"],["Total production cost (₹)",252000],["Units produced",1800],["Cost per unit (₹)",null]],"cfmt":{"B2":"inr0","B3":"int","B4":"inr"},"tasks":[{"cell":"B4","ask":"In \u003cb>B4\u003c/b>, find the cost per unit.","sol":"=B2/B3","hint":"\u003ccode>=B2/B3\u003c/code>"}],"lesson":{"why":"\u003cp>The slash \u003ccode>/\u003c/code> divides. Cost per unit, price per kg and average per month are all divisions: the total on top, the count below.\u003c/p>\u003cp>Dividing by zero or an empty cell gives the error \u003ccode>#DIV/0!\u003c/code>. That error is Excel telling you the bottom number is missing.\u003c/p>","demo":{"data":[["Detail","Value"],["Total bill (₹)",4560],["Kg bought",12],["Price per kg (₹)",null]],"cfmt":{"B2":"inr0","B3":"int","B4":"inr"},"steps":[{"say":"We paid ₹4,560 (\u003cb>B2\u003c/b>) for 12 kg (\u003cb>B3\u003c/b>). What's the price per kg?","hl":["B2","B3"]},{"say":"Total divided by quantity. In \u003cb>B4\u003c/b>, type \u003ccode>=B2/B3\u003c/code>.","hl":["B2","B3"],"at":"B4","f":"=B2/B3"},{"say":"Press Enter: ₹380 per kg.","at":"B4","f":"=B2/B3","enter":true},{"err":true,"say":"What if the quantity is left as 0? The answer becomes \u003cb>#DIV/0!\u003c/b>. Fill in the bottom number and the error goes away.","hl":["B3"],"at":"B4","set":{"B3":0}}]},"remember":["\u003ccode>/\u003c/code> divides: total on top, count below.","\u003ccode>#DIV/0!\u003c/code> means you divided by zero or a blank cell."]}},{"id":"m01e05","t":"Brackets and the order of maths","learn":"\u003cp>Excel follows the school order: brackets first, then \u003ccode>^\u003c/code> (power), then \u003ccode>*\u003c/code> and \u003ccode>/\u003c/code>, then \u003ccode>+\u003c/code> and \u003ccode>-\u003c/code>.\u003c/p>\u003cp>So \u003ccode>=B2*1+B3\u003c/code> is not the same as \u003ccode>=B2*(1+B3)\u003c/code>. To add GST to a price, you multiply the price by (1 + rate).\u003c/p>\u003cp>One surprise: \u003ccode>=-2^2\u003c/code> gives 4, because Excel applies the minus sign before the power.\u003c/p>","syn":"=B2*(1+B3)","data":[["Detail","Value"],["Price before GST (₹)",2500],["GST rate",0.18],["Price with GST (₹)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"inr"},"tasks":[{"cell":"B4","ask":"In \u003cb>B4\u003c/b>, find the price including GST, in one formula.","sol":"=B2*(1+B3)","hint":"Multiply the price by (1 + the GST rate): \u003ccode>=B2*(1+B3)\u003c/code>"}],"tip":"18% is stored as 0.18. The % sign is only how the cell is displayed.","lesson":{"why":"\u003cp>Excel does maths in the school order: \u003cb>brackets first\u003c/b>, then powers, then \u003ccode>*\u003c/code> and \u003ccode>/\u003c/code>, then \u003ccode>+\u003c/code> and \u003ccode>-\u003c/code>.\u003c/p>\u003cp>So if you want something added before it's multiplied, put it in brackets. This matters every time you add GST or a markup in one step.\u003c/p>","demo":{"data":[["Detail","Value"],["Price (₹)",1000],["GST rate",0.05],["Price with GST (₹)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"inr"},"steps":[{"say":"A ₹1,000 item (\u003cb>B2\u003c/b>) with 5% GST (\u003cb>B3\u003c/b>). The answer should be ₹1,050.","hl":["B2","B3"]},{"say":"Try it without brackets: \u003ccode>=B2*1+B3\u003c/code>.","hl":["B2","B3"],"at":"B4","f":"=B2*1+B3"},{"say":"Wrong! Excel multiplied first (1,000 × 1) and then added 0.05, giving ₹1,000.05.","at":"B4","f":"=B2*1+B3","enter":true},{"say":"Now with brackets: \u003ccode>=B2*(1+B3)\u003c/code>. The bracket is worked out first: 1 + 5% = 1.05.","hl":["B2","B3"],"at":"B4","f":"=B2*(1+B3)"},{"say":"Press Enter: ₹1,050. Right.","at":"B4","f":"=B2*(1+B3)","enter":true}]},"remember":["Brackets are worked out first.","Price with GST = price × (1 + rate).","If an answer looks slightly off, check the brackets."]}},{"id":"m01e06","t":"Percentages and discounts","learn":"\u003cp>A percentage is a number like any other: 12% is 0.12. To find 12% of a price, multiply the price by the rate.\u003c/p>\u003cp>Then use that answer in the next formula. Formulas can point at other formulas.\u003c/p>","syn":"=B2*B3","data":[["Detail","Value"],["List price (₹)",18000],["Discount",0.12],["Discount amount (₹)",null],["Price after discount (₹)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"inr","B5":"inr"},"tasks":[{"cell":"B4","ask":"In \u003cb>B4\u003c/b>, work out the discount amount.","sol":"=B2*B3","hint":"\u003ccode>=B2*B3\u003c/code>"},{"cell":"B5","ask":"In \u003cb>B5\u003c/b>, work out the price after discount, using B4.","sol":"=B2-B4","hint":"\u003ccode>=B2-B4\u003c/code>"}],"lesson":{"why":"\u003cp>A percentage is just a number. 5% is stored as 0.05; the % sign is only how it's displayed. To find 5% of something, multiply by the rate.\u003c/p>\u003cp>A formula can also use the answer of another formula. Build a calculation in small steps, one cell at a time, so each step is easy to check.\u003c/p>","demo":{"data":[["Detail","Value"],["Sales (₹)",80000],["Agent commission",0.05],["Commission (₹)",null],["Sales after commission (₹)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"inr","B5":"inr"},"steps":[{"say":"Sales of ₹80,000 (\u003cb>B2\u003c/b>). The agent gets 5% (\u003cb>B3\u003c/b>).","hl":["B2","B3"]},{"say":"5% of sales is sales × rate. In \u003cb>B4\u003c/b>, type \u003ccode>=B2*B3\u003c/code>.","hl":["B2","B3"],"at":"B4","f":"=B2*B3"},{"say":"Press Enter: ₹4,000.","at":"B4","f":"=B2*B3","enter":true},{"say":"Now use that answer. Sales after commission = sales minus commission, so \u003cb>B5\u003c/b> points at B4, which is itself a formula.","hl":["B2","B4"],"at":"B5","f":"=B2-B4"},{"say":"Press Enter: ₹76,000. Change the rate in B3 and both answers update.","at":"B5","f":"=B2-B4","enter":true}]},"remember":["5% is 0.05. Multiply by the rate to get the percentage amount.","Formulas can use other formulas' answers.","Small steps in separate cells are easier to check."]}},{"id":"m01e07","t":"Fill down: one formula, many rows","learn":"\u003cp>You never type the same formula 100 times. You write it once, then drag the small square at the cell's corner (the \u003cb>fill handle\u003c/b>) down the column.\u003c/p>\u003cp>As it fills, Excel moves the row numbers with it: \u003ccode>=B2*C2\u003c/code> in row 2 becomes \u003ccode>=B3*C3\u003c/code> in row 3. These are called \u003cb>relative references\u003c/b>.\u003c/p>\u003cp>Here, write the formula in D2 and the lab fills it down to D6 for you, just like dragging.\u003c/p>","syn":"=B2*C2","data":[["Item","Qty","Rate (₹)","Amount (₹)"],["A4 paper (ream)",25,310,null],["Toner cartridge",3,2450,null],["Box files",60,45,null],["Stapler",8,165,null],["Calculator",5,690,null]],"fmt":{"C":"inr0","D":"inr0"},"tasks":[{"fill":"D2:D6","ask":"In \u003cb>D2\u003c/b>, multiply qty by rate. It will be filled down to D6.","sol":"=B2*C2","hint":"Write it for row 2 only: \u003ccode>=B2*C2\u003c/code>. The fill does the rest."}],"tip":"In Excel, double-click the fill handle to fill down to the end of your data in one go.","lesson":{"why":"\u003cp>Real sheets have hundreds of rows. You write the formula once in the first row, then copy it down with the \u003cb>fill handle\u003c/b>, the small square at the bottom-right corner of the cell.\u003c/p>\u003cp>As it copies, Excel moves the row numbers: \u003ccode>=B2*C2\u003c/code> in row 2 becomes \u003ccode>=B3*C3\u003c/code> in row 3, and so on. These moving addresses are called \u003cb>relative references\u003c/b>.\u003c/p>","demo":{"data":[["Item","Qty","Rate (₹)","Amount (₹)"],["Pens (box)",12,120,null],["Folders",30,25,null],["Ink bottles",6,90,null],["Diaries",10,210,null]],"fmt":{"C":"inr0","D":"inr0"},"steps":[{"say":"Four items, each needing qty × rate. Start with the first row only: in \u003cb>D2\u003c/b>, type \u003ccode>=B2*C2\u003c/code>.","hl":["B2","C2"],"at":"D2","f":"=B2*C2"},{"say":"Press Enter: ₹1,440 for the pens.","at":"D2","f":"=B2*C2","enter":true},{"say":"Now drag the fill handle from D2 down to D5. Every row gets its own answer.","at":"D2","fill":"D2:D5","f":"=B2*C2","enter":true},{"say":"Click \u003cb>D4\u003c/b> and look at the formula bar: it says \u003ccode>=B4*C4\u003c/code>. Excel moved the row numbers for you.","hl":["B4","C4"],"at":"D4"}]},"remember":["Write the formula once, in the first row.","Fill it down; the row numbers move with it.","In Excel, double-click the fill handle to fill to the end of your data."]}},{"id":"m01e08","t":"Join text with &","learn":"\u003cp>The \u003ccode>&amp;\u003c/code> sign joins text. \u003ccode>=\"INV-\"&amp;A2\u003c/code> turns 101 into INV-101. Text you type yourself goes inside double quotes, including spaces.\u003c/p>","syn":"=\"INV-\"&A2&\" \"&B2","data":[["Invoice no.","Customer","Label"],[101,"Mehta Stores",null],[102,"Rao Agencies",null],[103,"Kaveri Textiles",null]],"tasks":[{"fill":"C2:C4","ask":"In \u003cb>C2\u003c/b>, build a label like \u003cb>INV-101 Mehta Stores\u003c/b> (one space before the name). It fills down to C4.","sol":"=\"INV-\"&A2&\" \"&B2","hint":"Join four pieces: \u003ccode>=\"INV-\"&amp;A2&amp;\" \"&amp;B2\u003c/code>"}],"lesson":{"why":"\u003cp>The \u003ccode>&amp;\u003c/code> sign joins text together. Anything you type yourself, including a space, goes inside double quotes: \u003ccode>\" \"\u003c/code>.\u003c/p>\u003cp>Joining is handy for labels, invoice numbers and full names built from separate columns.\u003c/p>","demo":{"data":[["First name","Last name","Full name"],["Ravi","Kumar",null],["Fatima","Sheikh",null]],"steps":[{"say":"First names are in column A and last names in column B. We want the full name in column C.","hl":["A2","B2"]},{"say":"Try joining them directly: \u003ccode>=A2&amp;B2\u003c/code>.","hl":["A2","B2"],"at":"C2","f":"=A2&B2"},{"say":"Press Enter: \u003cb>RaviKumar\u003c/b>. The words are stuck together, because &amp; joins exactly what you give it.","at":"C2","f":"=A2&B2","enter":true},{"say":"Add a space in quotes between them: \u003ccode>=A2&amp;\" \"&amp;B2\u003c/code>.","hl":["A2","B2"],"at":"C2","f":"=A2&\" \"&B2"},{"say":"Press Enter and fill down: \u003cb>Ravi Kumar\u003c/b> and \u003cb>Fatima Sheikh\u003c/b>.","at":"C2","fill":"C2:C3","f":"=A2&\" \"&B2","enter":true}]},"remember":["\u003ccode>&amp;\u003c/code> joins text.","Your own text, even a space, goes in double quotes.","Example: \u003ccode>=\"INV-\"&amp;A2\u003c/code> turns 101 into INV-101."]}}]},{"id":"m02","no":2,"title":"Everyday functions","level":"Newbie","sample":true,"blurb":"SUM, AVERAGE, MAX, MIN, COUNT, COUNTA and ROUND, plus running totals and row and column totals.","ex":[{"id":"m02e01","t":"SUM a column","learn":"\u003cp>A \u003cb>function\u003c/b> is a ready-made formula. \u003ccode>SUM\u003c/code> adds a whole range. \u003ccode>B2:B7\u003c/code> means \"B2 to B7\": the colon joins the first and last cell.\u003c/p>\u003cp>This beats \u003ccode>=B2+B3+B4+B5+B6+B7\u003c/code>, and it still works when you insert a row inside the range.\u003c/p>","syn":"=SUM(B2:B7)","data":[["Expense","Amount (₹)"],["Rent",45000],["Salaries",186000],["Electricity",8400],["Internet",1999],["Travel",12650],["Stationery",3120],["Total",null]],"fmt":{"B":"inr0"},"tasks":[{"cell":"B8","ask":"In \u003cb>B8\u003c/b>, total all expenses with SUM.","sol":"=SUM(B2:B7)","use":["SUM"],"hint":"\u003ccode>=SUM(B2:B7)\u003c/code>"}],"tip":"Shortcut: select the cell below a column and press Alt + = to insert SUM automatically.","lesson":{"why":"\u003cp>A \u003cb>function\u003c/b> is a ready-made formula with a name. \u003ccode>SUM\u003c/code> adds up a whole block of cells in one go, so you don't have to write \u003ccode>=B2+B3+B4+B5\u003c/code>.\u003c/p>\u003cp>You give it a \u003cb>range\u003c/b>: the first cell, a colon, and the last cell. \u003ccode>B2:B5\u003c/code> means \"B2 to B5\". The numbers go inside brackets after the name: \u003ccode>=SUM(B2:B5)\u003c/code>.\u003c/p>\u003cp>The common trap is leaving out a row, so always check the first and last cell of the range. A good habit: put totals in the row just below the list.\u003c/p>","demo":{"data":[["Petty cash item","Amount (₹)"],["Tea and snacks",1850],["Courier",640],["Printing",2300],["Cab fares",1275],["Total",null]],"fmt":{"B":"inr0"},"steps":[{"say":"Four petty cash payments sit in \u003cb>B2\u003c/b> to \u003cb>B5\u003c/b>. That block is the range \u003cb>B2:B5\u003c/b>.","hl":["B2:B5"]},{"say":"In \u003cb>B6\u003c/b>, type the function name, an opening bracket, the range and a closing bracket.","hl":["B2:B5"],"at":"B6","f":"=SUM(B2:B5)"},{"say":"Press Enter: ₹6,065. One short formula added all four rows.","at":"B6","f":"=SUM(B2:B5)","enter":true},{"say":"The courier bill was actually ₹900. Change B3 and the total updates to ₹6,325.","hl":["B3"],"at":"B6","set":{"B3":900}}]},"remember":["\u003ccode>=SUM(B2:B5)\u003c/code> adds every cell from B2 to B5.","A range is first cell : last cell.","Check the range covers every row, no more and no less.","Shortcut in Excel: Alt + = inserts SUM for you."]}},{"id":"m02e02","t":"AVERAGE","learn":"\u003cp>\u003ccode>AVERAGE\u003c/code> adds the numbers and divides by how many there are. It skips empty cells, which is usually what you want.\u003c/p>","syn":"=AVERAGE(B2:B7)","data":[["Month","Sales (₹)"],["Apr",312000],["May",287500],["Jun",341200],["Jul",298800],["Aug",365400],["Sep",402100],["Average",null]],"fmt":{"B":"inr0"},"cfmt":{"B8":"inr"},"tasks":[{"cell":"B8","ask":"In \u003cb>B8\u003c/b>, find the average monthly sales.","sol":"=AVERAGE(B2:B7)","use":["AVERAGE"],"hint":"\u003ccode>=AVERAGE(B2:B7)\u003c/code>"}],"lesson":{"why":"\u003cp>\u003ccode>AVERAGE\u003c/code> adds the numbers in a range and divides by how many numbers there are. Accountants use it for average monthly sales, average bill value and average salary.\u003c/p>\u003cp>It is written like SUM: \u003ccode>=AVERAGE(B2:B6)\u003c/code>.\u003c/p>\u003cp>Watch the difference between a \u003cb>blank\u003c/b> cell and a \u003cb>zero\u003c/b>. AVERAGE skips blank cells, but a 0 is a real number and gets counted, which pulls the average down.\u003c/p>","demo":{"data":[["Day","Cash sales (₹)"],["Mon",12400],["Tue",9800],["Wed",null],["Thu",15600],["Fri",11200],["Average",null]],"fmt":{"B":"inr0"},"cfmt":{"B7":"inr"},"steps":[{"say":"A shop's cash sales for one week. It was closed on Wednesday, so \u003cb>B4\u003c/b> is blank.","hl":["B2:B6"]},{"say":"In \u003cb>B7\u003c/b>, type \u003ccode>=AVERAGE(B2:B6)\u003c/code>.","hl":["B2:B6"],"at":"B7","f":"=AVERAGE(B2:B6)"},{"say":"Press Enter: ₹12,250. That's ₹49,000 divided by 4 days, because AVERAGE skipped the blank Wednesday.","at":"B7","f":"=AVERAGE(B2:B6)","enter":true},{"say":"Now someone types 0 for Wednesday. Zero is a number, so it counts: ₹49,000 ÷ 5 = ₹9,800. Leave a cell blank if there's no data.","hl":["B4"],"at":"B7","set":{"B4":0}}]},"remember":["\u003ccode>=AVERAGE(range)\u003c/code> = total ÷ how many numbers.","Blank cells are skipped; zeros are counted.","Leave a cell empty when there is no data, don't type 0."]}},{"id":"m02e03","t":"Best and worst month: MAX and MIN","learn":"\u003cp>\u003ccode>MAX\u003c/code> returns the biggest number in a range, and \u003ccode>MIN\u003c/code> the smallest. The Indian financial year runs April to March, so the list starts in April.\u003c/p>","syn":"=MAX(B2:B13)","data":[["Month","Sales (₹)","","Measure","Value"],["Apr",412000,null,"Highest month",null],["May",386500,null,"Lowest month",null],["Jun",355000],["Jul",398200],["Aug",441750],["Sep",468900],["Oct",521300],["Nov",489600],["Dec",455250],["Jan",402800],["Feb",376400],["Mar",548100]],"fmt":{"B":"inr0","E":"inr0"},"tasks":[{"cell":"E2","ask":"In \u003cb>E2\u003c/b>, find the highest monthly sales.","sol":"=MAX(B2:B13)","use":["MAX"],"hint":"\u003ccode>=MAX(B2:B13)\u003c/code>"},{"cell":"E3","ask":"In \u003cb>E3\u003c/b>, find the lowest.","sol":"=MIN(B2:B13)","use":["MIN"],"hint":"\u003ccode>=MIN(B2:B13)\u003c/code>"}],"lesson":{"why":"\u003cp>\u003ccode>MAX\u003c/code> gives the biggest number in a range and \u003ccode>MIN\u003c/code> gives the smallest. They answer questions like \"best month\", \"highest invoice\" or \"cheapest quote\" without you scanning the list by eye.\u003c/p>\u003cp>Both are written like SUM: \u003ccode>=MAX(B2:B5)\u003c/code> and \u003ccode>=MIN(B2:B5)\u003c/code>. Point them at the same range, and make sure the range covers every row, or a row left outside it is ignored.\u003c/p>","demo":{"data":[["Vendor","Laptop quote (₹)",null,"Measure","Value"],["Sharma IT",58400,null,"Highest quote",null],["Anand Systems",54900,null,"Lowest quote",null],["Delta Tech",61250],["Om Computers",56300]],"fmt":{"B":"inr0","E":"inr0"},"steps":[{"say":"Four vendors have quoted for a laptop in \u003cb>B2:B5\u003c/b>. Purchase wants the highest and lowest quote.","hl":["B2:B5"]},{"say":"In \u003cb>E2\u003c/b>, type \u003ccode>=MAX(B2:B5)\u003c/code>.","hl":["B2:B5"],"at":"E2","f":"=MAX(B2:B5)"},{"say":"Press Enter: ₹61,250, Delta Tech's quote.","at":"E2","f":"=MAX(B2:B5)","enter":true},{"say":"In \u003cb>E3\u003c/b>, the same range with MIN. Press Enter: ₹54,900 from Anand Systems.","hl":["B2:B5"],"at":"E3","f":"=MIN(B2:B5)","enter":true},{"say":"Sharma IT revises its quote to ₹53,500. The lowest quote updates to ₹53,500 by itself.","hl":["B2"],"at":"E3","set":{"B2":53500}}]},"remember":["\u003ccode>=MAX(range)\u003c/code> finds the biggest number.","\u003ccode>=MIN(range)\u003c/code> finds the smallest.","Both update when a number in the range changes."]}},{"id":"m02e04","t":"COUNT vs COUNTA","learn":"\u003cp>\u003ccode>COUNT\u003c/code> counts cells that hold \u003cb>numbers\u003c/b>. \u003ccode>COUNTA\u003c/code> counts cells that are \u003cb>not empty\u003c/b>, text included.\u003c/p>\u003cp>So with a list of customers where some bills aren't raised yet, COUNTA on names tells you how many customers there are, and COUNT on amounts tells you how many have been billed.\u003c/p>","syn":"=COUNT(B2:B9)","data":[["Customer","Bill (₹)","","Measure","Value"],["Mehta Stores",18400,null,"Customers",null],["Rao Agencies",null,null,"Bills raised",null],["Kaveri Textiles",52300],["Sai Traders","Pending"],["Patel & Sons",9650],["Joshi Pharma",null],["Nair Foods",27800],["Gupta Hardware",14200]],"fmt":{"B":"inr0"},"tasks":[{"cell":"E2","ask":"In \u003cb>E2\u003c/b>, count how many customers are listed.","sol":"=COUNTA(A2:A9)","use":["COUNTA"],"hint":"\u003ccode>=COUNTA(A2:A9)\u003c/code>"},{"cell":"E3","ask":"In \u003cb>E3\u003c/b>, count how many bills have an amount.","sol":"=COUNT(B2:B9)","use":["COUNT"],"hint":"\u003ccode>=COUNT(B2:B9)\u003c/code>. COUNT ignores the text \"Pending\" and the blanks."}],"lesson":{"why":"\u003cp>There are two counting functions, and they count different things:\u003c/p>\u003cul>\u003cli>\u003ccode>COUNT\u003c/code> counts cells that hold \u003cb>numbers\u003c/b>. Text and blanks are ignored.\u003c/li>\u003cli>\u003ccode>COUNTA\u003c/code> counts cells that are \u003cb>not empty\u003c/b>, so text counts too.\u003c/li>\u003c/ul>\u003cp>Use COUNTA on a names column to find how many people or customers are listed. Use COUNT on an amounts column to find how many actually have a figure.\u003c/p>\u003cp>The trap: a word like \"Pending\" in an amounts column is not a number. COUNTA counts it, COUNT doesn't.\u003c/p>","demo":{"data":[["Student","Fee paid (₹)",null,"Measure","Value"],["Arjun",12000,null,"Students",null],["Meena",null,null,"Fees received",null],["Kabir","Cheque bounced"],["Divya",12000],["Rahul",8000]],"fmt":{"B":"inr0"},"steps":[{"say":"Five students are listed. Meena hasn't paid (blank) and Kabir's cheque bounced (text, not a number).","hl":["A2:A6","B2:B6"]},{"say":"How many students? Every name cell is filled, so use COUNTA on column A. Press Enter: 5.","hl":["A2:A6"],"at":"E2","f":"=COUNTA(A2:A6)","enter":true},{"say":"How many fees were received? Try COUNTA on column B first: 4. Wrong! It counted the text \"Cheque bounced\" as well.","hl":["B2:B6"],"at":"E3","f":"=COUNTA(B2:B6)","enter":true},{"say":"Switch to COUNT, which only counts numbers: \u003ccode>=COUNT(B2:B6)\u003c/code>.","hl":["B2:B6"],"at":"E3","f":"=COUNT(B2:B6)"},{"say":"Press Enter: 3. Only Arjun, Divya and Rahul have an amount.","at":"E3","f":"=COUNT(B2:B6)","enter":true}]},"remember":["\u003ccode>COUNT\u003c/code> counts numbers only.","\u003ccode>COUNTA\u003c/code> counts anything that isn't empty, text included.","Names column: COUNTA. Amounts column: COUNT.","Neither one counts blank cells."]}},{"id":"m02e05","t":"ROUND to rupees and paise","learn":"\u003cp>Interest and tax calculations create long decimals. \u003ccode>ROUND(number, digits)\u003c/code> rounds them. Use 2 digits for paise and 0 for whole rupees.\u003c/p>\u003cp>Simple interest for some days is principal × rate × days ÷ 365.\u003c/p>","syn":"=ROUND(B2*B3*B4/365,2)","data":[["Detail","Value"],["Principal (₹)",157350],["Interest rate (yearly)",0.0725],["Days",73],["Interest (₹, to paise)",null],["Interest (₹, whole rupees)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"int","B5":"inr","B6":"inr0"},"tasks":[{"cell":"B5","ask":"In \u003cb>B5\u003c/b>, work out the interest and round it to 2 decimals.","sol":"=ROUND(B2*B3*B4/365,2)","use":["ROUND"],"hint":"Put the whole calculation inside ROUND: \u003ccode>=ROUND(B2*B3*B4/365,2)\u003c/code>"},{"cell":"B6","ask":"In \u003cb>B6\u003c/b>, round B5 to the nearest rupee.","sol":"=ROUND(B5,0)","use":["ROUND"],"hint":"\u003ccode>=ROUND(B5,0)\u003c/code>"}],"tip":"Formatting a cell to show 2 decimals only hides the extra digits; the full number is still used in totals. ROUND actually changes the value.","lesson":{"why":"\u003cp>Tax and interest maths often gives long decimals like 512.982. Money only has two decimal places (paise), so you round.\u003c/p>\u003cp>\u003ccode>ROUND(number, digits)\u003c/code> rounds the number to that many decimals. Use \u003cb>2\u003c/b> for paise and \u003cb>0\u003c/b> for whole rupees. You can put a whole calculation inside it: \u003ccode>=ROUND(B2*B3,2)\u003c/code>.\u003c/p>\u003cp>The trap: formatting a cell to show 2 decimals only \u003cb>hides\u003c/b> the extra digits. The full value is still used in totals, so they can be off by a paisa. ROUND actually changes the value.\u003c/p>","demo":{"data":[["Detail","Value"],["Price (₹)",2849.9],["GST rate",0.18],["GST (₹, to paise)",null],["GST (₹, whole rupees)",null]],"cfmt":{"B2":"inr","B3":"pct","B4":"inr","B5":"inr0"},"steps":[{"say":"GST at 18% (\u003cb>B3\u003c/b>) on a price of ₹2,849.90 (\u003cb>B2\u003c/b>).","hl":["B2","B3"]},{"say":"Plain multiplication: \u003ccode>=B2*B3\u003c/code>. The cell shows ₹512.98, but the real value is 512.982. The extra 2 is only hidden by the format.","hl":["B2","B3"],"at":"B4","f":"=B2*B3","enter":true},{"say":"Wrap the calculation in ROUND with 2 digits: \u003ccode>=ROUND(B2*B3,2)\u003c/code>.","hl":["B2","B3"],"at":"B4","f":"=ROUND(B2*B3,2)"},{"say":"Press Enter: ₹512.98, and now the stored value really is 512.98.","at":"B4","f":"=ROUND(B2*B3,2)","enter":true},{"say":"For whole rupees, round B4 with 0 digits: \u003ccode>=ROUND(B4,0)\u003c/code>. Press Enter: ₹513.","hl":["B4"],"at":"B5","f":"=ROUND(B4,0)","enter":true}]},"remember":["\u003ccode>=ROUND(number, 2)\u003c/code> rounds to paise; \u003ccode>0\u003c/code> rounds to whole rupees.","Put the whole calculation inside ROUND.","Formatting hides decimals; ROUND changes the value."]}},{"id":"m02e06","t":"Running total","learn":"\u003cp>A running (cumulative) total adds each month to the total so far. The first row is just the first month. From row 3 on, it's \u003cb>the total above + this month\u003c/b>.\u003c/p>","syn":"=C2+B3","data":[["Month","Collections (₹)","Running total (₹)"],["Apr",84000,null],["May",91500,null],["Jun",77250,null],["Jul",102400,null],["Aug",96800,null],["Sep",110300,null]],"fmt":{"B":"inr0","C":"inr0"},"tasks":[{"cell":"C2","ask":"In \u003cb>C2\u003c/b>, start the running total (it equals April's collection).","sol":"=B2","hint":"\u003ccode>=B2\u003c/code>"},{"fill":"C3:C7","ask":"In \u003cb>C3\u003c/b>, add the total above to this month. It fills down to C7.","sol":"=C2+B3","hint":"\u003ccode>=C2+B3\u003c/code>"}],"lesson":{"why":"\u003cp>A \u003cb>running total\u003c/b> (cumulative total) shows the total so far after each row: units sold to date, collections to date, expenses to date.\u003c/p>\u003cp>The first row is just the first amount. From the second row on, it's \u003cb>the running total above + this row's amount\u003c/b>. Write that once and fill it down; each row points at the row above it.\u003c/p>\u003cp>The trap is adding only two amounts (\u003ccode>=B2+B3\u003c/code>), which gives a two-month total, not a total so far.\u003c/p>","demo":{"data":[["Week","Units sold","Units to date"],["Week 1",120,null],["Week 2",95,null],["Week 3",140,null],["Week 4",110,null]],"fmt":{"B":"int","C":"int"},"steps":[{"say":"Units sold each week are in column B. We want the total so far in column C.","hl":["B2:B5"]},{"say":"The first week's running total is just week 1. In \u003cb>C2\u003c/b>, type \u003ccode>=B2\u003c/code> and press Enter: 120.","hl":["B2"],"at":"C2","f":"=B2","enter":true},{"say":"In \u003cb>C3\u003c/b>: the total above (C2) plus this week (B3).","hl":["C2","B3"],"at":"C3","f":"=C2+B3"},{"say":"Press Enter: 215.","at":"C3","f":"=C2+B3","enter":true},{"say":"Fill C3 down to C5: 355 after week 3 and 465 after week 4. Click \u003cb>C5\u003c/b> and the formula reads \u003ccode>=C4+B5\u003c/code>.","at":"C3","fill":"C3:C5","f":"=C2+B3","enter":true}]},"remember":["First row: \u003ccode>=B2\u003c/code>.","Next rows: total above + this row, like \u003ccode>=C2+B3\u003c/code>.","The last running total equals the SUM of the whole column, a quick check."]}},{"id":"m02e07","t":"Row and column totals","learn":"\u003cp>Reports need totals both ways: across each row and down each column. Write the formula once and fill it across or down.\u003c/p>\u003cp>When you fill \u003cb>across\u003c/b>, Excel shifts the column letters: \u003ccode>=SUM(B2:B4)\u003c/code> becomes \u003ccode>=SUM(C2:C4)\u003c/code> in the next column.\u003c/p>","syn":"=SUM(B2:D2)","data":[["Branch","Apr","May","Jun","Q1 total"],["Chennai",245000,262300,251800,null],["Pune",198400,205900,221350,null],["Kochi",132600,128750,141200,null],["Total",null,null,null,null]],"fmt":{"B":"inr0","C":"inr0","D":"inr0","E":"inr0"},"tasks":[{"fill":"E2:E4","ask":"In \u003cb>E2\u003c/b>, total Chennai's quarter. It fills down to E4.","sol":"=SUM(B2:D2)","use":["SUM"],"hint":"\u003ccode>=SUM(B2:D2)\u003c/code>"},{"fill":"B5:D5","ask":"In \u003cb>B5\u003c/b>, total April for all branches. It fills across to D5.","sol":"=SUM(B2:B4)","use":["SUM"],"hint":"\u003ccode>=SUM(B2:B4)\u003c/code>"},{"cell":"E5","ask":"In \u003cb>E5\u003c/b>, find the grand total.","sol":"=SUM(B2:D4)","hint":"Sum the whole block: \u003ccode>=SUM(B2:D4)\u003c/code>, or \u003ccode>=SUM(E2:E4)\u003c/code>."}],"lesson":{"why":"\u003cp>Most reports need totals both ways: \u003cb>across\u003c/b> each row (per person or branch) and \u003cb>down\u003c/b> each column (per month or head).\u003c/p>\u003cp>Write the row total once and fill it \u003cb>down\u003c/b>; the row numbers move. Write the column total once and fill it \u003cb>across\u003c/b>; the column letters move, so \u003ccode>=SUM(B2:B3)\u003c/code> becomes \u003ccode>=SUM(C2:C3)\u003c/code>.\u003c/p>\u003cp>The grand total in the corner can sum the whole block. It should match both the sum of the row totals and the sum of the column totals, a handy cross-check.\u003c/p>","demo":{"data":[["Staff","Basic (₹)","HRA (₹)","Total (₹)"],["Asha",30000,12000,null],["Imran",26000,10400,null],["Total",null,null,null]],"fmt":{"B":"inr0","C":"inr0","D":"inr0"},"steps":[{"say":"A two-person salary sheet: basic and HRA. We need each person's total and each column's total.","hl":["B2:C3"]},{"say":"Row total first. In \u003cb>D2\u003c/b>, sum across Asha's row: \u003ccode>=SUM(B2:C2)\u003c/code>.","hl":["B2:C2"],"at":"D2","f":"=SUM(B2:C2)"},{"say":"Press Enter and fill down to D3: ₹42,000 for Asha and ₹36,400 for Imran.","at":"D2","fill":"D2:D3","f":"=SUM(B2:C2)","enter":true},{"say":"Column total: in \u003cb>B4\u003c/b>, \u003ccode>=SUM(B2:B3)\u003c/code>, then fill across to C4. Basic totals ₹56,000 and HRA ₹22,400.","hl":["B2:B3"],"at":"B4","fill":"B4:C4","f":"=SUM(B2:B3)","enter":true},{"say":"Grand total in \u003cb>D4\u003c/b>: sum the whole block B2:C3. Press Enter: ₹78,400, which matches 42,000 + 36,400 and 56,000 + 22,400.","hl":["B2:C3"],"at":"D4","f":"=SUM(B2:C3)","enter":true}]},"remember":["Row total: fill down. Column total: fill across.","Filling across moves the column letters.","Grand total = sum of the whole block, and it should match both ways."]}}]},{"id":"m03","no":3,"title":"Cell references and $","level":"Beginner","blurb":"Relative, absolute and mixed references: the one idea that separates beginners from pros.","ex":[{"id":"m03e01","t":"Relative references at work","locked":true},{"id":"m03e02","t":"Absolute references: lock the rate with $","locked":true},{"id":"m03e03","t":"Share of total","locked":true},{"id":"m03e04","t":"Growth percentage","locked":true},{"id":"m03e05","t":"Budget vs actual","locked":true},{"id":"m03e06","t":"Fill across with a locked growth rate","locked":true},{"id":"m03e07","t":"Mixed references: a commission grid","locked":true}],"locked":true,"total":7},{"id":"m04","no":4,"title":"Logic: IF, AND, OR","level":"Beginner","blurb":"Make the sheet decide: status flags, bonuses, eligibility checks, slabs and safe division.","ex":[{"id":"m04e01","t":"IF: within budget or over?","locked":true},{"id":"m04e02","t":"IF with a calculation: sales bonus","locked":true},{"id":"m04e03","t":"AND: loan eligibility","locked":true},{"id":"m04e04","t":"OR: flag invoices for review","locked":true},{"id":"m04e05","t":"Not equal: what's still outstanding?","locked":true},{"id":"m04e06","t":"Nested IF: discount slabs","locked":true},{"id":"m04e07","t":"IFS: cleaner slabs","locked":true},{"id":"m04e08","t":"IFERROR: no more #DIV/0!","locked":true}],"locked":true,"total":8},{"id":"m05","no":5,"title":"SUMIF, COUNTIF and friends","level":"Intermediate","blurb":"Add and count only what matches: by region, status, amount, date range or part of a name.","ex":[{"id":"m05e01","t":"SUMIF: total for one region","locked":true},{"id":"m05e02","t":"COUNTIF: how many unpaid?","locked":true},{"id":"m05e03","t":"Criteria with > and \u003c","locked":true},{"id":"m05e04","t":"Build a summary table (a pivot, by formula)","locked":true},{"id":"m05e05","t":"SUMIFS: more than one condition","locked":true},{"id":"m05e06","t":"COUNTIFS and AVERAGEIF","locked":true},{"id":"m05e07","t":"Criteria from a cell, with an operator","locked":true},{"id":"m05e08","t":"Sales between two dates","locked":true},{"id":"m05e09","t":"Wildcards: match part of a name","locked":true}],"locked":true,"total":9},{"id":"m06","no":6,"title":"Lookups: VLOOKUP to XLOOKUP","level":"Intermediate","blurb":"Pull prices, rates and names from master tables: VLOOKUP, slabs, HLOOKUP, INDEX/MATCH, XLOOKUP and two-way lookups.","ex":[{"id":"m06e01","t":"VLOOKUP: find a price by code","locked":true},{"id":"m06e02","t":"VLOOKUP down an order","locked":true},{"id":"m06e03","t":"Approximate match: commission slabs","locked":true},{"id":"m06e04","t":"HLOOKUP: a sideways table","locked":true},{"id":"m06e05","t":"MATCH: where is it?","locked":true},{"id":"m06e06","t":"INDEX + MATCH: look to the left","locked":true},{"id":"m06e07","t":"XLOOKUP, with a not-found message","locked":true},{"id":"m06e08","t":"Two-way lookup: row and column","locked":true}],"locked":true,"total":8},{"id":"m07","no":7,"title":"Text: clean and split data","level":"Intermediate","blurb":"Fix messy imports: TRIM, PROPER, LEFT, MID, RIGHT, FIND, SUBSTITUTE, VALUE, TEXT and LEN, on GSTINs, PANs and ledgers.","ex":[{"id":"m07e01","t":"TRIM and PROPER: tidy names","locked":true},{"id":"m07e02","t":"LEFT: state code from a GSTIN","locked":true},{"id":"m07e03","t":"MID: PAN from a GSTIN","locked":true},{"id":"m07e04","t":"RIGHT: mask an account number","locked":true},{"id":"m07e05","t":"FIND: split \"Name - City\"","locked":true},{"id":"m07e06","t":"SUBSTITUTE and VALUE: text amounts to numbers","locked":true},{"id":"m07e07","t":"TEXT: dates and amounts inside sentences","locked":true},{"id":"m07e08","t":"LEN: check a PAN's length","locked":true}],"locked":true,"total":8},{"id":"a01","title":"Clean messy data","level":"Intermediate","blurb":"Real exports are messy. Find duplicates, fix spacing and capitals, turn text into numbers, split columns and handle blanks before you analyse anything.","ex":[{"id":"a01e01","t":"Find duplicate entries","locked":true},{"id":"a01e02","t":"Standardise names with TRIM and PROPER","learn":"\u003cp>\" mumbai\", \"MUMBAI \" and \"Mumbai\" look the same to you, but not to COUNTIF or a pivot. \u003ccode>TRIM\u003c/code> removes extra spaces and \u003ccode>PROPER\u003c/code> fixes capitals. Clean into a helper column, then analyse the clean column.\u003c/p>","syn":"=PROPER(TRIM(A2))","data":[["City (raw)","City (clean)","","City","Orders"],[" mumbai",null,"","Mumbai",null],["PUNE",null,"","",""],["Mumbai ",null],["delhi",null],["MUMBAI",null],["  Pune",null]],"exactText":true,"tasks":[{"fill":"B2:B7","ask":"In \u003cb>B2\u003c/b>, clean the city name: no extra spaces, capital first letter. It fills down.","sol":"=PROPER(TRIM(A2))","use":["TRIM","PROPER"],"hint":"\u003ccode>=PROPER(TRIM(A2))\u003c/code>"},{"cell":"E2","ask":"In \u003cb>E2\u003c/b>, count how many orders are from the city in D2, using the \u003cb>clean\u003c/b> column.","sol":"=COUNTIF(B2:B7,D2)","use":["COUNTIF"],"hint":"\u003ccode>=COUNTIF(B2:B7,D2)\u003c/code> gives 3. On the raw column it would miss the copies with spaces."}],"lesson":{"why":"\u003cp>Exports from billing software, forms and CRMs often come with stray spaces and random capitals. Counting, lookups and pivots treat each spelling as different.\u003c/p>\u003cul>\u003cli>\u003ccode>TRIM(text)\u003c/code> removes spaces at the start and end, and squeezes double spaces to one.\u003c/li>\u003cli>\u003ccode>PROPER(text)\u003c/code> capitalises each word. \u003ccode>UPPER\u003c/code> and \u003ccode>LOWER\u003c/code> also exist.\u003c/li>\u003c/ul>\u003cp>Nest them: \u003ccode>=PROPER(TRIM(A2))\u003c/code>. Excel works from the inside out.\u003c/p>","demo":{"data":[["Category (raw)","Clean"],["  home ",null],["HOME",null],["Fashion",null]],"steps":[{"say":"Three spellings, but two of them are the same category.","hl":["A2","A3"]},{"say":"TRIM removes the spaces, then PROPER fixes the capitals.","at":"B2","f":"=PROPER(TRIM(A2))","fill":"B2:B4","enter":true},{"say":"Now both read \u003cb>Home\u003c/b>, so a count or pivot puts them together.","hl":["B2","B3"]}]},"remember":["Clean into a helper column, then analyse the clean one.","\u003ccode>=PROPER(TRIM(A2))\u003c/code> fixes spaces and capitals together.","Once it's clean, copy the column and Paste Special → Values if you want to drop the formulas."]}},{"id":"a01e03","t":"Turn text amounts into numbers","locked":true},{"id":"a01e04","t":"Split one column into two","locked":true},{"id":"a01e05","t":"Check data quality: blanks and bad values","locked":true},{"id":"a01e06","t":"Fill in missing values","locked":true}],"no":8,"locked":true,"total":6},{"id":"m08","no":9,"title":"Dates and time periods","level":"Intermediate","blurb":"Work with dates the way reports need them: due dates, days between, ageing buckets, month ends, financial-year labels, working days and durations.","ex":[{"id":"m08e01","t":"Due date = invoice date + credit days","locked":true},{"id":"m08e02","t":"Days overdue","locked":true},{"id":"m08e03","t":"Ageing buckets","locked":true},{"id":"m08e04","t":"EOMONTH: month-end dates","locked":true},{"id":"m08e05","t":"EDATE: EMI due dates","locked":true},{"id":"m08e06","t":"Financial year label","locked":true},{"id":"m08e07","t":"NETWORKDAYS: working days","locked":true},{"id":"m08e08","t":"DATEDIF: years of service","locked":true}],"locked":true,"total":8},{"id":"m09","no":10,"title":"Maths for analysis","level":"Advanced","blurb":"SUMPRODUCT, weighted averages, CAGR, biggest variances with ABS and LARGE, and ranking with RANK.","ex":[{"id":"m09e01","t":"SUMPRODUCT: an invoice total in one cell","locked":true},{"id":"m09e02","t":"Weighted average cost","locked":true},{"id":"m09e03","t":"CAGR: growth per year","locked":true},{"id":"m09e07","t":"ABS and LARGE: biggest variances","locked":true},{"id":"m09e08","t":"RANK: league table of branches","locked":true}],"locked":true,"total":5},{"id":"a02","title":"Describe your data: statistics","level":"Advanced","blurb":"Summarise a column the way analysts do: average vs median, the most common value, spread, percentiles, conditional max and min, correlation and a simple trend forecast.","ex":[{"id":"a02e01","t":"Average or median?","locked":true},{"id":"a02e02","t":"The most common answer: MODE","locked":true},{"id":"a02e03","t":"How spread out? STDEV and range","locked":true},{"id":"a02e04","t":"Percentiles and quartiles","locked":true},{"id":"a02e05","t":"MAXIFS and MINIFS","locked":true},{"id":"a02e06","t":"CORREL: do two things move together?","locked":true},{"id":"a02e07","t":"A simple trend forecast","locked":true}],"no":11,"locked":true,"total":7},{"id":"a03","title":"Dynamic arrays: UNIQUE, SORT, FILTER","level":"Advanced","blurb":"One formula, many answers. List unique values, sort, filter rows by conditions, pull a top 3 and build summaries that resize themselves. Excel 2021, Microsoft 365 and Google Sheets.","ex":[{"id":"a03e01","t":"UNIQUE: list each city once","learn":"\u003cp>\u003ccode>UNIQUE(range)\u003c/code> returns each value once. It's a \u003cb>dynamic array\u003c/b> formula: you type it in one cell and the answers \u003cb>spill\u003c/b> into the cells below. Leave those cells empty, or you'll see \u003ccode>#SPILL!\u003c/code>.\u003c/p>","syn":"=UNIQUE(C2:C13)","data":[["Order ID","Date","City","Category","Channel","Units","Revenue (₹)","","Cities","","How many cities"],["ORD-1001","d:2026-04-03","Mumbai","Electronics","Online",2,45800],["ORD-1002","d:2026-04-09","Pune","Home","Store",5,12400],["ORD-1003","d:2026-04-15","Delhi","Fashion","Online",3,8700],["ORD-1004","d:2026-04-22","Mumbai","Home","Online",4,15600],["ORD-1005","d:2026-05-02","Chennai","Electronics","Store",1,32500],["ORD-1006","d:2026-05-11","Delhi","Electronics","Online",2,51200],["ORD-1007","d:2026-05-19","Pune","Fashion","Store",6,13800],["ORD-1008","d:2026-05-27","Chennai","Home","Online",3,9900],["ORD-1009","d:2026-06-04","Mumbai","Fashion","Store",4,11600],["ORD-1010","d:2026-06-12","Delhi","Home","Store",2,7400],["ORD-1011","d:2026-06-20","Pune","Electronics","Online",1,28900],["ORD-1012","d:2026-06-28","Chennai","Fashion","Online",5,14500]],"fmt":{"B":"date","G":"inr0"},"tasks":[{"cell":"I2","spill":"I2:I5","ask":"In \u003cb>I2\u003c/b>, list each city once. The list spills down from I2.","sol":"=UNIQUE(C2:C13)","use":["UNIQUE"],"hint":"\u003ccode>=UNIQUE(C2:C13)\u003c/code>"},{"cell":"K2","ask":"In \u003cb>K2\u003c/b>, count how many different cities there are, in one formula.","sol":"=COUNTA(UNIQUE(C2:C13))","use":["UNIQUE","COUNTA|ROWS"],"hint":"\u003ccode>=COUNTA(UNIQUE(C2:C13))\u003c/code>"}],"lesson":{"why":"\u003cp>Before Excel 365, listing distinct values meant Remove Duplicates or a pivot. Now one formula does it, and it updates when the data changes.\u003c/p>\u003cul>\u003cli>\u003ccode>=UNIQUE(range)\u003c/code> spills one row per distinct value.\u003c/li>\u003cli>Wrap it to count: \u003ccode>=COUNTA(UNIQUE(range))\u003c/code>.\u003c/li>\u003cli>\u003ccode>#SPILL!\u003c/code> means something is blocking the cells it needs.\u003c/li>\u003c/ul>","demo":{"data":[["Salesperson","","Team"],["Asha","",null],["Vikram","",""],["Asha",""],["Rohit",""],["Vikram",""]],"pad":"C5","steps":[{"say":"Five sales, three people.","hl":["A2:A6"]},{"say":"Type UNIQUE once, in C2 only.","at":"C2","f":"=UNIQUE(A2:A6)"},{"say":"Press Enter: Asha, Vikram and Rohit spill into C2:C4. Only C2 holds a formula.","at":"C2","f":"=UNIQUE(A2:A6)","enter":true,"hl":["C2:C4"]}]},"remember":["Type the formula once; results spill.","Keep the spill area empty, or you get #SPILL!.","Works in Excel 2021, Microsoft 365 and Google Sheets, not in Excel 2016/2019."]}},{"id":"a03e02","t":"SORT: a ranked list in one formula","locked":true},{"id":"a03e03","t":"FILTER: pull the rows you need","locked":true},{"id":"a03e04","t":"FILTER with two conditions","locked":true},{"id":"a03e05","t":"Top 3 with SORTBY and TAKE","locked":true},{"id":"a03e06","t":"A summary table that builds itself","locked":true},{"id":"a03e07","t":"SEQUENCE: number a list instantly","locked":true},{"id":"a03e08","t":"Dynamic arrays: check yourself","type":"mcq","locked":true}],"no":12,"locked":true,"total":8},{"id":"a04","title":"KPIs and dashboard maths","level":"Advanced","blurb":"The numbers every business dashboard shows: month-on-month growth, average order value, conversion rate, target achievement, the top performer, Pareto (80/20) shares and KPI labels that update themselves.","ex":[{"id":"a04e01","t":"Month-on-month growth","locked":true},{"id":"a04e02","t":"Average order value and conversion rate","learn":"\u003cp>Two KPIs every online business tracks. \u003cb>Average order value (AOV)\u003c/b> = revenue ÷ orders. \u003cb>Conversion rate\u003c/b> = orders ÷ visitors. Wrap them in IFERROR in case a channel has no orders yet.\u003c/p>","syn":"=C2/B2","data":[["Channel","Visitors","Orders","Revenue (₹)","AOV (₹)","Conversion"],["Website",48000,1150,1955000,null,null],["App",22000,980,1421000,null,null],["Instagram",31000,410,533000,null,null],["Marketplace",56000,1890,2740500,null,null]],"fmt":{"B":"int","C":"int","D":"inr0","E":"inr","F":"pct"},"tasks":[{"fill":"E2:E5","ask":"In \u003cb>E2\u003c/b>, work out the average order value: revenue ÷ orders. It fills down.","sol":"=D2/C2","hint":"\u003ccode>=D2/C2\u003c/code>"},{"fill":"F2:F5","ask":"In \u003cb>F2\u003c/b>, work out the conversion rate: orders ÷ visitors. It fills down.","sol":"=C2/B2","hint":"\u003ccode>=C2/B2\u003c/code>"}],"lesson":{"why":"\u003cp>KPIs are usually simple ratios. The skill is knowing which number goes on top:\u003c/p>\u003cul>\u003cli>\u003cb>AOV\u003c/b> = revenue ÷ number of orders. \"How much does an order bring in?\"\u003c/li>\u003cli>\u003cb>Conversion rate\u003c/b> = orders ÷ visitors. \"What share of visitors buy?\"\u003c/li>\u003c/ul>","demo":{"data":[["Shop","Walk-ins","Bills","Sales (₹)","Avg bill","Conversion"],["Kothrud",500,120,96000,null,null]],"fmt":{"D":"inr0","E":"inr0","F":"pct"},"steps":[{"say":"Average bill: sales ÷ bills = ₹800.","at":"E2","f":"=D2/C2","enter":true},{"say":"Conversion: bills ÷ walk-ins = 24% of visitors bought something.","at":"F2","f":"=C2/B2","enter":true}]},"remember":["AOV = revenue ÷ orders.","Conversion = orders ÷ visitors.","Say each KPI in words before writing it."]}},{"id":"a04e03","t":"Target vs actual","locked":true},{"id":"a04e04","t":"Who's the top performer?","locked":true},{"id":"a04e05","t":"Pareto: share and cumulative share","locked":true},{"id":"a04e06","t":"KPI labels that update themselves","locked":true}],"no":13,"locked":true,"total":6},{"id":"a06","title":"Charts and dashboards","level":"Advanced","blurb":"Pick the chart that fits the message: line for trends, column and bar for comparisons, pie for parts of a whole. Chart a summary instead of raw data, and lay out a one-page dashboard.","ex":[{"id":"a06e01","t":"Line: daily website visitors","type":"tool","locked":true},{"id":"a06e02","t":"Column: Online vs Store by city","type":"tool","locked":true},{"id":"a06e03","t":"Bar: products with long names","type":"tool","locked":true},{"id":"a06e04","t":"Pie: share of orders by channel","type":"tool","locked":true},{"id":"a06e05","t":"Chart the summary, not the raw data","type":"tool","locked":true},{"id":"a06e06","t":"Dashboard design","type":"mcq","locked":true}],"no":14,"locked":true,"total":6},{"id":"m15","no":15,"title":"Excel tools: pivots, what-if and Solver","level":"Advanced","blurb":"Hands-on PivotTables, Goal Seek, Data Tables, Solver, charts, conditional formatting and data validation, plus what Power Query and macros do.","ex":[{"id":"m15e01","t":"PivotTable: sales by region","type":"tool","locked":true},{"id":"m15e02","t":"PivotTable: paid vs unpaid by salesperson","type":"tool","locked":true},{"id":"m15e03","t":"PivotTable: count the orders","type":"tool","locked":true},{"id":"m15e04","t":"Goal Seek: the price for a target profit","type":"tool","locked":true},{"id":"m15e05","t":"Goal Seek: the ad budget for a revenue target","type":"tool","locked":true},{"id":"m15e06","t":"Data Table: revenue at different conversion rates","type":"tool","locked":true},{"id":"m15e07","t":"Data Table: conversion × order value grid","type":"tool","locked":true},{"id":"m15e08","t":"Solver: the most profitable product mix","type":"tool","locked":true},{"id":"m15e09","t":"Chart: show a 12-month trend","type":"tool","locked":true},{"id":"m15e10","t":"Chart: budget vs actual","type":"tool","locked":true},{"id":"m15e11","t":"Conditional formatting: flag overdue invoices","type":"tool","locked":true},{"id":"m15e12","t":"Data validation: a payment-mode drop-down","type":"tool","locked":true},{"id":"m15e13","t":"Power Query and macros","type":"mcq","locked":true}],"locked":true,"total":13},{"id":"m12","no":16,"title":"Excel toolkit: shortcuts, pivots and more","level":"Advanced","blurb":"Quick quizzes on the tools around formulas: shortcuts, pivot tables, formatting, data validation, what-if analysis, charts and error codes.","ex":[{"id":"m12e01","t":"Shortcuts that save hours","type":"mcq","locked":true},{"id":"m12e02","t":"Pivot tables","type":"mcq","locked":true},{"id":"m12e03","t":"Formatting and data tools","type":"mcq","locked":true},{"id":"m12e04","t":"What-if analysis and charts","type":"mcq","locked":true},{"id":"m12e05","t":"Error decoder","type":"mcq","locked":true}],"locked":true,"total":5},{"id":"m14","no":17,"title":"Excel with AI","level":"Advanced","blurb":"Use AI chat tools such as ChatGPT, Gemini, Copilot or Claude to write, explain and fix formulas, then check every answer before you trust it.","ex":[{"id":"m14e01","t":"AI and spreadsheets: the ground rules","type":"mcq","locked":true},{"id":"m14e02","t":"Prompts that get good formulas","type":"mcq","locked":true},{"id":"m14e03","t":"Turn an AI reply into a working formula","locked":true},{"id":"m14e04","t":"Spot the AI's mistake: the missing FALSE","locked":true},{"id":"m14e06","t":"Fix the AI's text formulas","locked":true},{"id":"m14e07","t":"Check the AI's summary with your own formulas","locked":true},{"id":"m14e08","t":"Replace the AI's nested IF with a slab table","locked":true}],"locked":true,"total":7},{"id":"a05","title":"Final challenges: analytics cases","level":"Master","master":true,"blurb":"Five real analysis jobs with no hints up front, plus an interview warm-up quiz. Finish them, and every earlier exercise and quiz, to earn your certificate.","ex":[{"id":"a05e01","t":"City × category revenue grid","locked":true},{"id":"a05e02","t":"Clean and total a messy export","locked":true},{"id":"a05e03","t":"Repeat customers","locked":true},{"id":"a05e04","t":"Top 3 products report","locked":true},{"id":"a05e05","t":"Monthly dashboard","locked":true},{"id":"a05e06","t":"Interview warm-up: common Excel questions","type":"mcq","locked":true}],"no":18,"locked":true,"total":6}];
/* Formula engine: a small spreadsheet calculator that follows Excel's rules for the functions it supports. */
var FE = (function () {
  "use strict";
  function Err(code, why) { this.code = code; this.why = why || ""; }
  Err.prototype.toString = function () { return this.code; };
  var E = {
    div0: function () { return new Err("#DIV/0!", "Something is being divided by zero or by an empty cell."); },
    na: function (w) { return new Err("#N/A", w || "The value you looked up was not found."); },
    value: function (w) { return new Err("#VALUE!", w || "A function got the wrong type of value, such as text where a number was expected."); },
    ref: function () { return new Err("#REF!", "The formula points to a cell that does not exist."); },
    name: function (n) { return new Err("#NAME?", n ? "\"" + n + "\" is not a function or name this sheet knows. Check the spelling." : "Unknown name."); },
    num: function (w) { return new Err("#NUM!", w || "The calculation could not produce a valid number."); },
    circ: function () { return new Err("#CIRC!", "The formula refers to its own cell (a circular reference)."); },
    spill: function () { return new Err("#SPILL!", "This formula returns several values. Wrap it in SUM, or point to one cell."); }
  };
  function isErr(v) { return v instanceof Err; }
  function errOf(code) { var k = { "#DIV/0!": "div0", "#N/A": "na", "#VALUE!": "value", "#REF!": "ref", "#NAME?": "name", "#NUM!": "num", "#SPILL!": "spill" }[code]; return k ? E[k]() : new Err(code); }

  /* ---------- addresses ---------- */
  function colToNum(s) { var n = 0; s = s.toUpperCase(); for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64); return n; }

    }

    h += '<section class="card stack"><h3>Profiles on this device</h3><p class="small muted">' + (others ? others + " other profile" + (others > 1 ? "s" : "") + " on this device." : "This is the only profile on this device.") + '</p><div class="row"><button class="btn" data-act="switch">Switch or add a profile</button></div></section>';
    h += '<section class="card stack"><h3>Start again</h3><p class="small muted">Clears exercises, quizzes and XP for this profile. Your practice-lab workbook is kept.</p><div><button class="btn danger" data-act="wipe">Reset ' + esc(USER.name) + "'s progress</button></div></section>";
    h += '<section class="card stack"><h3>Remove this profile</h3><p class="small muted">Deletes ' + esc(USER.name) + "'s progress, XP and practice-lab workbook from this device. Make a backup code on the Progress page first if you might want it back.</p><div><button class=\"btn danger\" data-act=\"delprofile\">Remove " + esc(USER.name) + "</button></div></section></div>";
    return h;
  }
  function certView() {
    var T = totals(), left = [];
    MODS.forEach(function (m) { var c = modCount(m); if (c.d < c.t) left.push(m.no + ". " + m.title + " (" + (c.t - c.d) + " left)"); });
    var h = '<div class="crumb"><button class="btn ghost sm" data-go="progress">← Progress</button></div>';
