    if (left.length) return h + '<div class="stack"><h1 style="font-size:clamp(1.4rem,4vw,1.9rem)">Almost there</h1><p>Finish these to unlock your certificate:</p><ul>' + left.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></div>";
    var d = new Date(), ds = d.getDate() + " " + FE.MON[d.getMonth()] + " " + d.getFullYear();
    h += '<div class="stack"><label class="stack" style="gap:6px"><b>Name on the certificate</b><input class="txt" id="cname" value="' + esc(S.name) + '" placeholder="Your full name" maxlength="60"></label><div class="row"><button class="btn primary" data-act="print">Print or save as PDF</button></div>';
    h += '<div class="cert" id="cert"><div class="t1">Certificate of completion</div><div>This is to certify that</div><div class="nm" id="cn">' + esc(S.name || "Your name") + '</div><div>has completed every exercise, quiz and final challenge of</div><h2 style="color:#146C43">Excel for Data Analytics - Basics to Advanced</h2><div>18 modules: formulas and references, logic, SUMIFS, lookups, data cleaning, dates, statistics, dynamic arrays, KPI maths, charts and dashboards, PivotTables and what-if tools, and Excel with AI, reaching <b>Master</b> level with ' + xpTotal() + ' XP.</div><div style="margin-top:8px">' + ds + '</div><div class="sm">99DigiProStore · ' + esc(CFG.email) + '</div><div class="sm">Self-paced course completion, recorded on the learner\'s own device. Not an accredited qualification.</div></div></div>';
    return h;
  }

  function helpView() {
    return '<div class="stack prose"><div><span class="label">Help</span><h1 style="font-size:clamp(1.4rem,4vw,1.9rem)">How to use the lab</h1></div>' +
      '<section class="card stack"><h3>Doing an exercise</h3><ul><li>Each exercise starts with <b>Learn</b>: the idea in plain words, a worked example you click through with <b>Next step</b>, and the points to remember. Tap <b>Now you try</b> when you\'re ready.</li><li>On <b>Your turn</b>, read <b>Your tasks</b>. You can go back to <b>Learn</b> any time from the steps at the top.</li><li>Yellow cells are where you type. Click one, type a formula starting with <code>=</code> and press <b>Enter</b>. Your answer is checked at once.</li><li>Pale yellow cells are filled from your formula, just like dragging the fill handle in Excel.</li><li>While typing a formula, click a cell to insert its address, or drag across cells to insert a range. Press <b>F4</b> to add $ signs.</li><li>Stuck? Use <b>Hint</b>, then <b>Show answer</b>. You earn a little less XP, but you still learn it.</li></ul></section>' +
      '<section class="card stack"><h3>How answers are checked</h3><p>Your formula is run on the exercise data and compared with the model answer. It\'s also run on changed numbers, so a formula with typed-in numbers (like =B2*0.18 instead of pointing to the rate cell) is caught. Any correct formula passes, not just ours, as long as it uses the function the exercise is teaching (the message tells you if it doesn\'t).</p></section>' +
      '<section class="card stack"><h3>Excel versions</h3><p>Everything here works in Excel 2021, Excel 365 and Google Sheets. IFS, SWITCH, MAXIFS, MINIFS, CONCAT and TEXTJOIN need Excel 2019 or later, XLOOKUP and XMATCH need Excel 2021 or 365, and TEXTBEFORE and TEXTAFTER need Excel 365 or 2024. The lessons show the older-Excel way where it matters.</p><p>Small differences: this lab supports the functions in the Formula guide, it doesn\'t spill dynamic arrays, and TEXT\'s #,##0 groups in thousands (1,234,567), as in Excel. For lakh style, see the TEXT exercise in module 7.</p></section>' +
      '<section class="card stack"><h3>Practice lab, import and download</h3><ul><li>The practice lab works like Excel: type straight into cells, use Shift+arrows to select, copy and paste with Ctrl+C and Ctrl+V, drag the small square to fill, and undo with Ctrl+Z. Open <b>Keyboard shortcuts</b> under the sheet for the full list.</li><li>It has the everyday tools: several sheets (click + at the bottom, right-click a tab to rename or move it), insert and delete rows and columns, colours, borders and number formats, conditional formatting, filter and sort, find and replace, freeze panes, notes, named ranges, data validation lists, charts and pivot summaries. Right-click (or long-press on a phone) a cell for quick options.</li><li>To use another sheet in a formula, type = then click that sheet\'s tab and a cell, for example =Rates!B2.</li>' + (SAMPLE ? "<li>In this free sample you can try every tool in the practice lab. Opening your own Excel or CSV files, and saving your work as an Excel .xlsx or CSV file, are in the full version.</li>" : "<li><b>Open file</b> (File tab) opens an Excel (.xlsx) or CSV file from your device, with all its sheets. Formulas the lab understands come in as formulas. Others come in as their values. The lab shows up to 2,000 rows and 60 columns per sheet.</li><li><b>Excel .xlsx</b> (File tab) saves the whole workbook as a real Excel file with your formulas, colours, widths and frozen panes, so you can open it in Excel or Google Sheets. Charts stay in the lab.</li><li>Old .xls files can\'t be opened. Save them as .xlsx or CSV in Excel first.</li>") + "</ul></section>" +
      '<section class="card stack"><h3>Profiles and PINs</h3><ul><li>Each person on this device can have a profile with their own progress, XP and certificate.</li><li>Tap your name at the top to open <b>Settings</b>: rename the profile, set, change or remove a PIN, switch or add profiles, reset progress or remove the profile.</li><li>Forgot your PIN? On the PIN screen, tap <b>Forgot PIN? Remove this profile</b>, then restore a backup code into a new profile if you made one.</li></ul></section>' +
      '<section class="card stack"><h3>Privacy</h3><p>The lab is one file that runs in your browser. It makes no internet calls and collects nothing. Files you import are read on your device and never uploaded. Progress is stored only in this browser on this device.</p></section>' +
      '<section class="card stack"><h3>Terms</h3><p>For personal learning. Please don\'t share or resell the file. Examples use made-up companies, rates and rules for practice. They aren\'t tax, legal or investment advice, so check current rules before using any rate at work. The file is provided as is; liability is limited to the price paid. Indian law applies.</p><p>All sales are final, which is why there\'s a free sample. If the file is faulty or doesn\'t reach you, we fix it, replace it or refund you. Support: <b>' + esc(CFG.email) + "</b></p></section>" +
      '<section class="card stack"><h3>About</h3><p>Made by 99DigiProStore, a store of interactive tools for learning and finance, started by a qualified CMA. Microsoft Excel is a trademark of Microsoft Corporation; this product is not affiliated with or endorsed by Microsoft. Version ' + esc(CFG.version) + ".</p></section></div>";
  }

  /* ---------- global events ---------- */
  app.addEventListener("click", function (e) {
    var ls = e.target.closest("[data-lstage]"); if (ls && view.name === "ex" && EX[view.id]) return setStage(EX[view.id], ls.getAttribute("data-lstage"));
    var b = e.target.closest("[data-go],[data-mod],[data-open],[data-q],[data-retry],[data-cat],[data-act],[data-user]"); if (!b) return;
    if (b.hasAttribute("data-user")) { var pu = REG.users.filter(function (x) { return x.id === b.getAttribute("data-user"); })[0]; if (!pu.pin) { loadUser(pu); return go(takeStart()); } login.pick = pu.id; login.err = ""; login.adding = false; return render(); }
    if (b.hasAttribute("data-go")) return go({ name: b.getAttribute("data-go") });
    if (b.hasAttribute("data-mod")) return go({ name: "module", id: b.getAttribute("data-mod") });
    if (b.hasAttribute("data-open")) return go({ name: "ex", id: b.getAttribute("data-open") });
    if (b.hasAttribute("data-q")) return answerQuiz(view.id, +b.getAttribute("data-q"), +b.getAttribute("data-o"));
    if (b.hasAttribute("data-retry")) { var id = b.getAttribute("data-retry"), old = S.quiz[id]; S.quiz[id] = { a: {}, done: old.done, xp: old.xp, best: old.best, retry: true }; save(true); return render(); }
    if (b.hasAttribute("data-cat")) { guideCat = b.getAttribute("data-cat"); $$("#gcat button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); return filterGuide(); }
    var act = b.getAttribute("data-act");
    if (act === "enter") return enterPin();
    if (act === "adduser") return addUser();
    if (act === "newprofile") { login.adding = true; login.pick = null; login.err = ""; return render(); }
    if (act === "canceladd") { login.adding = false; login.err = ""; return render(); }
    if (act === "switch") { save(); USER = null; S = null; login = { pick: null, err: "", adding: false }; return go({ name: "home" }); }
    if (act === "delprofile") { if (b.dataset.sure) { kdel(ROOT + "-u-" + USER.id); REG.del = (REG.del || []).concat(USER.id); REG.users = REG.users.filter(function (x) { return x.id !== USER.id; }); REG.cur = null; saveReg(); USER = null; S = null; toast("Profile deleted"); return go({ name: "home" }); } b.dataset.sure = 1; b.textContent = "Tap again to delete " + USER.name + " and all progress"; return; }
    if (act === "forgetpin") {
      var fu = regUser(login.pick); if (!fu) return;
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Tap again to delete " + fu.name + " and all their progress"; return; }
      kdel(ROOT + "-u-" + fu.id); REG.del = (REG.del || []).concat(fu.id); REG.users = REG.users.filter(function (x) { return x.id !== fu.id; }); if (REG.cur === fu.id) REG.cur = null; saveReg();
      login = { pick: null, err: "", adding: false }; toast("Profile removed"); return render();
    }
    if (act === "renameuser") {
      var nn = (($("#rnname") || {}).value || "").trim(), rm = $("#rnmsg"), me = regUser(USER.id) || USER;
      if (!nn) { rm.textContent = "Type a name."; rm.style.color = "var(--bad)"; return; }
      if (REG.users.some(function (u) { return u.id !== me.id && u.name.toLowerCase() === nn.toLowerCase(); })) { rm.textContent = "There's already a profile called " + nn + "."; rm.style.color = "var(--bad)"; return; }
      me.name = nn; me.t = Date.now(); USER = me; saveReg(); toast("Name saved"); return render();
    }
    if (act === "setpin" || act === "rmpin") {
      var np = (($("#newpin") || {}).value || "").trim(), ru = regUser(USER.id) || USER, pm0 = $("#pinmsg");
      if (ru.pin && hash((($("#curpin") || {}).value || "").trim() + ru.id) !== ru.pin) { pm0.textContent = "The current PIN doesn't match."; pm0.style.color = "var(--bad)"; return; }
      if (act === "setpin" && !/^\d{4}$/.test(np)) { var pm = $("#pinmsg"); pm.textContent = "Type exactly 4 digits."; pm.style.color = "var(--bad)"; return; }
      ru.pin = act === "setpin" ? hash(np + ru.id) : ""; ru.t = Date.now(); USER = ru; saveReg();
      toast(act === "setpin" ? "PIN saved" : "PIN removed"); return render();
    }
    if (act === "bringsample") { var nb = bringSample(); toast(nb ? "Brought over " + nb + " profile" + (nb > 1 ? "s" : "") + " from the free sample" : "Nothing to bring over"); if (REG.users.length === 1 && !REG.users[0].pin) { loadUser(REG.users[0]); return go(takeStart()); } return render(); }
    if (act === "mergesample") { var nm = mergeSample(); toast(nm > 0 ? "Added " + nm + " finished item" + (nm > 1 ? "s" : "") + " from the free sample" : "Those exercises were already done here"); return render(); }
    if (act === "nosample") { REG.fromSample = true; saveReg(); return render(); }
    if (act === "export") {
      var bk = {}; for (var kk in S) if (kk !== "wb" && kk.indexOf("lab") !== 0) bk[kk] = S[kk]; // progress only: the lab workbook would make the code huge
      var js = JSON.stringify(bk), code = "EFL1." + btoa(unescape(encodeURIComponent(js))) + "." + hash(js), ta = $("#code");
      ta.value = code; ta.select();
      var copied = function () { toast("Backup code copied. Paste it somewhere safe."); };
      var manual = function () { ta.focus(); ta.select(); var okc = false; try { okc = document.execCommand("copy"); } catch (er) { } toast(okc ? "Backup code copied. Paste it somewhere safe." : "Select the code above and copy it."); };
      try { navigator.clipboard.writeText(code).then(copied, manual); } catch (er) { manual(); }
      return;
    }
    if (act === "import") {
      var raw = ($("#code").value || "").replace(/\s+/g, ""), msg = $("#impmsg"), o = null, why = 0;
      try { if (raw.indexOf("EFL1.") !== 0) throw 0; var parts = raw.slice(5).split("."), jj = decodeURIComponent(escape(atob(parts[0]))); if (parts[1] && parts[1] !== hash(jj)) { why = 1; throw 0; } o = JSON.parse(jj); if (!o || o.v !== 1) throw 0; }
      catch (er) { msg.textContent = why ? "That code has been changed or cut short. Copy the whole code again." : "That code didn't work. Copy the whole code, starting with EFL1."; msg.style.color = "var(--bad)"; delete b.dataset.sure; b.textContent = "Restore from code"; return; }
      if (b.dataset.sure !== raw) { b.dataset.sure = raw; b.textContent = "Tap again to restore"; msg.style.color = ""; msg.textContent = "This replaces your progress (" + doneCount(S) + " done) with the code's (" + doneCount({ ex: o.ex || {}, quiz: o.quiz || {} }) + " done)."; return; }
      var keepWb = S.wb; S = Object.assign(fresh(), o); if (!S.wb && keepWb) S.wb = keepWb; save(true); toast("Progress restored"); return render();
    }
    if (act === "wipe") { if (b.dataset.sure) { var wb = S.wb, nmw = S.name; S = fresh(); S.name = nmw; if (wb) S.wb = wb; save(true); toast("Progress reset"); go({ name: "home" }); } else { b.dataset.sure = 1; b.textContent = "Tap again to clear " + USER.name + "'s progress"; } }
    if (act === "print") { window.print(); }
  });
  app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "pin") { e.preventDefault(); enterPin(); }
    else if (e.target.id === "nuName" || e.target.id === "nuPin") { e.preventDefault(); addUser(); }
  });
  app.addEventListener("input", function (e) { if (e.target.id === "cname") { S.name = e.target.value; save(); var cn = $("#cn"); if (cn) cn.textContent = S.name || "Your name"; } });

  // fix quiz retry: allow XP to be earned once; later attempts don't change XP
  var _answer = answerQuiz;
  answerQuiz = function (id, qi, oi) {
    var q = S.quiz[id];
    if (q && q.retry) {
      if (q.a[qi] !== undefined) return; q.a[qi] = oi;
      var x = EX[id];
      if (Object.keys(q.a).length === x.qs.length) { var right = x.qs.filter(function (Q, i) { return q.a[i] === Q.a; }).length; q.best = Math.max(q.best || 0, right); q.xp = Math.max(q.xp || 0, right * 2); q.done = true; }
      save(); var y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    _answer(id, qi, oi);
  };

  window.addEventListener("storage", function (e) { // another tab changed something: pick it up instead of overwriting it
    if (!e.key || e.key.indexOf(ROOT) !== 0) return;
    if (e.key === ROOT + "-users") { try { var o = JSON.parse(e.newValue); if (o && o.users) { REG.users = o.users; REG.del = o.del; if (o.fromSample) REG.fromSample = true; if (USER) USER = regUser(USER.id) || USER; } } catch (er) { }
      if (!S) { var keep = {}; ["nuName", "nuPin", "pin"].forEach(function (k) { var el = $("#" + k); if (el) keep[k] = el.value; }); var fo = document.activeElement && document.activeElement.id; render(); for (var k in keep) if ($("#" + k)) $("#" + k).value = keep[k]; if (fo && $("#" + fo)) $("#" + fo).focus(); }
      return;
    }
    if (USER && S && e.key === ROOT + "-u-" + USER.id) {
      try { mergeFrom(JSON.parse(e.newValue)); } catch (er) { }
      if (view.name !== "ex" && view.name !== "lab") { var y = window.scrollY; render(); window.scrollTo(0, y); }
      else { var hx = $("#xpv"); if (hx) hx.textContent = xpTotal(); }
    }
  });
  if (S && startView) { view = takeStart(); }
  render();
})();
