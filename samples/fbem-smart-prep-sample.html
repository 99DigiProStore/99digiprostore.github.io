/* ---------- render ---------- */
function render(){
  clearInterval(timerH); timerH=null;
  let html;
  if(!me) html = loginView();
  else if(view==="exam" && prog.live){ html = examView(); timerH=setInterval(tick,1000); }
  else if(view==="exam"){ view="mocks"; html = mocksView(); }
  else html = ({home:homeView, learn:learnView, module:moduleView, practice:practiceView, session:sessionView, mocks:mocksView, result:resultView, revise:reviseView, about:aboutView}[view]||homeView)();
  document.getElementById("app").innerHTML = html;
  if(!me){ const f=$("#nName")||$("#pin"); if(f) f.focus(); }
  if(view==="module" && sub.c){ const el=document.getElementById("sec-"+sub.c.replace(".","-")); if(el) setTimeout(()=>el.scrollIntoView(),0); sub.c=null; }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act;
  const H = {
    newUser(){ go("login",{mode:"new"}); },
    loginHome(){ go("login",{}); },
    pickUser(){ const u=users.find(x=>x.id===b.dataset.id); if(!u) return; if(u.pin) go("login",{mode:"pin",uid:u.id}); else enterUser(u); },
    checkPin(){ const u=users.find(x=>x.id===sub.uid); const v=$("#pin").value.trim(); if(hash(u.id+"|"+v)===u.pin) enterUser(u); else { $("#pErr").textContent="That PIN is not right. Try again."; $("#pin").value=""; $("#pin").focus(); } },
    createUser(){
      const name=$("#nName").value.trim(), p1=$("#nPin").value.trim(), p2=$("#nPin2").value.trim(), err=$("#nErr");
      if(!name){ err.textContent="Please enter your name."; return; }
      if(users.some(u=>u.name.toLowerCase()===name.toLowerCase())){ err.textContent="A profile with this name already exists. Add your surname or initial."; return; }
      if(p1 && !/^\d{4}$/.test(p1)){ err.textContent="The PIN must be exactly 4 digits."; return; }
      if(p1!==p2){ err.textContent="The two PINs do not match."; return; }
      const id="u"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
      const u={id,name,pin:p1?hash(id+"|"+p1):null,created:Date.now()};
      users.push(u); saveUsers(); S.put("p."+id, blankProg()); enterUser(u);
    },
    switch(){ if(me) save(); me=null; prog=null; sess.set(null); go("login",{}); },
    tab(){ go(b.dataset.v); },
    openModule(){ go("module",{m:+b.dataset.m, c:b.dataset.c||null}); },
    jump(){ const el=document.getElementById("sec-"+b.dataset.c.replace(".","-")); if(el) el.scrollIntoView({behavior:"smooth"}); },
    markRead(){ const c=b.dataset.c; if(prog.read[c]) delete prog.read[c]; else { prog.read[c]=1; touchDay(); } save(); const y=window.scrollY; render(); window.scrollTo(0,y); },
    startChapter(){ const c=b.dataset.c; startSession(orderForPractice(byChapter[c]||[]), c+" "+chTitle[c], "chapter"); },
    startQuick(){ const pool=practiceIds.filter(id=>unlocked(modOf(Q[id].c))); startSession(shuffle(orderForPractice(pool).slice(0,40)).slice(0,10), "Quick 10", "quick"); },
    startFav(){ const pool=practiceIds.filter(id=>Q[id].f&&unlocked(modOf(Q[id].c))); startSession(orderForPractice(pool).slice(0,15), "Core concepts", "fav"); },
    startMistakes(){ const ids=Object.keys(prog.mistakes).filter(id=>Q[id]&&unlocked(modOf(Q[id].c))); if(!ids.length){ toast("Your Mistake Book is empty"); return; } startSession(shuffle(ids).slice(0,20), "Mistake Book", "mist"); },
    pick(){ if(sub.picked!==null) return; const k=+b.dataset.k, id=sub.ids[sub.i]; sub.picked=k; const ok=k===Q[id].a; record(id,ok); sub.log.push([id,ok]); save(); const y=window.scrollY; render(); window.scrollTo(0,y); const n=$("#nextBtn"); if(n) n.focus({preventScroll:true}); },
    nextQ(){ sub.i++; sub.picked=null; render(); window.scrollTo(0,0); },
    endSession(){ sub.done=true; render(); },
    startMock(){ startMock(b.dataset.k); },
    resume(){ go("exam"); },
    examPick(){ const id=prog.live.qids[prog.live.i]; prog.live.ans[id]=+b.dataset.k; save(); render(); },
    clearAns(){ delete prog.live.ans[prog.live.qids[prog.live.i]]; save(); render(); },
    toggleMark(){ const id=prog.live.qids[prog.live.i]; if(prog.live.mark[id]) delete prog.live.mark[id]; else prog.live.mark[id]=1; save(); render(); },
    examNav(){ prog.live.i=Math.min(prog.live.qids.length-1,Math.max(0,prog.live.i+ +b.dataset.d)); save(); render(); window.scrollTo(0,0); },
    examJump(){ prog.live.i=+b.dataset.i; save(); render(); window.scrollTo(0,0); },
    askSubmit(){ sub.confirm=true; render(); window.scrollTo(0,0); },
    cancelSubmit(){ sub.confirm=false; render(); },
    submitMock(){ submitMock(); },
    review(){ go("result",{i:+b.dataset.i, filter:"all"}); },
    startFlash(){ const v=$("#flashSet").value; let list=D.cards.filter(c=>unlocked(modOf(c[0]))); if(v==="due") list=list.filter(c=>!prog.cards[c[1]]); else if(v!=="all") list=list.filter(c=>modOf(c[0])===+v); if(!list.length){ toast("You know every card in this set"); return; } go("revise",{flash:{list:shuffle(list),i:0,flip:false,got:0}}); },
    flip(){ sub.flash.flip=!sub.flash.flip; render(); },
    cardKnow(){ const f=sub.flash, c=f.list[f.i]; if(b.dataset.v==="1"){ prog.cards[c[1]]=1; f.got++; } else delete prog.cards[c[1]]; touchDay(); save(); f.i++; f.flip=false; render(); },
    theme(){ theme=b.dataset.v; S.set("theme",theme); applyTheme(); render(); },
    exportCode(){ try{ sub.exportCode=btoa(unescape(encodeURIComponent(JSON.stringify({app:"fbem4",v:1,name:me.name,p:prog})))); }catch(err){ sub.exportCode=""; toast("Could not create a code"); } render(); },
    copyCode(){ copyText(sub.exportCode, $("#codeOut")); },
    copyShop(){ copyText("https://99digiprostore.myinstamojo.com", $("#shopUrl")); },
    askImport(){ const t=$("#codeIn").value.trim(); try{ const o=JSON.parse(decodeURIComponent(escape(atob(t)))); if(o.app!=="fbem4"||!o.p) throw 0; sub.pending=o; sub.confirmImport=true; render(); }catch(err){ $("#codeErr").textContent="That code does not look right. Copy the whole code and try again."; } },
    doImport(){ prog=Object.assign(blankProg(), sub.pending.p); prog.live=null; save(); toast("Progress restored"); go("home"); },
    cancelConfirm(){ sub.confirmImport=false; sub.confirmDelete=false; sub.pinForm=false; render(); },
    askDelete(){ sub.confirmDelete=true; render(); },
    doDelete(){ if(me.pin){ const v=($("#delPin")||{}).value||""; if(hash(me.id+"|"+v.trim())!==me.pin){ $("#delErr").textContent="That PIN is not right."; return; } }
      users=users.filter(u=>u.id!==me.id); saveUsers(); S.del("p."+me.id); me=null; prog=null; sess.set(null); toast("Profile deleted"); go("login",{}); },
    askPin(){ sub.pinForm=true; render(); },
    savePin(){ const v=$("#newPin").value.trim(); if(v && !/^\d{4}$/.test(v)){ $("#pinErr").textContent="The PIN must be exactly 4 digits."; return; } const u=users.find(x=>x.id===me.id); u.pin=v?hash(u.id+"|"+v):null; me=u; saveUsers(); sub.pinForm=false; toast(v?"PIN saved":"PIN removed"); render(); }
  };
  if(H[a]){ e.preventDefault(); H[a](); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="revFilter"){ sub.filter=e.target.value; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    if(e.target.id==="pin") { e.preventDefault(); document.querySelector('[data-act="checkPin"]').click(); }
    else if(["nName","nPin","nPin2"].includes(e.target.id)) { e.preventDefault(); document.querySelector('[data-act="createUser"]').click(); }
    else if(e.target.classList && e.target.classList.contains("flash")) { e.preventDefault(); e.target.click(); }
  }
  if(e.key===" " && e.target.classList && e.target.classList.contains("flash")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") tick(); });

/* ---------- boot ---------- */
const sid = sess.get();
const su = sid && users.find(u=>u.id===sid);
if(su){ me=su; prog=loadProg(su.id); if(prog.live) view="exam"; }
render();
})();

</script>
