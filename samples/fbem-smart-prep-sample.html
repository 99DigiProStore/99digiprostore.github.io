<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FBEM Smart Prep Sample</title>
<style>
/* Uses only fonts already on the device, so the file works offline and contacts no outside server. */
/* Layout: an exam-hall study app. OMR answer-sheet motif: salmon print rules, ballpoint-blue fills. One column, tab bar, cards only where an object needs setting off. */
:root{
  --bg:#F5F6F9; --card:#FFFFFF; --fg:#1A2133; --muted:#5A6377; --line:#DDE2EB; --soft:#EEF1F7;
  --ink:#2340A8; --ink-soft:#E3E9FB; --omr:#D2584B; --omr-soft:#FBE7E3;
  --good:#16804F; --good-soft:#DFF3E8; --bad:#BC3A31; --bad-soft:#FBE3E1; --warn:#9A6400; --warn-soft:#FBF0D9;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131C; --card:#171C28; --fg:#E5E8F0; --muted:#9AA3B6; --line:#2A3142; --soft:#1D2333;
  --ink:#8EA6FF; --ink-soft:#22305C; --omr:#F08C7F; --omr-soft:#3A2220;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131C; --card:#171C28; --fg:#E5E8F0; --muted:#9AA3B6; --line:#2A3142; --soft:#1D2333;
  --ink:#8EA6FF; --ink-soft:#22305C; --omr:#F08C7F; --omr-soft:#3A2220;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--ink)}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--omr);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--omr)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px 4px 4px;font-size:.88rem}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:700;font-size:.85rem;flex:none}
.tabs{background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-block:20px 40px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;border-top:4px solid var(--omr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.fav{background:var(--omr-soft);color:var(--omr)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ink{background:var(--ink-soft);color:var(--ink)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.g i{background:var(--good)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.15rem}

/* modules list */
.mod{display:flex;gap:14px;align-items:flex-start}
.modno{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--omr);width:36px;flex:none;line-height:1}
.locked{opacity:.62}
.lock{font-size:.8rem;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

/* notes */
.notes{max-width:68ch}
.notes h2{margin-top:28px;padding-top:14px;border-top:2px dashed var(--line);scroll-margin-top:120px}
.notes h2:first-child{margin-top:0;border-top:0;padding-top:0}
.notes h3{margin-top:20px;color:var(--ink)}
.notes p,.notes ul,.notes ol,.notes .tbl,.notes .call{margin-top:10px}
.notes ul,.notes ol{padding-left:1.3em}
.notes li+li{margin-top:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--soft);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.call{border-left:4px solid var(--ink);background:var(--ink-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.call b.k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;display:block;margin-bottom:2px}
.call.trap{border-color:var(--bad);background:var(--bad-soft)}
.call.trap b.k{color:var(--bad)}
.call.formula{border-color:var(--omr);background:var(--omr-soft);font-family:var(--f-mono);font-size:.9rem}
.call.formula b.k{color:var(--omr)}
.call.tip b.k{color:var(--ink)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.85rem}

/* question */
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.qtext{font-size:1.08rem;font-weight:700;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;flex:none}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.explain{margin-top:14px;border-radius:8px;padding:12px;background:var(--soft);border:1px solid var(--line)}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}

/* exam */
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line)}
.exambar .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;padding:4px 10px;border-radius:6px;background:var(--soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal{height:38px;border-radius:50%;border:2px solid var(--omr);background:var(--card);font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--omr)}
.pal.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pal.mark{border-color:var(--warn);box-shadow:inset 0 0 0 3px var(--warn-soft)}
.pal.cur{outline:3px solid var(--fg);outline-offset:1px}
.pal.right{background:var(--good);border-color:var(--good);color:var(--card)}
.pal.wrong{background:var(--bad);border-color:var(--bad);color:var(--card)}
.pal.skip{background:var(--soft);border-color:var(--line);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid var(--omr)}

/* flashcard */
.flash{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);border-top:4px solid var(--ink)}
.flash .term{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.flash .def{font-size:1.05rem}

/* login */
.login{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding-block:28px}
.login .box{width:100%;max-width:520px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.user{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:center}
.user:hover{border-color:var(--ink)}
.user .avatar{width:44px;height:44px;font-size:1.1rem}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
textarea{font-family:var(--f-mono);font-size:.78rem;min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.pin{letter-spacing:.5em;font-family:var(--f-mono);text-align:center;font-size:1.2rem}
.err{color:var(--bad);font-size:.88rem;font-weight:700}

/* banners, footer */
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:.9rem}
.upsell{border:2px dashed var(--omr);border-radius:var(--r);padding:16px;background:var(--omr-soft)}
footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:.8rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.stats .stat{padding:10px}.stats .stat b{font-size:1.05rem}}
.stat b{font-family:var(--f-mono);font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:50}
.confirm{border:2px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px}
@media (max-width:560px){.hide-sm{display:none}.qtext{font-size:1rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.pal{transition:border-color .15s,background .15s}}
</style>

</head>

<script>const DATA={"edition":"sample","version":"v1.1 (October 2026)","modules":[{"n":1,"title":"Basic Concepts","weight":15,"locked":false,"chapters":[{"id":"1.1","title":"The Fundamentals of Economics"},{"id":"1.2","title":"Utility, Wealth and Production"},{"id":"1.3","title":"Demand, Supply and Equilibrium"},{"id":"1.4","title":"Theory of Production"},{"id":"1.5","title":"Cost of Production"},{"id":"1.6","title":"Means of Production"}]},{"n":2,"title":"Forms of Market","weight":20,"locked":true,"chapters":[{"id":"2.1","title":"Pricing in Different Forms of Market"},{"id":"2.2","title":"Price Discrimination"}]},{"n":3,"title":"Money and Banking","weight":20,"locked":true,"chapters":[{"id":"3.1","title":"Money: Types, Features and Functions"},{"id":"3.2","title":"Banking: Functions and Principles"},{"id":"3.3","title":"Commercial Banks and Central Bank"},{"id":"3.4","title":"Credit Control and Money Market"}]},{"n":4,"title":"Economic and Business Environment","weight":15,"locked":true,"chapters":[{"id":"4.1","title":"Business Environment and PESTEL"},{"id":"4.2","title":"Emerging Dimensions of VUCAFU"}]},{"n":5,"title":"Fundamentals of Management","weight":30,"locked":true,"chapters":[{"id":"5.1","title":"Introduction to Management"},{"id":"5.2","title":"Stewardship and Agency Theory"},{"id":"5.3","title":"Planning, Organising, Staffing and Leading"},{"id":"5.4","title":"Communication, Coordination and Control"},{"id":"5.5","title":"Structure, Responsibility and Delegation"},{"id":"5.6","title":"Leadership and Motivation"},{"id":"5.7","title":"Decision Making"}]}],"notes":{"1":[{"id":"1.1","title":"The Fundamentals of Economics","html":"<p>Economics is about <b>choice<\/b>. People want many things, but money, time and resources are limited. Economics studies how we choose.<\/p>\n<h3>Four famous definitions<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Approach<\/th><th>Economist<\/th><th>Big idea in one line<\/th><\/tr><\/thead><tbody><tr><td>Wealth<\/td><td>Adam Smith (1776)<\/td><td>Economics is the science of wealth: how it is earned and spent.<\/td><\/tr><tr><td>Welfare<\/td><td>Alfred Marshall<\/td><td>Wealth matters only because it improves human material welfare.<\/td><\/tr><tr><td>Scarcity<\/td><td>Lionel Robbins<\/td><td>Wants are unlimited, means are scarce and have alternative uses, so we must choose.<\/td><\/tr><tr><td>Growth<\/td><td>Paul Samuelson<\/td><td>Choice also happens over time, which links economics to growth.<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Link each name to one keyword: Smith = wealth, Marshall = welfare, Robbins = scarcity, Samuelson = growth.<\/div>\n<h3>Micro and macro economics<\/h3>\n<ul><li><b>Micro<\/b> (small) studies individual units: one consumer, one firm, the price of one good.<\/li><li><b>Macro<\/b> (large) studies the whole economy: national income, inflation, unemployment, money supply.<\/li><\/ul>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>\"Price of sugar in a market\" is micro. \"General price level\" (inflation) is macro.<\/div>\n<h3>Positive and normative economics<\/h3>\n<ul><li><b>Positive<\/b> describes what <i>is<\/i>. It can be checked with facts. Example: \"GDP grew 7% last year.\"<\/li><li><b>Normative<\/b> says what <i>ought to be<\/i>. It contains a value judgement. Example: \"Tax on medicines should be cut.\"<\/li><\/ul>\n<h3>Central problems of every economy<\/h3>\n<ol><li><b>What<\/b> to produce, and how much<\/li><li><b>How<\/b> to produce (labour-heavy or machine-heavy technique)<\/li><li><b>For whom<\/b> to produce (how output is shared)<\/li><\/ol>\n<p>All three arise from <b>scarcity<\/b>. <b>Opportunity cost<\/b> is the value of the next best option you give up.<\/p>\n<h3>Production possibility frontier (PPF)<\/h3>\n<p>The PPF shows the <b>maximum combinations of two goods<\/b> an economy can produce with its given resources and technology.<\/p>\n<ul><li>A point <b>on<\/b> the curve: resources fully and efficiently used.<\/li><li>A point <b>inside<\/b> the curve: resources are unemployed or underused.<\/li><li>A point <b>outside<\/b> the curve: not attainable with present resources and technology. It becomes attainable only after economic growth shifts the curve outward.<\/li><li>The usual PPF is <b>concave to the origin<\/b> because <b>opportunity cost rises<\/b>: to get more of one good you give up larger and larger amounts of the other.<\/li><li>A <b>straight-line<\/b> PPF means <b>constant<\/b> opportunity cost.<\/li><\/ul>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Inside = waste, on = efficient, outside = impossible for now.<\/div>"},{"id":"1.2","title":"Utility, Wealth and Production","html":"<h3>Utility<\/h3>\n<p><b>Utility<\/b> is the want-satisfying power of a good. It is subjective (it differs from person to person) and has no moral angle.<\/p>\n<ul><li><b>Total utility (TU)<\/b>: satisfaction from all units consumed.<\/li><li><b>Marginal utility (MU)<\/b>: extra satisfaction from one more unit. MU = TU(n) − TU(n−1).<\/li><\/ul>\n<div class=\"call formula\"><b class=\"k\">FORMULA<\/b>MU of nth unit = TU of n units − TU of (n − 1) units<\/div>\n<p><b>Law of diminishing marginal utility<\/b>: as you consume more units of a good one after another, the satisfaction from each extra unit falls.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>MU is...<\/th><th>TU is...<\/th><\/tr><\/thead><tbody><tr><td>Positive<\/td><td>Rising<\/td><\/tr><tr><td>Zero<\/td><td>At its maximum<\/td><\/tr><tr><td>Negative<\/td><td>Falling<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The law assumes continuous consumption, identical units, unchanged tastes and a normal, rational consumer.<\/p>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>If units are consumed with long gaps between them, the law does not apply.<\/div>\n<h3>Wealth<\/h3>\n<p>In economics, wealth means goods that have:<\/p>\n<ul><li><b>Utility<\/b>: they satisfy a want<\/li><li><b>Scarcity<\/b>: they are limited in supply<\/li><li><b>Transferability<\/b>: ownership can pass to someone else<\/li><li><b>Externality<\/b>: they exist outside the person (many textbooks add this)<\/li><\/ul>\n<p>Free goods like sunlight and fresh air are useful but not scarce, so they are not wealth.<\/p>\n<h3>Production<\/h3>\n<p>Production means <b>creating utility<\/b>, not creating matter.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Type of utility<\/th><th>How it is created<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Form<\/td><td>Changing shape or form<\/td><td>Wood into a table<\/td><\/tr><tr><td>Place<\/td><td>Moving goods to where they are needed<\/td><td>Apples from Shimla to Chennai<\/td><\/tr><tr><td>Time<\/td><td>Storing goods for later use<\/td><td>Cold storage of potatoes<\/td><\/tr><tr><td>Possession<\/td><td>Transferring ownership<\/td><td>A shop selling a phone<\/td><\/tr><tr><td>Service<\/td><td>Direct personal services<\/td><td>A teacher teaching<\/td><\/tr><\/tbody><\/table><\/div>"},{"id":"1.3","title":"Theory of Demand and Supply, and Equilibrium","html":"<h3>Demand<\/h3>\n<p><b>Demand<\/b> = desire + ability to pay + willingness to pay, at a given price and time.<\/p>\n<p><b>Determinants of demand<\/b>: own price, prices of related goods (substitutes and complements), income, tastes, expectations, population, and government policy.<\/p>\n<div class=\"call formula\"><b class=\"k\">FORMULA<\/b>Demand function: Dx = f(Px, Pr, Y, T, E, ...)<\/div>\n<h3>Law of demand<\/h3>\n<p>Other things being equal, <b>price and quantity demanded move in opposite directions<\/b>.<\/p>\n<p><b>Why the demand curve slopes down:<\/b><\/p>\n<ul><li>Diminishing marginal utility<\/li><li>Income effect (a lower price leaves more money to spend)<\/li><li>Substitution effect (the good becomes cheaper than its substitutes)<\/li><li>New buyers enter the market<\/li><li>Goods with several uses get used more<\/li><\/ul>\n<p><b>Exceptions<\/b> (demand rises with price):<\/p>\n<ul><li><b>Giffen goods<\/b>: very inferior staples bought by poor households. A strong negative income effect beats the substitution effect.<\/li><li><b>Veblen goods<\/b>: prestige items such as diamonds and luxury watches.<\/li><li><b>Expectation of further price rise<\/b>: people buy more now.<\/li><li>Buyers who judge quality by price, and urgent necessities.<\/li><\/ul>\n<h3>Movement versus shift<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Cause<\/th><th>What happens<\/th><th>Name<\/th><\/tr><\/thead><tbody><tr><td>Own price falls<\/td><td>Move down the same curve<\/td><td>Extension of demand<\/td><\/tr><tr><td>Own price rises<\/td><td>Move up the same curve<\/td><td>Contraction of demand<\/td><\/tr><tr><td>Any other factor improves demand<\/td><td>Whole curve shifts right<\/td><td>Increase in demand<\/td><\/tr><tr><td>Any other factor reduces demand<\/td><td>Whole curve shifts left<\/td><td>Decrease in demand<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Own price moves you along the curve. Everything else shifts the curve.<\/div>\n<h3>Related goods<\/h3>\n<ul><li><b>Substitutes<\/b> (tea and coffee): price of one rises, demand for the other rises.<\/li><li><b>Complements<\/b> (car and petrol, pen and refill): price of one rises, demand for the other falls.<\/li><\/ul>\n<h3>Elasticity of demand<\/h3>\n<p>Elasticity measures <b>how strongly quantity responds<\/b> to a change in price, income or the price of another good.<\/p>\n<div class=\"call formula\"><b class=\"k\">FORMULA<\/b>Price elasticity (Ed) = % change in quantity demanded ÷ % change in price<\/div>\n<div class=\"tbl\"><table><thead><tr><th>Value of Ed<\/th><th>Name<\/th><th>Shape of demand curve<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Perfectly inelastic<\/td><td>Vertical line<\/td><\/tr><tr><td>Between 0 and 1<\/td><td>Relatively inelastic<\/td><td>Steep<\/td><\/tr><tr><td>1<\/td><td>Unitary elastic<\/td><td>Rectangular hyperbola<\/td><\/tr><tr><td>More than 1<\/td><td>Relatively elastic<\/td><td>Flat<\/td><\/tr><tr><td>Infinity<\/td><td>Perfectly elastic<\/td><td>Horizontal line<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Methods of measuring price elasticity<\/b><\/p>\n<ol><li><b>Percentage (proportionate) method<\/b>: use the formula above.<\/li><li><b>Total outlay method<\/b> (Marshall): look at what happens to total spending when price falls.<ul><li>Spending rises: Ed &gt; 1<\/li><li>Spending unchanged: Ed = 1<\/li><li>Spending falls: Ed &lt; 1<\/li><\/ul><\/li><li><b>Point method<\/b>: Ed = lower segment ÷ upper segment of a straight-line demand curve. At the midpoint Ed = 1.<\/li><li><b>Arc method<\/b>: uses average (midpoint) values when changes are large.<\/li><\/ol>\n<div class=\"call formula\"><b class=\"k\">FORMULA<\/b>Arc Ed = (ΔQ ÷ average Q) ÷ (ΔP ÷ average P)<\/div>\n<p><b>Worked example<\/b>: Price falls from ₹10 to ₹8 and quantity rises from 40 to 60.<br>ΔQ ÷ average Q = 20 ÷ 50 = 0.4. ΔP ÷ average P = 2 ÷ 9 = 0.222. Ed ≈ 1.8 (elastic).<\/p>\n<p><b>What makes demand more elastic?<\/b> Many substitutes, luxury goods, a large share of income, goods with many uses, and a longer time period. Necessities, habit-forming goods and cheap items have inelastic demand.<\/p>\n<p><b>Income elasticity (Ey)<\/b> = % change in quantity ÷ % change in income<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Ey<\/th><th>Type of good<\/th><\/tr><\/thead><tbody><tr><td>Negative<\/td><td>Inferior good<\/td><\/tr><tr><td>Between 0 and 1<\/td><td>Normal necessity<\/td><\/tr><tr><td>More than 1<\/td><td>Luxury<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Cross elasticity (Exy)<\/b> = % change in quantity of X ÷ % change in price of Y<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Exy<\/th><th>Relation<\/th><\/tr><\/thead><tbody><tr><td>Positive<\/td><td>Substitutes<\/td><\/tr><tr><td>Negative<\/td><td>Complements<\/td><\/tr><tr><td>Zero<\/td><td>Unrelated goods<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Theory of consumer behaviour<\/h3>\n<p><b>Cardinal approach<\/b> (Marshall): utility can be measured in numbers (utils).<\/p>\n<ul><li>Law of diminishing marginal utility<\/li><li><b>Law of equi-marginal utility<\/b>: the consumer is in equilibrium when MUx ÷ Px = MUy ÷ Py = MU of money.<\/li><li><b>Consumer surplus<\/b> = what you are willing to pay − what you actually pay.<\/li><\/ul>\n<p><b>Ordinal approach<\/b> (Hicks and Allen): utility can only be ranked, not measured.<\/p>\n<ul><li>An <b>indifference curve (IC)<\/b> joins combinations of two goods that give the <b>same satisfaction<\/b>.<\/li><li>ICs slope down, are <b>convex<\/b> to the origin (due to diminishing marginal rate of substitution), and <b>never intersect<\/b>. A higher IC means higher satisfaction.<\/li><li>The <b>budget line<\/b> shows combinations the consumer can afford. Maximum of X = income ÷ price of X.<\/li><li><b>Equilibrium<\/b>: where the budget line just touches (is tangent to) the highest possible IC, so MRS = Px ÷ Py.<\/li><\/ul>\n<h3>Demand forecasting<\/h3>\n<p>Demand forecasting estimates future sales so firms can plan production, stock, cash and expansion.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Survey methods<\/th><th>Statistical methods<\/th><\/tr><\/thead><tbody><tr><td>Survey of buyers' intentions<\/td><td>Trend projection (fitting a line to past sales)<\/td><\/tr><tr><td>Expert opinion and the <b>Delphi method<\/b> (anonymous expert rounds)<\/td><td>Regression analysis<\/td><\/tr><tr><td>Sales force opinion<\/td><td>Barometric technique (leading indicators)<\/td><\/tr><tr><td>Market experiments (test markets)<\/td><td>Simultaneous equations<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Supply<\/h3>\n<p><b>Supply<\/b> is the quantity sellers are willing and able to offer at a given price and time.<\/p>\n<p><b>Determinants<\/b>: own price, prices of inputs, technology, prices of other goods, taxes and subsidies, goals of the firm, number of firms and expectations.<\/p>\n<p><b>Law of supply<\/b>: other things being equal, <b>price and quantity supplied move in the same direction<\/b>.<\/p>\n<p><b>Exceptions<\/b>: the backward-bending supply curve of labour (above a high wage, people prefer more leisure), perishable goods sold at any price, and rare goods like antiques.<\/p>\n<p><b>Elasticity of supply (Es)<\/b> = % change in quantity supplied ÷ % change in price<\/p>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>For straight-line supply curves: through the origin Es = 1; cutting the price axis Es &gt; 1; cutting the quantity axis Es &lt; 1.<\/div>\n<h3>Market equilibrium<\/h3>\n<p>Equilibrium is where <b>quantity demanded = quantity supplied<\/b>.<\/p>\n<ul><li>Price above equilibrium: surplus (excess supply), so price tends to fall.<\/li><li>Price below equilibrium: shortage (excess demand), so price tends to rise.<\/li><\/ul>\n<p><b>Worked example<\/b>: Qd = 100 − 2P and Qs = 40 + 4P. Setting them equal: 60 = 6P, so P = ₹10 and Q = 80.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Change<\/th><th>Price<\/th><th>Quantity<\/th><\/tr><\/thead><tbody><tr><td>Demand increases<\/td><td>Rises<\/td><td>Rises<\/td><\/tr><tr><td>Supply increases<\/td><td>Falls<\/td><td>Rises<\/td><\/tr><tr><td>Both increase equally<\/td><td>Unchanged<\/td><td>Rises<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Quick elasticity and supply facts<\/h3>\n<ul><li><b>Salt<\/b> has inelastic demand: it is a necessity, has no close substitute and takes a tiny share of the budget.<\/li><li><b>Luxury goods<\/b> have a high price elasticity: buyers can postpone or skip them.<\/li><li><b>Perishable goods<\/b> have highly inelastic supply in the short run: they must be sold quickly whatever the price.<\/li><li>The <b>point method<\/b> of measuring price elasticity (lower segment ÷ upper segment on a straight-line demand curve) is credited to <b>Marshall<\/b>.<\/li><li><b>Supply function:<\/b> if Sx = 5Px + 3, then at a price of ₹2, Sx = 5 × 2 + 3 = <b>13<\/b> units.<\/li><\/ul>"},{"id":"1.4","title":"Theory of Production","html":"<h3>Factors of production and their rewards<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>Reward<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Land<\/td><td>Rent<\/td><td>Gift of nature. Total supply is fixed.<\/td><\/tr><tr><td>Labour<\/td><td>Wages<\/td><td>Human effort. Cannot be separated from the worker.<\/td><\/tr><tr><td>Capital<\/td><td>Interest<\/td><td>Man-made aid to production.<\/td><\/tr><tr><td>Entrepreneur (organisation)<\/td><td>Profit<\/td><td>Organises the other factors and bears risk.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Production function<\/h3>\n<p>A <b>production function<\/b> shows the technical relation between inputs and output: Q = f(L, K).<\/p>\n<ul><li><b>Short run<\/b>: at least one factor (such as plant size) is fixed.<\/li><li><b>Long run<\/b>: all factors can be changed.<\/li><\/ul>\n<h3>Law of variable proportions (short run)<\/h3>\n<p>Add more of one variable factor (labour) to a fixed factor (land or machines).<\/p>\n<ul><li><b>Total product (TP)<\/b>: total output<\/li><li><b>Average product (AP)<\/b> = TP ÷ units of labour<\/li><li><b>Marginal product (MP)<\/b> = change in TP from one more unit of labour<\/li><\/ul>\n<div class=\"tbl\"><table><thead><tr><th>Stage<\/th><th>What happens<\/th><th>Ends at<\/th><\/tr><\/thead><tbody><tr><td>I: Increasing returns<\/td><td>AP rising, MP above AP<\/td><td>AP maximum (where MP = AP)<\/td><\/tr><tr><td>II: Diminishing returns<\/td><td>AP and MP falling, MP still positive<\/td><td>MP = 0 (TP maximum)<\/td><\/tr><tr><td>III: Negative returns<\/td><td>MP negative, TP falling<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>A rational producer always works in <b>Stage II<\/b>.<\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>TP is maximum when MP is zero, not when MP is maximum.<\/div>\n<h3>Returns to scale (long run)<\/h3>\n<p>All inputs change in the same proportion.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Output rises...<\/th><th>Name<\/th><\/tr><\/thead><tbody><tr><td>More than in proportion<\/td><td>Increasing returns to scale<\/td><\/tr><tr><td>In the same proportion<\/td><td>Constant returns to scale<\/td><\/tr><tr><td>Less than in proportion<\/td><td>Decreasing returns to scale<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Cobb-Douglas function<\/b>: Q = A·L^a·K^b. Add the exponents: a + b &gt; 1 means increasing, = 1 constant, &lt; 1 decreasing returns.<\/p>\n<h3>Point of inflexion on the TP curve<\/h3>\n<p>On a total product (TP) curve the <b>point of inflexion<\/b> is where <b>marginal product (MP) is at its maximum<\/b>. Before it, TP rises at an increasing rate. After it, TP still rises, but at a decreasing rate.<\/p>"},{"id":"1.5","title":"Cost of Production","html":"<h3>Kinds of cost<\/h3>\n<ul><li><b>Explicit cost<\/b>: cash paid out (wages, rent, materials).<\/li><li><b>Implicit cost<\/b>: the value of the owner's own resources used (own capital, own salary forgone).<\/li><li><b>Economic cost<\/b> = explicit + implicit cost. Accounting cost counts explicit cost only.<\/li><li><b>Opportunity cost<\/b>: the next best option given up.<\/li><li><b>Sunk cost<\/b>: already spent and cannot be recovered. Ignore it in decisions.<\/li><\/ul>\n<h3>Short-run costs<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Cost<\/th><th>Formula<\/th><th>Behaviour<\/th><\/tr><\/thead><tbody><tr><td>Total fixed cost (TFC)<\/td><td>—<\/td><td>Constant at all output levels<\/td><\/tr><tr><td>Total variable cost (TVC)<\/td><td>—<\/td><td>Rises with output<\/td><\/tr><tr><td>Total cost (TC)<\/td><td>TFC + TVC<\/td><td>Rises with output<\/td><\/tr><tr><td>Average fixed cost (AFC)<\/td><td>TFC ÷ Q<\/td><td>Falls continuously (rectangular hyperbola)<\/td><\/tr><tr><td>Average variable cost (AVC)<\/td><td>TVC ÷ Q<\/td><td>U-shaped<\/td><\/tr><tr><td>Average total cost (ATC)<\/td><td>TC ÷ Q = AFC + AVC<\/td><td>U-shaped<\/td><\/tr><tr><td>Marginal cost (MC)<\/td><td>ΔTC ÷ ΔQ<\/td><td>U-shaped<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>MC cuts both AVC and ATC at their <b>lowest points<\/b>. The gap between ATC and AVC is AFC, and it narrows as output rises.<\/div>\n<p><b>Worked example<\/b>: TFC = ₹600 and TVC at 10 units = ₹400. TC = ₹1,000, ATC = ₹100, AFC = ₹60, AVC = ₹40.<\/p>\n<h3>Long-run costs<\/h3>\n<p>In the long run every cost is variable. The <b>long-run average cost (LAC)<\/b> curve wraps around many short-run AC curves, so it is called the <b>envelope<\/b> or <b>planning curve<\/b>. It is U-shaped because of <b>economies of scale<\/b> first and <b>diseconomies of scale<\/b> later.<\/p>"},{"id":"1.6","title":"Means of Production","html":"<p><b>Means of production<\/b> are the physical things labour uses to produce: land, tools, machines, buildings, raw materials and energy. Labour working with these means creates output.<\/p>\n<h3>Who owns the means of production?<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>System<\/th><th>Ownership<\/th><th>Who decides prices?<\/th><\/tr><\/thead><tbody><tr><td>Capitalism<\/td><td>Private individuals and firms<\/td><td>Market forces<\/td><\/tr><tr><td>Socialism<\/td><td>Community or state<\/td><td>Central planning<\/td><\/tr><tr><td>Mixed economy (e.g. India)<\/td><td>Both public and private sectors<\/td><td>Mostly markets, with government role<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Key ideas linked to Karl Marx<\/h3>\n<ul><li><b>Mode of production<\/b>: the way a society organises production, combining productive forces with relations of production.<\/li><li><b>Relations of production<\/b>: the social tie between owners of factories, land and tools (the <b>bourgeoisie<\/b>) and the workers who sell their labour to them (the <b>proletariat<\/b>).<\/li><li><b>Capital as a produced means of production<\/b>: capital goods like machines are themselves made using other factors (a phrase linked with Böhm-Bawerk).<\/li><\/ul>\n<h3>Why it matters<\/h3>\n<p>Better use of land, labour and capital raises output, lowers costs and supports economic growth and living standards.<\/p>"}]},"questions":[{"id":"q11-02","c":"1.1","f":0,"q":"Adam Smith's definition of economics is known as the","o":["Scarcity-centred definition","Growth-centred definition","Wealth-centred definition","Welfare-centred definition"],"a":2,"e":"Smith (Wealth of Nations, 1776) treated economics as the science of wealth: how it is produced and spent."},{"id":"q11-03","c":"1.1","f":0,"q":"The welfare-centred definition of economics is associated with","o":["Adam Smith","Alfred Marshall","J. M. Keynes","Lionel Robbins"],"a":1,"e":"Marshall shifted the focus from wealth to human material welfare. Wealth matters only because it adds to welfare."},{"id":"q11-04","c":"1.1","f":0,"q":"The growth-oriented definition, which looks at how society chooses to use resources over time, was given by","o":["Alfred Marshall","Paul A. Samuelson","Lionel Robbins","Adam Smith"],"a":1,"e":"Samuelson added the time angle: choices about producing goods now and in the future, which links economics to growth."},{"id":"q11-05","c":"1.1","f":1,"q":"Micro economics mainly studies","o":["The general price level","The national income of a country","The behaviour of individual units such as one consumer or one firm","Total employment in the economy"],"a":2,"e":"Micro means small. It looks at individual units: a household, a firm, the price of one good. National income, price level and employment are macro topics."},{"id":"q11-06","c":"1.1","f":1,"q":"Which of these is a macro economic topic?","o":["The demand of one family for milk","The price of tea at a local stall","The inflation rate of India","The output of one textile mill"],"a":2,"e":"Inflation is about the general price level of the whole economy, so it is macro. The other three are individual units."},{"id":"q11-07","c":"1.1","f":0,"q":"Riya leaves a part-time job paying ₹6,000 a month to join full-time coaching. For her, the ₹6,000 is the","o":["Sunk cost of coaching","Fixed cost of coaching","Opportunity cost of joining coaching","Explicit cost of the job"],"a":2,"e":"Opportunity cost is the value of the next best option given up. Riya gives up ₹6,000 of earnings to attend coaching."},{"id":"q11-08","c":"1.1","f":0,"q":"The central problem 'for whom to produce' is about","o":["Which goods to produce","How the output is shared among people","Which technique of production to use","How fast the economy should grow"],"a":1,"e":"'What' is about choice of goods, 'how' is about technique, and 'for whom' is about distribution of output and income."},{"id":"q11-09","c":"1.1","f":0,"q":"Which of these is a normative statement?","o":["The government should cut GST on life-saving medicines","Repo rate changes affect bank lending rates","Higher prices usually reduce quantity demanded","India's GDP grew last year"],"a":0,"e":"Normative economics says what ought to be and uses words like 'should'. Positive statements describe what is and can be tested with facts."},{"id":"q11-10","c":"1.1","f":0,"q":"Economics is called a social science because it","o":["Is studied only in laboratories","Ignores the problem of choice","Studies human behaviour as people live and work in society","Deals only with money"],"a":2,"e":"Economics studies how people in society make choices about scarce resources, which makes it a social science."},{"id":"q11-12","c":"1.1","f":0,"q":"A production possibility frontier (PPF) shows","o":["How national income is shared among people","The prices at which two goods are sold","The demand for two goods at different incomes","The maximum combinations of two goods an economy can produce with its given resources and technology"],"a":3,"e":"The PPF maps the limit of production: every point on it uses all resources fully and efficiently."},{"id":"q11-13","c":"1.1","f":1,"q":"The usual PPF is concave to the origin because","o":["Both goods are equally easy to make","Opportunity cost stays constant","Opportunity cost rises as more of one good is produced","Resources are unlimited"],"a":2,"e":"Resources are not equally suited to both goods. Shifting more to one good means giving up ever larger amounts of the other, so the curve bends outward."},{"id":"q11-15","c":"1.1","f":0,"q":"A point inside the PPF shows that the economy","o":["Is producing at maximum efficiency","Can produce this combination only after growth","Is not using all its resources fully","Is producing more than its resources allow"],"a":2,"e":"Points inside the curve mean unemployed or underused resources. Points outside the curve cannot be reached with present resources and technology."},{"id":"q12-02","c":"1.2","f":0,"q":"A tea lover gets great satisfaction from a cup of tea, while a person who dislikes tea gets none. This shows that utility is","o":["Subjective and varies from person to person","Always positive","Objective and the same for everyone","Always measured in rupees"],"a":0,"e":"Utility depends on the person's own wants and feelings, so the same good gives different utility to different people."},{"id":"q12-03","c":"1.2","f":1,"q":"Total utility from 1, 2, 3 and 4 units of a good is 20, 35, 45 and 50. What is the marginal utility of the 3rd unit?","o":["10","45","5","15"],"a":0,"e":"MU of a unit = change in TU. MU of 3rd unit = 45 − 35 = 10."},{"id":"q12-05","c":"1.2","f":0,"q":"When marginal utility becomes negative, total utility","o":["Keeps rising","Becomes zero","Stays constant","Starts falling"],"a":3,"e":"A negative MU means the extra unit reduces satisfaction, so TU falls."},{"id":"q12-06","c":"1.2","f":1,"q":"The law of diminishing marginal utility will NOT hold if","o":["Units are identical in size and quality","Consumption is continuous","The consumer's taste does not change","Units are consumed with long time gaps between them"],"a":3,"e":"The law assumes continuous consumption. A glass of water today and another next week gives fresh satisfaction each time, so MU does not fall."},{"id":"q12-07","c":"1.2","f":0,"q":"Which of these is NOT wealth in economics?","o":["A delivery van","Shares of a company","Fresh air in a village","A residential flat"],"a":2,"e":"Wealth must have utility, scarcity and transferability. Fresh air is useful but freely available, so it is a free good, not wealth."},{"id":"q12-08","c":"1.2","f":0,"q":"Which set lists the main features of wealth?","o":["Utility, durability and beauty","Price, weight and colour","Utility, scarcity and transferability","Scarcity, legality and size"],"a":2,"e":"An item counts as wealth when it gives utility, is limited in supply, and its ownership can be transferred. Some authors add externality."},{"id":"q12-09","c":"1.2","f":1,"q":"In economics, production means","o":["Creation of new matter","Creation or addition of utility","Use of machines only","Sale of goods for profit"],"a":1,"e":"Matter cannot be created. Production adds utility by changing form, place, time or possession of goods, or by giving services."},{"id":"q12-10","c":"1.2","f":1,"q":"A cold storage keeps potatoes from the harvest season and releases them in the off-season. It creates","o":["Form utility","Place utility","Time utility","Possession utility"],"a":2,"e":"Storing goods so they are available when needed later creates time utility."},{"id":"q12-11","c":"1.2","f":0,"q":"Transporting oranges from Nagpur to Kolkata creates","o":["Place utility","Time utility","Service utility","Form utility"],"a":0,"e":"Moving goods to where they are more useful creates place utility."},{"id":"q12-13","c":"1.2","f":0,"q":"A retailer sells a mobile phone to a customer. The retailer mainly creates","o":["Form utility","Possession utility","Time utility","Place utility"],"a":1,"e":"Transferring ownership to the person who wants the good creates possession utility."},{"id":"q13-01","c":"1.3","f":1,"q":"Demand in economics means","o":["A need that must be met","Desire backed by ability and willingness to pay at a given price","Any desire for a good","The quantity a firm produces"],"a":1,"e":"A wish becomes demand only when the person can pay and is ready to pay, at a stated price and time."},{"id":"q13-02","c":"1.3","f":1,"q":"Other things remaining the same, the law of demand states that","o":["Demand depends only on income","Price and quantity demanded move in opposite directions","Price and quantity demanded move in the same direction","Quantity demanded does not depend on price"],"a":1,"e":"When price falls, quantity demanded rises, and when price rises, it falls. This inverse relation is the law of demand."},{"id":"q13-03","c":"1.3","f":0,"q":"Which of these is NOT a determinant of the demand for a good?","o":["Prices of related goods","Tastes and preferences","Income of the consumer","The cost of producing that good"],"a":3,"e":"Cost of production affects supply, not demand. Demand depends on price, income, related goods, tastes, expectations and population."},{"id":"q13-04","c":"1.3","f":1,"q":"A Giffen good is an exception to the law of demand because","o":["Its strong negative income effect outweighs the substitution effect","It has many close substitutes","It is a luxury good","It is always imported"],"a":0,"e":"For a Giffen good (a very inferior staple), a price rise makes the poor consumer so much poorer that they buy more of it. The income effect beats the substitution effect."},{"id":"q13-05","c":"1.3","f":0,"q":"People buy more diamonds when their price rises because costly diamonds signal status. This is an example of","o":["Inferior goods","Giffen goods","Veblen (prestige) goods","Complementary goods"],"a":2,"e":"Veblen goods are bought for show. A higher price raises their prestige value, so demand can rise with price."},{"id":"q13-06","c":"1.3","f":1,"q":"A fall in the price of a good, other things being equal, causes","o":["An extension of demand (movement down the same curve)","An increase in demand (shift to the right)","No change in quantity demanded","A decrease in demand (shift to the left)"],"a":0,"e":"A change in the good's own price causes movement along the curve: extension when price falls, contraction when it rises."},{"id":"q13-07","c":"1.3","f":1,"q":"For a normal good, a rise in consumer income will","o":["Shift the demand curve to the right","Cause a movement down the demand curve","Shift the demand curve to the left","Leave demand unchanged"],"a":0,"e":"A change in any factor other than own price shifts the curve. Higher income raises demand for normal goods at every price."},{"id":"q13-08","c":"1.3","f":0,"q":"If the price of coffee rises sharply, the demand for tea will most likely","o":["Become zero","Increase","Decrease","Stay the same"],"a":1,"e":"Tea and coffee are substitutes. When coffee becomes dearer, some buyers switch to tea."},{"id":"q13-09","c":"1.3","f":0,"q":"A large rise in petrol prices will most likely reduce the demand for","o":["Electric scooters","Bicycles","Metro rail tickets","Petrol cars"],"a":3,"e":"Petrol and petrol cars are complements, used together. Dearer petrol reduces demand for petrol cars."},{"id":"q13-10","c":"1.3","f":1,"q":"Price rises from ₹20 to ₹25 and quantity demanded falls from 100 to 80 units. Using the percentage method on the original values, price elasticity of demand is","o":["1.25","1","0.2","0.8"],"a":3,"e":"% change in Q = 20/100 = 20%. % change in P = 5/20 = 25%. Ed = 20 ÷ 25 = 0.8 (ignoring the minus sign). Demand is inelastic."},{"id":"q13-11","c":"1.3","f":1,"q":"When price elasticity of demand is zero, the demand curve is","o":["A horizontal straight line","Upward sloping","A vertical straight line","A rectangular hyperbola"],"a":2,"e":"Ed = 0 means quantity does not change at all with price: perfectly inelastic demand, shown by a vertical line."},{"id":"q13-12","c":"1.3","f":0,"q":"A perfectly elastic demand curve is","o":["Vertical (parallel to the price axis)","A rectangular hyperbola","Horizontal (parallel to the quantity axis)","Upward sloping"],"a":2,"e":"Ed = infinity. Buyers will take any quantity at one price but nothing above it, so the curve is flat."},{"id":"q13-14","c":"1.3","f":0,"q":"Price of a product falls and the total amount buyers spend on it rises. Demand is","o":["Elastic (greater than 1)","Inelastic (less than 1)","Unitary elastic","Perfectly inelastic"],"a":0,"e":"If a price fall raises total spending, quantity has risen proportionately more than price fell, so Ed > 1."},{"id":"q13-15","c":"1.3","f":1,"q":"At the exact midpoint of a straight-line demand curve, price elasticity is","o":["Infinite","Greater than 1","Zero","Equal to 1"],"a":3,"e":"Point elasticity = lower segment ÷ upper segment. At the midpoint both segments are equal, so Ed = 1."},{"id":"q13-16","c":"1.3","f":0,"q":"On a straight-line demand curve, a point has a lower segment of 60 mm and an upper segment of 40 mm. Price elasticity at that point is","o":["2.5","1.5","0.67","1"],"a":1,"e":"Point method: Ed = lower segment ÷ upper segment = 60 ÷ 40 = 1.5."},{"id":"q13-17","c":"1.3","f":0,"q":"Price falls from ₹10 to ₹8 and quantity rises from 40 to 60 units. Using the arc (midpoint) method, elasticity is about","o":["1.25","2.5","1.8","0.55"],"a":2,"e":"ΔQ/average Q = 20/50 = 0.4. ΔP/average P = 2/9 = 0.222. Ed = 0.4 ÷ 0.222 ≈ 1.8."},{"id":"q13-18","c":"1.3","f":1,"q":"Which factor tends to make demand for a good more elastic?","o":["The good is habit-forming","It takes a tiny share of income","The good is a basic necessity","Many close substitutes are available"],"a":3,"e":"With many substitutes, buyers switch easily when price rises, so demand responds strongly. Necessities, cheap items and habits make demand inelastic."},{"id":"q13-19","c":"1.3","f":1,"q":"A good with negative income elasticity of demand is","o":["An inferior good","A Veblen good","A luxury good","A necessity"],"a":0,"e":"Negative income elasticity means people buy less as income rises, as with coarse grains when people can afford better food."},{"id":"q13-20","c":"1.3","f":0,"q":"Income elasticity of demand for a good is 2.5. The good is best described as","o":["A luxury","An inferior good","A Giffen good","A necessity"],"a":0,"e":"Income elasticity above 1 means demand grows faster than income, which is typical of luxuries."},{"id":"q13-21","c":"1.3","f":0,"q":"Income rises from ₹20,000 to ₹25,000 and quantity demanded rises from 10 kg to 12 kg. Income elasticity (on original values) is","o":["0.8","1.25","2","0.2"],"a":0,"e":"% change in Q = 2/10 = 20%. % change in income = 5,000/20,000 = 25%. Ey = 20 ÷ 25 = 0.8. Positive and below 1, so it is a normal necessity."},{"id":"q13-22","c":"1.3","f":1,"q":"Positive cross elasticity of demand between two goods shows they are","o":["Substitutes","Inferior goods","Complements","Unrelated"],"a":0,"e":"If a rise in price of X raises demand for Y, buyers are switching: the goods are substitutes. Complements have negative cross elasticity."},{"id":"q13-23","c":"1.3","f":0,"q":"Price of Brand X shampoo rises by 10% and demand for Brand Y shampoo rises by 5%. Cross elasticity is","o":["+2, so they are complements","0, so they are unrelated","−0.5, so they are complements","+0.5, so they are substitutes"],"a":3,"e":"Cross elasticity = 5% ÷ 10% = +0.5. The positive sign shows substitutes."},{"id":"q13-24","c":"1.3","f":0,"q":"Cross elasticity of demand between pens and refills is likely to be","o":["Positive","Zero","Infinite","Negative"],"a":3,"e":"Pens and refills are used together, so they are complements. A rise in price of one reduces demand for the other."},{"id":"q13-25","c":"1.3","f":1,"q":"Under the cardinal approach, a consumer buying two goods is in equilibrium when","o":["Total utility of X = total utility of Y","Price of X = price of Y","MU of X ÷ price of X = MU of Y ÷ price of Y","MU of X = MU of Y"],"a":2,"e":"Law of equi-marginal utility: spend so that the last rupee on each good gives equal marginal utility."},{"id":"q13-26","c":"1.3","f":1,"q":"A student is willing to pay ₹500 for a book but buys it for ₹350. Consumer surplus is","o":["₹850","₹350","₹150","₹500"],"a":2,"e":"Consumer surplus = what you are willing to pay − what you actually pay = 500 − 350 = ₹150."},{"id":"q13-27","c":"1.3","f":1,"q":"An indifference curve shows","o":["Combinations of goods the consumer can afford","Output with two inputs","Combinations of two goods that give the consumer equal satisfaction","How price changes with quantity"],"a":2,"e":"Every point on one indifference curve gives the same satisfaction, so the consumer is indifferent between them."},{"id":"q13-28","c":"1.3","f":0,"q":"Indifference curves are normally convex to the origin because of","o":["Diminishing marginal rate of substitution","The law of supply","Increasing marginal utility","Constant returns to scale"],"a":0,"e":"As a consumer gets more of X, they are willing to give up less and less of Y for each extra unit of X. This falling MRS gives the convex shape."},{"id":"q13-29","c":"1.3","f":0,"q":"Two indifference curves can never","o":["Lie one above the other","Intersect each other","Be convex to the origin","Slope downwards"],"a":1,"e":"If they crossed, one point would give two levels of satisfaction, which is a contradiction."},{"id":"q13-30","c":"1.3","f":0,"q":"Under the indifference curve approach, a consumer is in equilibrium where","o":["The budget line is tangent to the highest reachable indifference curve","The budget line cuts the indifference curve twice","The indifference curve meets the X-axis","Marginal utility of money is zero"],"a":0,"e":"At the point of tangency, MRS equals the price ratio, giving the highest satisfaction the budget allows."},{"id":"q13-31","c":"1.3","f":0,"q":"A student has ₹600. Good X costs ₹30 and good Y costs ₹20. The most units of X they can buy (spending nothing on Y) is","o":["50","30","20","12"],"a":2,"e":"Maximum of X = income ÷ price of X = 600 ÷ 30 = 20 units. This is where the budget line meets the X-axis."},{"id":"q13-32","c":"1.3","f":1,"q":"The Delphi method of demand forecasting uses","o":["A test market in one city","A panel of experts who give views anonymously over several rounds","Leading economic indicators","Past sales data fitted to a trend line"],"a":1,"e":"Delphi collects expert opinions in rounds, shares a summary, and repeats until views converge. Anonymity avoids pressure from dominant members."},{"id":"q13-33","c":"1.3","f":0,"q":"The barometric technique of demand forecasting relies on","o":["Changing prices in a test market","Leading indicators that move ahead of the variable being forecast","Asking every consumer about their plans","Experts meeting face to face"],"a":1,"e":"Barometric forecasting watches indicators that change before demand does, such as housing starts before cement demand."},{"id":"q13-34","c":"1.3","f":0,"q":"Fitting a straight line or curve to past years' sales and extending it into the future is called","o":["Market experiment","Trend projection","Survey of buyers' intentions","Delphi method"],"a":1,"e":"Trend projection is a statistical method that uses time-series data of past sales."},{"id":"q13-35","c":"1.3","f":1,"q":"The law of supply states that, other things remaining the same,","o":["Quantity supplied falls when price rises","Quantity supplied rises when price rises","Supply depends only on demand","Supply does not depend on price"],"a":1,"e":"Higher prices make production more profitable, so sellers offer more. Price and quantity supplied move together."},{"id":"q13-36","c":"1.3","f":0,"q":"Which of these is NOT a determinant of supply of a good?","o":["Income of consumers","Prices of inputs","Technology used","Government taxes and subsidies"],"a":0,"e":"Consumer income affects demand. Supply depends on own price, input prices, technology, taxes, goals of the firm and prices of other goods."},{"id":"q13-39","c":"1.3","f":0,"q":"A straight-line supply curve that starts from the price (Y) axis has elasticity","o":["Equal to 1","Equal to zero","Less than 1","Greater than 1"],"a":3,"e":"A linear supply curve cutting the price axis gives Es > 1. One cutting the quantity axis gives Es < 1."},{"id":"q13-40","c":"1.3","f":0,"q":"Price rises from ₹10 to ₹12 and quantity supplied rises from 200 to 260 units. Elasticity of supply (on original values) is","o":["3","1.5","0.67","1.2"],"a":1,"e":"% change in Qs = 60/200 = 30%. % change in P = 2/10 = 20%. Es = 30 ÷ 20 = 1.5."},{"id":"q13-41","c":"1.3","f":0,"q":"Beyond a high wage level, workers may choose more leisure and offer fewer hours of work. This gives","o":["A backward-bending supply curve of labour","A Giffen demand curve","A perfectly elastic supply curve","A kinked demand curve"],"a":0,"e":"This is an exception to the law of supply: after a point, higher wages lead to less labour supplied."},{"id":"q13-42","c":"1.3","f":1,"q":"Demand is Qd = 100 − 2P and supply is Qs = 40 + 4P. Equilibrium price and quantity are","o":["P = ₹15, Q = 70","P = ₹8, Q = 84","P = ₹10, Q = 80","P = ₹12, Q = 76"],"a":2,"e":"Set Qd = Qs: 100 − 2P = 40 + 4P, so 60 = 6P and P = 10. Q = 100 − 20 = 80."},{"id":"q13-43","c":"1.3","f":0,"q":"If the market price is above the equilibrium price, there will be","o":["Excess demand (a shortage)","Equilibrium","Excess supply (a surplus)","Zero supply"],"a":2,"e":"At a higher price, sellers offer more and buyers want less, so supply exceeds demand and price tends to fall."},{"id":"q13-44","c":"1.3","f":0,"q":"Demand increases while supply stays the same. Equilibrium price and quantity will","o":["Price falls, quantity rises","Both fall","Price rises, quantity falls","Both rise"],"a":3,"e":"A rightward demand shift along an upward supply curve raises both price and quantity."},{"id":"q13-45","c":"1.3","f":0,"q":"Demand and supply both increase by exactly the same amount. Then","o":["Both price and quantity fall","Price stays the same and quantity rises","Price rises and quantity stays the same","Price falls and quantity falls"],"a":1,"e":"Equal rightward shifts cancel out on price but both push quantity up."},{"id":"q13-46","c":"1.3","f":0,"q":"Why is the demand for salt not sensitive to its price?","o":["People buy it only occasionally","Its price is very high","It is a necessity with no close substitute and takes a small part of the budget","Many substitutes are available"],"a":2,"e":"Necessities with few substitutes and a small share of income have inelastic demand."},{"id":"q13-47","c":"1.3","f":0,"q":"In the short run, supply is least able to respond to a price rise for","o":["Perishable goods","Goods made with idle capacity","Goods that are easily stored","Durable consumer goods"],"a":0,"e":"Perishable goods must be sold quickly, so supply cannot be adjusted when price changes."},{"id":"q13-48","c":"1.3","f":0,"q":"A supply function is Sx = 5Px + 3. The quantity supplied at a price of ₹2 is","o":["8","15","10","13"],"a":3,"e":"Sx = 5 × 2 + 3 = 10 + 3 = 13."},{"id":"q13-49","c":"1.3","f":0,"q":"The point method of measuring price elasticity is credited to","o":["Lionel Robbins","Alfred Marshall","Adam Smith","J. M. Keynes"],"a":1,"e":"Marshall developed the point (geometric) method: elasticity = lower segment ÷ upper segment."},{"id":"q13-50","c":"1.3","f":0,"q":"Luxury goods generally have a ___ price elasticity of demand.","o":["Zero","Low","Perfectly inelastic","High"],"a":3,"e":"They are not necessities and buyers can postpone purchase, so demand is very sensitive to price."},{"id":"q14-03","c":"1.4","f":1,"q":"A production function shows","o":["How profit is shared","The technical relation between inputs and output","The relation between cost and price","The relation between price and quantity demanded"],"a":1,"e":"Q = f(L, K, ...). It tells how much output can be produced from given quantities of inputs with a given technology."},{"id":"q14-04","c":"1.4","f":0,"q":"In economics, the short run is a period in which","o":["No factor can be changed","Technology changes freely","All factors are variable","At least one factor of production is fixed"],"a":3,"e":"In the short run some inputs, like plant size, cannot be changed. In the long run all inputs are variable."},{"id":"q14-06","c":"1.4","f":1,"q":"Output from the variable factor reaches its peak at the point where the marginal product of that factor is","o":["Zero","Negative","Equal to average product","At its maximum"],"a":0,"e":"TP rises while MP is positive, peaks when MP = 0, and falls when MP turns negative."},{"id":"q14-07","c":"1.4","f":1,"q":"A rational producer will operate in which stage of the law of variable proportions?","o":["Stage III, where MP is negative","Stage I, where AP is rising","Any stage, as it makes no difference","Stage II, where both AP and MP are falling but MP is still positive"],"a":3,"e":"In Stage I the fixed factor is under-used. In Stage III extra workers reduce output. Stage II is the rational zone."},{"id":"q14-08","c":"1.4","f":0,"q":"Marginal product cuts average product at","o":["The maximum point of average product","The point where MP is zero","The point where TP is zero","The minimum point of average product"],"a":0,"e":"While MP is above AP, AP rises. When MP falls below AP, AP falls. So MP crosses AP at AP's peak."},{"id":"q14-09","c":"1.4","f":1,"q":"With 1, 2, 3 and 4 workers, total product is 10, 24, 36 and 44 units. What are the average product at 3 workers and the marginal product of the 4th worker?","o":["AP = 12, MP = 8","AP = 12, MP = 11","AP = 36, MP = 8","AP = 9, MP = 12"],"a":0,"e":"AP = TP ÷ workers = 36 ÷ 3 = 12. MP of 4th worker = 44 − 36 = 8."},{"id":"q14-10","c":"1.4","f":1,"q":"A firm doubles all its inputs and its output rises to more than double. This is","o":["The law of variable proportions","Decreasing returns to scale","Constant returns to scale","Increasing returns to scale"],"a":3,"e":"Returns to scale is a long-run idea. Output rising more than in proportion to inputs is increasing returns."},{"id":"q14-11","c":"1.4","f":1,"q":"For the production function Q = A·L^0.6·K^0.4, returns to scale are","o":["Decreasing","Constant","Negative","Increasing"],"a":1,"e":"In a Cobb-Douglas function, add the exponents: 0.6 + 0.4 = 1, so returns to scale are constant."},{"id":"q14-12","c":"1.4","f":0,"q":"For Q = L^0.7·K^0.5, returns to scale are","o":["Zero","Decreasing","Increasing","Constant"],"a":2,"e":"Sum of exponents = 0.7 + 0.5 = 1.2, which is more than 1, so returns are increasing."},{"id":"q14-13","c":"1.4","f":0,"q":"Increasing returns to scale usually arise from","o":["A fixed factor being overused","Internal economies such as division of labour and specialisation","Poor coordination in a very large firm","Rising input prices"],"a":1,"e":"Bigger scale allows specialisation, better machines and bulk buying, so output grows faster than inputs."},{"id":"q14-14","c":"1.4","f":1,"q":"At the point of inflexion on a total product (TP) curve, marginal product is","o":["Negative","At its minimum","Equal to zero","At its maximum"],"a":3,"e":"Before this point TP rises at an increasing rate (MP rising). After it, TP still rises but at a decreasing rate (MP falling)."},{"id":"q15-01","c":"1.5","f":1,"q":"Which of these is a fixed cost for a factory?","o":["Power consumed by machines","Wages paid per piece","Rent of the factory building","Raw material used"],"a":2,"e":"Fixed costs do not change with output in the short run. Rent stays the same whether the factory makes 10 or 10,000 units."},{"id":"q15-03","c":"1.5","f":1,"q":"Marginal cost cuts average total cost at","o":["The minimum point of ATC","Any point on the rising part of ATC","The maximum point of ATC","The point where ATC is zero"],"a":0,"e":"When MC is below ATC, ATC falls. When MC is above, ATC rises. So MC crosses ATC at its lowest point. The same holds for AVC."},{"id":"q15-05","c":"1.5","f":1,"q":"Total cost is ₹1,250 at 5 units and ₹1,320 at 6 units. Marginal cost of the 6th unit is","o":["₹250","₹220","₹70","₹264"],"a":2,"e":"MC = change in TC = 1,320 − 1,250 = ₹70."},{"id":"q15-06","c":"1.5","f":0,"q":"Interest the owner could have earned on their own capital invested in the business is an example of","o":["Variable cost","Sunk cost","Explicit cost","Implicit cost"],"a":3,"e":"Implicit costs are costs of self-owned resources. No cash is paid out, but an opportunity is given up."},{"id":"q15-07","c":"1.5","f":0,"q":"Economic cost of production equals","o":["Fixed cost only","Explicit cost plus implicit cost","Implicit cost only","Explicit cost only"],"a":1,"e":"Accountants record explicit (paid-out) costs. Economists also count implicit costs, including normal profit."},{"id":"q15-08","c":"1.5","f":1,"q":"The long-run average cost curve is also called the","o":["Kinked curve","Envelope or planning curve","Backward-bending curve","Engel curve"],"a":1,"e":"The LAC wraps around many short-run AC curves and helps a firm plan the best plant size, hence 'envelope' or 'planning' curve."},{"id":"q15-09","c":"1.5","f":0,"q":"The long-run average cost curve is U-shaped mainly because of","o":["Economies of scale first and diseconomies of scale later","The law of diminishing marginal utility","Fixed costs in the long run","Perfect competition"],"a":0,"e":"As the firm grows, economies of scale lower average cost. Beyond a point, diseconomies such as management strain raise it."},{"id":"q15-10","c":"1.5","f":0,"q":"Money already spent on a project that cannot be recovered is called","o":["Sunk cost","Marginal cost","Opportunity cost","Replacement cost"],"a":0,"e":"Sunk costs are past and irrecoverable, so they should not affect future decisions."},{"id":"q15-11","c":"1.5","f":0,"q":"The vertical gap between the ATC and AVC curves shows","o":["Total fixed cost, which stays constant","Average fixed cost, which narrows as output rises","Marginal cost","Average variable cost"],"a":1,"e":"ATC = AVC + AFC. Since AFC keeps falling, the gap between ATC and AVC narrows as output increases."},{"id":"q16-01","c":"1.6","f":1,"q":"Means of production broadly include","o":["Tools, machines, raw materials and land that labour works with to produce goods","Only the money held by a firm","Only finished goods","Only the workers of a firm"],"a":0,"e":"Means of production are the physical inputs and instruments, such as land, tools, machines and materials, that labour uses to create output."},{"id":"q16-02","c":"1.6","f":0,"q":"Capital is described as a 'produced means of production' because","o":["It is the same as money","It is a gift of nature","It cannot be used again","It is itself made by using other factors of production"],"a":3,"e":"Machines and tools are man-made using land, labour and earlier capital, and then they help produce more goods."},{"id":"q16-03","c":"1.6","f":1,"q":"An economic system where the means of production are mainly privately owned and prices are set by the market is","o":["Socialism","Capitalism","Communism","Feudalism"],"a":1,"e":"Under capitalism, private owners control the means of production and the market mechanism decides prices."},{"id":"q16-05","c":"1.6","f":0,"q":"An economy where the public sector and the private sector work side by side, as in India, is a","o":["Pure socialist economy","Pure capitalist economy","Mixed economy","Barter economy"],"a":2,"e":"India's mixed economy lets both government and private firms own and run means of production."},{"id":"q16-07","c":"1.6","f":0,"q":"In Marx's analysis, the class that owns the means of production is the","o":["Peasantry","Proletariat","Bourgeoisie","Middle management"],"a":2,"e":"The bourgeoisie (capitalists) own the means of production. The proletariat (workers) sell their labour."}],"mocks":{},"cards":[["1.1","Opportunity cost","The value of the next best option you give up when you make a choice."],["1.1","Scarcity definition","Lionel Robbins: unlimited ends, scarce means with alternative uses, so we must choose."],["1.1","Micro vs macro","Micro studies individual units (one firm, one consumer). Macro studies the whole economy (inflation, national income)."],["1.1","Normative statement","A statement of what ought to be, with a value judgement. Often uses 'should'."],["1.2","Utility","The want-satisfying power of a good. Subjective, with no moral angle."],["1.2","Law of diminishing MU","Each extra unit consumed in a row gives less extra satisfaction than the one before."],["1.2","TU maximum","Total utility is maximum when marginal utility is zero."],["1.2","Features of wealth","Utility, scarcity, transferability (and externality)."],["1.2","Time utility","Created by storing goods for use later, such as cold storage."],["1.3","Demand","Desire + ability to pay + willingness to pay, at a given price and time."],["1.3","Giffen good","An inferior staple whose demand rises with price because the negative income effect beats the substitution effect."],["1.3","Extension vs increase","Extension: own price falls, move along the curve. Increase: other factors improve, curve shifts right."],["1.3","Price elasticity","% change in quantity demanded ÷ % change in price."],["1.3","Total outlay method","Price falls: spending up → Ed > 1; same → Ed = 1; down → Ed < 1."],["1.3","Point elasticity","Lower segment ÷ upper segment. At the midpoint of a straight line, Ed = 1."],["1.3","Income elasticity signs","Negative: inferior. 0 to 1: necessity. Above 1: luxury."],["1.3","Cross elasticity signs","Positive: substitutes. Negative: complements. Zero: unrelated."],["1.3","Equi-marginal utility","Consumer equilibrium when MUx ÷ Px = MUy ÷ Py."],["1.3","Consumer surplus","Willing to pay − actually paid."],["1.3","Indifference curve","Combinations of two goods giving the same satisfaction. Convex, sloping down, never intersecting."],["1.3","Delphi method","Anonymous expert opinions collected in rounds until they converge."],["1.3","Supply line through origin","Elasticity of supply = 1 at every point."],["1.3","Equilibrium","Quantity demanded = quantity supplied."],["1.4","Factor rewards","Land: rent. Labour: wages. Capital: interest. Entrepreneur: profit."],["1.4","Rational stage","Stage II of the law of variable proportions: AP and MP falling, MP still positive."],["1.4","TP maximum","Total product is maximum when marginal product is zero."],["1.4","Cobb-Douglas test","Add exponents: > 1 increasing, = 1 constant, < 1 decreasing returns to scale."],["1.5","AFC curve","Falls continuously; a rectangular hyperbola."],["1.5","MC and ATC","MC cuts ATC (and AVC) at their minimum points."],["1.5","Implicit cost","Cost of the owner's own resources, such as interest on own capital."],["1.5","Envelope curve","Long-run average cost curve, also called the planning curve."],["1.6","Means of production","Land, tools, machines and materials that labour uses to produce."],["1.6","Capitalism","Private ownership of means of production; prices set by the market."],["1.1","Production possibility frontier","The maximum combinations of two goods an economy can produce with its resources and technology. Concave because opportunity cost rises."]],"counts":{"practice":94,"mock":100,"fullPractice":307,"fullCards":97}};</script>
<script>
(function(){

try{ localStorage.setItem(P+"t","1"); localStorage.removeItem(P+"t"); }catch(e){ S.ok=false; }

/* ---------- helpers ---------- */

const hash = s => { let x=2166136261; for(let i=0;i<s.length;i++){ x^=s.charCodeAt(i); x=Math.imul(x,16777619);} return (x>>>0).toString(36); };
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtTime = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0"); };
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
function shuffle(a, seed){ a=a.slice(); let r = seed==null ? Math.random : mulberry(seed); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

let users = S.json("users", []);

function loadProg(id){ const p = S.json("p."+id, null) || blankProg(); return Object.assign(blankProg(), p); }

function touchDay(){ const t=today(); if(!prog.days.includes(t)){ prog.days.push(t); if(prog.days.length>400) prog.days=prog.days.slice(-400); } }
function streak(){ const set=new Set(prog.days); let n=0; const d=new Date(); if(!set.has(today())) d.setDate(d.getDate()-1); for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(set.has(k)){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function record(id, correct){
  const a = prog.answers[id] || {n:0,c:0,last:0};
  a.n++; if(correct) a.c++; a.last = correct?1:0; prog.answers[id]=a;
  if(!correct) prog.mistakes[id]=0;
  else if(id in prog.mistakes){ prog.mistakes[id]++; if(prog.mistakes[id]>=2) delete prog.mistakes[id]; }
  touchDay();
}
function statsFor(ids){ let seen=0, right=0, att=0, cor=0; ids.forEach(id=>{ const a=prog.answers[id]; if(a){ seen++; if(a.last) right++; att+=a.n; cor+=a.c; } }); return {seen, right, total:ids.length, acc:pct(cor,att), att}; }

applyTheme();

</div></header>
${ex?"":`<nav class="tabs" aria-label="Sections"><div class="wrap">${TABS.map(([k,t])=>`<button class="tab" data-act="tab" data-v="${k}" ${view===k||(k==="learn"&&view==="module")||(k==="practice"&&view==="session")||(k==="mocks"&&view==="result")?'aria-current="page"':""}>${t}</button>`).join("")}</div></nav>`}
${S.ok?"":`<div class="wrap" style="padding-top:12px"><div class="banner">This browser is not saving progress, so it will be lost when you close the page. Open the file in Chrome, Edge or Firefox for saved progress.</div></div>`}

function homeView(){
  const open = MODS.filter(m=>!m.locked).map(m=>m.n);

function buildMock(k){
  if(k==="m1"||k==="m2") return D.mocks[k].slice();
  const pool = practiceIds.filter(id=>unlocked(modOf(Q[id].c)));
  if(k==="taster") return shuffle(pool).slice(0,10);

  let out=[];
  split.forEach((cnt,i)=>{ const ids=(byModule[i+1]||[]).slice(); const seenless=orderForPractice(ids); out=out.concat(shuffle(seenless.slice(0,Math.max(cnt*3,cnt))).slice(0,cnt)); });
  return out;
}

function tick(){

function submitMock(){
  const L2 = prog.live; if(!L2) return;
  const used = Math.min(L2.dur, Math.round((Date.now()-L2.start)/1000));
  let right=0; const bym={};
  L2.qids.forEach(id=>{ const q=Q[id], m=modOf(q.c); bym[m]=bym[m]||[0,0,0]; bym[m][1]++; const a=L2.ans[id];
    if(a===undefined){ bym[m][2]++; prog.mistakes[id]=0; }
    else { const ok=a===q.a; if(ok){right++; bym[m][0]++;} record(id, ok); } });
  const score = Math.round(right*100/L2.qids.length);
  prog.mocks.push({k:L2.k, t:L2.t, at:Date.now(), used, score, right, n:L2.qids.length, qids:L2.qids, ans:L2.ans, bym});
  if(prog.mocks.length>60) prog.mocks=prog.mocks.slice(-60);

}

  if(!c) return shell(`<div class="stack"><h1>Deck finished</h1><p class="muted">${f.got} of ${f.list.length} marked as known.</p><div class="row"><button class="btn primary" data-act="tab" data-v="revise">Back to Revise</button></div></div>`);
  return shell(`<div class="stack" style="gap:14px">
    <div class="row" style="justify-content:space-between"><span class="mono small muted">Card ${f.i+1} of ${f.list.length} · ${c[0]} ${esc(chTitle[c[0]]||"")}</span><button class="btn ghost" data-act="tab" data-v="revise">End</button></div>
    <div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Flip card">${f.flip?`<p class="def">${esc(c[2])}</p>`:`<div class="stack" style="gap:8px"><span class="term">${esc(c[1])}</span><span class="small muted">Tap to see the answer</span></div>`}</div>
    ${f.flip?`<div class="row"><button class="btn primary" data-act="cardKnow" data-v="1">I knew it</button><button class="btn" data-act="cardKnow" data-v="0">Review again</button></div>`:`<div class="row"><button class="btn primary" data-act="flip">Show answer</button></div>`}
  </div>`);
}
