<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FFCA Smart Prep Free Sample</title>
<style>
/* Uses only fonts already on the device, so the file works offline and contacts no outside server. */
/* Layout: an exam-hall study app. OMR answer-sheet motif: salmon print rules, ballpoint-blue fills. One column, tab bar, cards only where an object needs setting off. */
:root{
  --bg:#F5F6F9; --card:#FFFFFF; --fg:#1A2133; --muted:#5A6377; --line:#DDE2EB; --soft:#EEF1F7;
  --ink:#2340A8; --ink-soft:#E3E9FB; --omr:#D2584B; --omr-soft:#FBE7E3;
  --good:#16804F; --good-soft:#DFF3E8; --bad:#BC3A31; --bad-soft:#FBE3E1; --warn:#9A6400; --warn-soft:#FBF0D9;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131C; --card:#171C28; --fg:#E5E8F0; --muted:#9AA3B6; --line:#2A3142; --soft:#1D2333;
  --ink:#8EA6FF; --ink-soft:#22305C; --omr:#F08C7F; --omr-soft:#3A2220;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131C; --card:#171C28; --fg:#E5E8F0; --muted:#9AA3B6; --line:#2A3142; --soft:#1D2333;
  --ink:#8EA6FF; --ink-soft:#22305C; --omr:#F08C7F; --omr-soft:#3A2220;
  --good:#5CCB92; --good-soft:#173527; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--ink)}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--omr);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--omr)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px 4px 4px;font-size:.88rem}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:700;font-size:.85rem;flex:none}
.tabs{background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-block:20px 40px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;border-top:4px solid var(--omr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;font-weight:700;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.fav{background:var(--omr-soft);color:var(--omr)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ink{background:var(--ink-soft);color:var(--ink)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.g i{background:var(--good)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.15rem}

/* modules list */
.mod{display:flex;gap:14px;align-items:flex-start}
.modno{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--omr);width:36px;flex:none;line-height:1}
.locked{opacity:.62}
.lock{font-size:.8rem;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

/* notes */
.notes{max-width:68ch}
.notes h2{margin-top:28px;padding-top:14px;border-top:2px dashed var(--line);scroll-margin-top:120px}
.notes h2:first-child{margin-top:0;border-top:0;padding-top:0}
.notes h3{margin-top:20px;color:var(--ink)}
.notes p,.notes ul,.notes ol,.notes .tbl,.notes .call{margin-top:10px}
.notes ul,.notes ol{padding-left:1.3em}
.notes li+li{margin-top:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--soft);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.call{border-left:4px solid var(--ink);background:var(--ink-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.call b.k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;display:block;margin-bottom:2px}
.call.trap{border-color:var(--bad);background:var(--bad-soft)}
.call.trap b.k{color:var(--bad)}
.call.formula{border-color:var(--omr);background:var(--omr-soft);font-family:var(--f-mono);font-size:.9rem}
.call.formula b.k{color:var(--omr)}
.call.tip b.k{color:var(--ink)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.85rem}

/* question */
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.qtext{font-size:1.08rem;font-weight:700;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.bub{width:28px;height:28px;border-radius:50%;border:2px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;flex:none}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.explain{margin-top:14px;border-radius:8px;padding:12px;background:var(--soft);border:1px solid var(--line)}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}

/* exam */
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line)}
.exambar .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;padding:4px 10px;border-radius:6px;background:var(--soft)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal{height:38px;border-radius:50%;border:2px solid var(--omr);background:var(--card);font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--omr)}
.pal.ans{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pal.mark{border-color:var(--warn);box-shadow:inset 0 0 0 3px var(--warn-soft)}
.pal.cur{outline:3px solid var(--fg);outline-offset:1px}
.pal.right{background:var(--good);border-color:var(--good);color:var(--card)}
.pal.wrong{background:var(--bad);border-color:var(--bad);color:var(--card)}
.pal.skip{background:var(--soft);border-color:var(--line);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid var(--omr)}

/* flashcard */
.flash{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);border-top:4px solid var(--ink)}
.flash .term{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.flash .def{font-size:1.05rem}

/* login */
.login{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding-block:28px}
.login .box{width:100%;max-width:520px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.user{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:center}
.user:hover{border-color:var(--ink)}
.user .avatar{width:44px;height:44px;font-size:1.1rem}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
textarea{font-family:var(--f-mono);font-size:.78rem;min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.pin{letter-spacing:.5em;font-family:var(--f-mono);text-align:center;font-size:1.2rem}
.err{color:var(--bad);font-size:.88rem;font-weight:700}

/* banners, footer */
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:.9rem}
.upsell{border:2px dashed var(--omr);border-radius:var(--r);padding:16px;background:var(--omr-soft)}
footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:.8rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.stats .stat{padding:10px}.stats .stat b{font-size:1.05rem}}
.stat b{font-family:var(--f-mono);font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:50}
.confirm{border:2px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px}
@media (max-width:560px){.hide-sm{display:none}.qtext{font-size:1rem}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.pal{transition:border-color .15s,background .15s}}

/* ---- Smart Prep additions ---- */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:.92rem}
.subtab[aria-current="true"]{color:var(--omr);border-bottom-color:var(--omr)}
pre.fmt{font-family:var(--f-mono);font-size:.8rem;line-height:1.45;background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--omr);border-radius:0 8px 8px 0;padding:12px;overflow-x:auto;white-space:pre;margin-top:10px}
.tool{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--card);border-top:4px solid var(--ink)}
.tool .row label.f{flex:1 1 150px}
.out{background:var(--ink-soft);border-radius:8px;padding:12px;font-size:.95rem}
.out b{font-family:var(--f-mono)}
.qtext,.explain,.pre{white-space:pre-line}
.out .tbl{margin-top:8px}
tr.tot td{border-top:2px solid var(--line)}
.toc button[disabled]{opacity:.55;cursor:not-allowed}
.steps{margin:6px 0 0;padding-left:1.2em}
.steps li+li{margin-top:4px}
input[type=date],input[type=number]{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
/* match sprint */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{display:flex;flex-direction:column;gap:8px}
.mbtn{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;font-size:.9rem;min-height:56px}
.mbtn.on{border-color:var(--ink);background:var(--ink-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mbtn.no{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:560px){.mbtn{font-size:.82rem;padding:8px}}
/* performance */
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 48px;gap:8px;align-items:center;font-size:.88rem}
.hbar .bar{height:10px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:420px}
.days i{aspect-ratio:1;border-radius:3px;background:var(--soft);display:block}
.days i.on{background:var(--good)}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;border-bottom:1px solid var(--line);padding-top:6px}
.spark span{flex:1;max-width:36px;background:var(--ink);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.spark span em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
/* exam tools */
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.panel{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;flex-direction:column}
.panel.open{display:flex}
.panel .ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;cursor:move;user-select:none;touch-action:none}
.panel .ph .x{margin-left:auto;border:0;background:none;font-size:1.2rem;line-height:1;padding:2px 6px}
#calc{width:272px;right:16px;bottom:16px}
#calc .scr{margin:10px;padding:8px 10px;border-radius:8px;background:var(--soft);text-align:right;font-family:var(--f-mono)}
#calc .scr small{display:block;min-height:1.1em;color:var(--muted);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#calc .scr b{display:block;font-size:1.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 10px 10px}
#calc .keys button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 0;font-family:var(--f-mono);font-weight:700;font-size:.92rem}
#calc .keys button.op{background:var(--soft)}
#calc .keys button.eq{background:var(--ink);color:var(--card);border-color:var(--ink)}
#calc .keys button.m{font-size:.75rem;color:var(--ink)}
#rough{width:min(520px,calc(100vw - 32px));left:16px;bottom:16px;height:min(460px,70vh)}
#rough .rb{display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#rough .rb button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 8px;font-size:.8rem;font-weight:700}
#rough .rb button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
#rough canvas{flex:1;width:100%;touch-action:none;background:repeating-linear-gradient(var(--card) 0 27px,var(--soft) 27px 28px);cursor:crosshair;display:block}
#rough textarea{flex:1;border:0;border-radius:0 0 12px 12px;font-family:var(--f-mono);font-size:.9rem;min-height:0;resize:none;background:repeating-linear-gradient(var(--card) 0 27px,var(--soft) 27px 28px);line-height:28px;padding:0 10px}
@media (max-width:420px){.tabs .wrap{gap:0}.tab{padding:10px 8px;font-size:.92rem}}
@media (max-width:560px){#calc{left:8px;right:8px;width:auto;bottom:8px}#rough{left:8px;right:8px;width:auto;bottom:8px;height:48vh}}
.instr{counter-reset:i}
.instr li{margin-top:6px}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-family:var(--f-mono);font-size:.82rem}
.omr .r{display:flex;align-items:center;gap:6px}
.omr .r span.n{width:22px;text-align:right;color:var(--muted)}
.omr .r i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font-style:normal;font-size:.68rem;color:var(--omr)}
.omr .r i.f{background:var(--ink);border-color:var(--ink);color:var(--card)}
.omr .r i.ok{background:var(--good);border-color:var(--good);color:var(--card)}
.omr .r i.bad{background:var(--bad);border-color:var(--bad);color:var(--card)}
.kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--soft)}
</style>

</head>
<body>

<div id="tools"></div>
<script>const DATA={"edition":"sample","version":"v1.0 (October 2026)","modules":[{"n":1,"title":"Accounting Fundamentals","weight":30,"split":15,"split20":6,"locked":false,"chapters":[{"id":"1.1","title":"Frameworks of Accounting and Forms of Organisation"},{"id":"1.2","title":"Accounting Principles, Concepts and Conventions"},{"id":"1.3","title":"Capital and Revenue Transactions"},{"id":"1.4","title":"Accounting Cycle, Equation and Double Entry"},{"id":"1.5","title":"Journal, Subsidiary Books and Ledger"},{"id":"1.6","title":"Cash Book, Petty Cash and Bank Reconciliation"},{"id":"1.7","title":"Trial Balance"},{"id":"1.8","title":"Adjustment Entries and Rectification of Errors"},{"id":"1.9","title":"Depreciation (SLM and WDV)"},{"id":"1.10","title":"Bad Debts and Provision for Doubtful Debts"}]},{"n":2,"title":"Accounting for Special Transactions","weight":15,"split":8,"split20":3,"locked":true,"chapters":[{"id":"2.1","title":"Consignment"},{"id":"2.2","title":"Joint Venture"},{"id":"2.3","title":"Bills of Exchange"}]},{"n":3,"title":"Preparation of Final Accounts","weight":25,"split":12,"split20":5,"locked":true,"chapters":[{"id":"3.1","title":"Final Accounts of Sole Proprietors"},{"id":"3.2","title":"Not-for-Profit Organisations"}]},{"n":4,"title":"Fundamentals of Cost Accounting","weight":30,"split":15,"split20":6,"locked":true,"chapters":[{"id":"4.1","title":"Meaning, Significance and Relation with Financial Accounting"},{"id":"4.2","title":"Cost Accounting for Business Decisions"},{"id":"4.3","title":"Cost, Cost Centre, Cost Unit and Cost Drivers"},{"id":"4.4","title":"Classification of Costs (CAS 1)"},{"id":"4.5","title":"Cost Sheet"}]}],"notes":{"1":[{"id":"1.1","title":"Frameworks of Accounting and Forms of Organisation","html":"<h3>Accounting in one line<\/h3>\n<p>Accounting is the process of <b>identifying, measuring, recording, classifying, summarising, analysing and communicating<\/b> financial information so that users can take decisions. It is often called the <b>language of business<\/b>.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Term<\/th><th>What it covers<\/th><th>Width<\/th><\/tr><\/thead><tbody><tr><td><b>Book-keeping<\/b><\/td><td>Recording and classifying transactions day to day<\/td><td>Narrowest<\/td><\/tr><tr><td><b>Accounting<\/b><\/td><td>Book-keeping + summarising, analysing, interpreting, communicating<\/td><td>Wider<\/td><\/tr><tr><td><b>Accountancy<\/b><\/td><td>The whole body of theory and practice of accounting<\/td><td>Widest<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Book-keeping ⊂ Accounting ⊂ Accountancy. Book-keeping is the base; it is not concerned with interpreting results.<\/div>\n<h3>Objectives of accounting<\/h3>\n<ol><li>Give useful information to users for <b>decision-making<\/b> (owners, managers, lenders, investors, government).<\/li><li>Keep a <b>systematic record<\/b> of transactions.<\/li><li>Find the <b>result<\/b> of operations (profit or loss) for a period, through the Profit and Loss Account.<\/li><li>Show the <b>financial position<\/b> (assets and liabilities) on a date, through the Balance Sheet.<\/li><\/ol>\n<h3>Users of accounting information<\/h3>\n<ul><li><b>Internal:<\/b> owners, management, employees.<\/li><li><b>External:<\/b> investors, lenders and banks, creditors, customers, government and tax authorities, regulators, the public.<\/li><\/ul>\n<h3>The four frameworks<\/h3>\n<p>A framework is a common set of rules and guidelines for measuring, recognising, presenting and disclosing information in financial statements. Accounting in India rests on four pillars.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Framework<\/th><th>What it is<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td><b>Conceptual<\/b><\/td><td>Inter-related objectives and fundamental concepts of financial reporting; qualitative characteristics of statements. Guides preparers when no standard applies<\/td><td>Objectives of general-purpose reporting, qualitative characteristics<\/td><\/tr><tr><td><b>Legal<\/b><\/td><td>Statutes under which entities are formed and which govern their books<\/td><td>Companies Act, 2013 and Companies (Accounts) Rules, 2014; Indian Partnership Act, 1932; LLP Act, 2008; Banking Regulation Act, 1949; Insurance Act, 1938; Electricity Act, 2003<\/td><\/tr><tr><td><b>Institutional<\/b><\/td><td>Pronouncements of bodies entrusted to develop standards<\/td><td>Accounting Standards and Ind AS developed through ICAI; Cost Accounting Standards (CAS) issued by CASB of ICMAI<\/td><\/tr><tr><td><b>Regulatory<\/b><\/td><td>Rules of sector regulators that shape accounting and reporting<\/td><td>RBI (banking, NPA norms), SEBI (listed companies), IRDAI (insurance), PFRDA (pensions), TRAI, CERC<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Statute or Act = Legal. Standard-setting body = Institutional. Sector watchdog (RBI, SEBI, IRDAI, TRAI) = Regulatory. Objectives and qualitative characteristics = Conceptual.<\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>\"Awareness of RBI, SEBI, TRAI pronouncements\" points to the <b>Regulatory<\/b> framework, not the Institutional one.<\/div>\n<h3>Two sets of standards in India<\/h3>\n<ul><li><b>Accounting Standards (AS)<\/b> under the Companies (Accounting Standards) Rules, 2021.<\/li><li><b>Indian Accounting Standards (Ind AS)<\/b> under the Companies (Indian Accounting Standards) Rules, 2015.<\/li><li><b>Cost Accounting Standards:<\/b> 24 CAS issued by the Cost Accounting Standards Board (CASB) of ICMAI.<\/li><\/ul>\n<h3>Forms of organisation<\/h3>\n<p>The form of a business decides the books it keeps, the law that governs it and the statements it prepares.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Form<\/th><th>Main law<\/th><th>Usual financial statements<\/th><\/tr><\/thead><tbody><tr><td><b>Sole proprietorship<\/b><\/td><td>No specific accounting law (Income Tax Act may apply above limits)<\/td><td>Trading A/c, Profit and Loss A/c, Balance Sheet<\/td><\/tr><tr><td><b>Partnership<\/b><\/td><td>Indian Partnership Act, 1932<\/td><td>Trading A/c, P&amp;L A/c, <b>P&amp;L Appropriation A/c<\/b>, Balance Sheet<\/td><\/tr><tr><td><b>LLP<\/b><\/td><td>Limited Liability Partnership Act, 2008<\/td><td>Profit and Loss A/c, Balance Sheet of the LLP<\/td><\/tr><tr><td><b>Company<\/b><\/td><td>Companies Act, 2013<\/td><td>Statement of Profit and Loss, Balance Sheet, <b>Cash Flow Statement<\/b>, Statement of Changes in Equity, notes<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>A sole proprietorship is the <b>least regulated<\/b> form. A company is the most regulated.<\/div>"},{"id":"1.2","title":"Accounting Principles, Concepts and Conventions","html":"<p><b>GAAP<\/b> (Generally Accepted Accounting Principles) are the common rules, conventions, standards and procedures accepted by the profession. They bring <b>uniformity and comparability<\/b>.<\/p>\n<p>Accounting principles split into two groups:<\/p>\n<ul><li><b>Concepts:<\/b> basic assumptions and conditions on which accounting rests.<\/li><li><b>Conventions:<\/b> customs and traditions that guide the practical application of principles (also called doctrines).<\/li><\/ul>\n<h3>The nine concepts<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Concept<\/th><th>Core idea<\/th><th>Classic example<\/th><\/tr><\/thead><tbody><tr><td><b>Business entity<\/b><\/td><td>Business and owner are separate<\/td><td>Capital is a liability of the business to the owner; drawings are not a business expense<\/td><\/tr><tr><td><b>Going concern<\/b><\/td><td>The business will continue for the foreseeable future<\/td><td>Fixed assets shown at cost less depreciation, not at sale value; split of fixed and current assets<\/td><\/tr><tr><td><b>Accounting period (periodicity)<\/b><\/td><td>Life of the business is split into equal periods<\/td><td>Profit and Loss A/c for one year; Balance Sheet at year end<\/td><\/tr><tr><td><b>Money measurement<\/b><\/td><td>Only items expressed in money are recorded<\/td><td>Staff skill, a strike or a manager's resignation are not recorded<\/td><\/tr><tr><td><b>Accrual<\/b><\/td><td>Record income when earned and expense when incurred, not when cash moves<\/td><td>Outstanding salary and accrued interest are recorded<\/td><\/tr><tr><td><b>Dual aspect<\/b><\/td><td>Every transaction has two equal effects<\/td><td>Assets = Liabilities + Capital<\/td><\/tr><tr><td><b>Matching<\/b><\/td><td>Expenses of a period are matched with the revenues of that period<\/td><td>Adjustments for prepaid and outstanding items; cost of goods sold matched with sales<\/td><\/tr><tr><td><b>Realisation<\/b><\/td><td>Revenue is recognised when a legal right to receive it arises (usually on sale)<\/td><td>Receiving an order is not revenue; delivery and sale is<\/td><\/tr><tr><td><b>Cost (historical cost)<\/b><\/td><td>Assets are recorded at purchase price including transport and installation, not market value<\/td><td>Machine ₹5,00,000 + carriage ₹1,000 + installation ₹2,000 = ₹5,03,000 recorded<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>\"Two aspects\" = Dual aspect. \"Period\" = Accounting period. \"Right to receive\" = Realisation. \"Expenses of the same period\" = Matching. \"Continue\" = Going concern.<\/div>\n<h3>The four conventions<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Convention<\/th><th>Core idea<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><b>Conservatism (prudence)<\/b><\/td><td>Anticipate no profit, provide for all possible losses<\/td><td>Provision for doubtful debts; closing stock at cost or net realisable value, whichever is lower<\/td><\/tr><tr><td><b>Consistency<\/b><\/td><td>Use the same methods year after year so results are comparable<\/td><td>Same depreciation method each year; a change is disclosed<\/td><\/tr><tr><td><b>Materiality<\/b><\/td><td>Only significant information needs separate attention<\/td><td>Rounding off to the nearest rupee; a ₹200 stapler charged as expense<\/td><\/tr><tr><td><b>Full disclosure<\/b><\/td><td>All material facts must be disclosed fully and fairly<\/td><td>Contingent liabilities disclosed in notes<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>Provision for bad and doubtful debts is <b>conservatism<\/b>, not matching. Rounding off paise is <b>materiality<\/b>.<\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>Showing share capital or owner's capital as a liability of the business follows the <b>business entity<\/b> concept.<\/div>"},{"id":"1.3","title":"Capital and Revenue Transactions","html":"<h3>Transaction or event?<\/h3>\n<p>A <b>transaction<\/b> is an event that can be measured in money and changes the financial position. Appointing a manager or launching a product is an <b>event<\/b>, not a transaction, until money is involved. All transactions are events, but not all events are transactions.<\/p>\n<h3>Capital vs revenue expenditure<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Point<\/th><th>Capital expenditure<\/th><th>Revenue expenditure<\/th><\/tr><\/thead><tbody><tr><td>Benefit<\/td><td>Over several years<\/td><td>Within the current year<\/td><\/tr><tr><td>Nature<\/td><td>Non-recurring<\/td><td>Recurring<\/td><\/tr><tr><td>Amount<\/td><td>Usually large<\/td><td>Usually small<\/td><\/tr><tr><td>Purpose<\/td><td>Acquire or improve a fixed asset, raise earning capacity or cut operating cost<\/td><td>Run day-to-day operations, maintain assets<\/td><\/tr><tr><td>Shown in<\/td><td>Balance Sheet (as an asset)<\/td><td>Trading or Profit and Loss A/c<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>Capital expenditure examples:<\/b> land, building, machinery, furniture; freight, carriage, installation and erection charges on a new asset; registration, stamp duty and legal fees on buying property; overhauling or repairs to put a second-hand asset into working condition; additions and extensions; wages paid to own workers for building or installing a fixed asset; customs or import duty on machinery; interest on a loan for a new plant <b>before<\/b> production starts; purchased goodwill, patents, trademarks; preliminary expenses.<\/p>\n<p><b>Revenue expenditure examples:<\/b> purchase of goods for resale; wages, salaries, rent, insurance, power; carriage on goods purchased; import duty on raw materials; ordinary repairs, servicing, painting, whitewashing; depreciation; compensation to retrenched workers; legal fees to defend a suit about title to an existing asset (it protects, not acquires, the asset).<\/p>\n<div class=\"call tip\"><b class=\"k\">EXAM TIP<\/b>Ask \"Does the business own something extra, or something better, at the end of the year because of this?\" If yes, it is capital.<\/div>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>Import duty on <b>machinery<\/b> is capital; import duty on <b>raw materials<\/b> is revenue. Carriage on a <b>machine<\/b> is capital; carriage on <b>goods purchased<\/b> is revenue.<\/div>\n<h3>Revenue expenditure treated as capital<\/h3>\n<p>Normally revenue items become capital when spent on creating or installing an asset: <b>repairs<\/b> on a second-hand asset before use, <b>wages<\/b> of own workers building an asset, <b>raw materials and stores<\/b> used in constructing an asset, brokerage and legal expenses on buying property, and development expenditure on mines and plantations.<\/p>\n<h3>Deferred revenue expenditure<\/h3>\n<p>Revenue expenditure whose benefit is expected over a few years, for example heavy advertising to launch a new product. Traditionally a part was written off each year and the rest shown as an asset. <b>After AS 26<\/b>, expenditure on research, training, advertising and promotion is charged to the Profit and Loss A/c in the year it is incurred.<\/p>\n<div class=\"call trap\"><b class=\"k\">COMMON TRAP<\/b>In current practice (AS 26), heavy launch advertising is treated as <b>revenue expenditure<\/b> of the year, not carried forward.<\/div>\n<h3>Capital vs revenue receipts<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Point<\/th><th>Capital receipt<\/th><th>Revenue receipt<\/th><\/tr><\/thead><tbody><tr><td>Source<\/td><td>Outside normal operations<\/td><td>Normal day-to-day operations<\/td><\/tr><tr><td>Nature<\/td><td>Non-recurring<\/td><td>Recurring<\/td><\/tr><tr><td>Effect on profit<\/td><td>None; goes to Balance Sheet<\/td><td>Increases profit; goes to P&amp;L<\/td><\/tr><tr><td>Examples<\/td><td>Capital introduced, loans taken, sale of fixed assets, insurance claim for a destroyed fixed asset<\/td><td>Sales, fees, commission, interest, rent, dividend received, discount received, bad debts recovered<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Capital and revenue profits and losses<\/h3>\n<ul><li><b>Capital profit:<\/b> from non-recurring sources, e.g. selling a fixed asset above book value, premium on issue of shares. Usually taken to a Capital Reserve (share premium itself is credited to Securities Premium A/c).<\/li><li><b>Revenue profit:<\/b> from normal operations, e.g. profit on sale of goods.<\/li><li><b>Capital loss:<\/b> loss on sale of a fixed asset below book value, loss of an asset by fire or flood, discount on issue of shares.<\/li><li><b>Revenue loss:<\/b> from normal operations, e.g. bad debts, discount allowed.<\/li><\/ul>\n<div class=\"call formula\"><b class=\"k\">FORMULA<\/b>Profit or loss on sale of a fixed asset = Sale price − Book value (written down value) on the date of sale<\/div>"}]},"formats":{"1":"<h3>Journal (format)<\/h3>\n<pre class=\"fmt\">Date      Particulars                              L.F.   Debit ₹   Credit ₹\n2026\nApr 1     Cash A/c                        Dr.       12    50,000\n              To Capital A/c                         31              50,000\n          (Being business started with cash)\nApr 5     Purchases A/c                   Dr.       41    18,000\n              To Meena Traders                       52              18,000\n          (Being goods bought on credit)<\/pre>\n<h3>Rules at a glance<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Item<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td>Personal A/c<\/td><td>Debit the receiver, credit the giver<\/td><\/tr><tr><td>Real A/c<\/td><td>Debit what comes in, credit what goes out<\/td><\/tr><tr><td>Nominal A/c<\/td><td>Debit expenses and losses, credit incomes and gains<\/td><\/tr><tr><td>Error of principle / complete omission / compensating<\/td><td>Trial balance still agrees<\/td><\/tr><tr><td>One-sided error<\/td><td>Use Suspense A/c to rectify<\/td><\/tr><\/tbody><\/table><\/div>"},"questions":[{"id":"q1_1-02","c":"1.1","f":0,"q":"Book-keeping is mainly concerned with","o":["Interpreting financial statements","Taking managerial decisions","Recording and classifying transactions","Auditing the accounts"],"a":2,"e":"Book-keeping is the clerical side: recording transactions in the right books and classifying them. Interpretation belongs to accounting."},{"id":"q1_1-04","c":"1.1","f":1,"q":"Rules of a sector regulator such as SEBI or IRDAI that shape how a firm reports form part of which accounting framework?","o":["Regulatory framework","Legal framework","Institutional framework","Conceptual framework"],"a":0,"e":"Sector regulators (RBI, SEBI, IRDAI, PFRDA, TRAI) issue rules that affect accounting and reporting. That is the regulatory framework.","pp":1},{"id":"q1_1-05","c":"1.1","f":1,"q":"Accounting Standards developed through a professional standard-setting body are part of the","o":["Institutional framework","Regulatory framework","Conceptual framework","Legal framework"],"a":0,"e":"Pronouncements of bodies entrusted with setting standards (such as Accounting Standards and Cost Accounting Standards) form the institutional framework."},{"id":"q1_1-06","c":"1.1","f":0,"q":"The provisions of the Companies Act, 2013 on keeping books of account belong to the","o":["Conceptual framework","Institutional framework","Regulatory framework","Legal framework"],"a":3,"e":"Statutes under which entities are formed and run, such as the Companies Act, 2013, make up the legal framework."},{"id":"q1_1-07","c":"1.1","f":0,"q":"The framework that sets out the objectives of general-purpose financial reporting and the qualitative characteristics of financial statements is the","o":["Conceptual framework","Regulatory framework","Legal framework","Institutional framework"],"a":0,"e":"The conceptual framework is the base of inter-related objectives and concepts. It also guides preparers when no standard covers a transaction."},{"id":"q1_1-08","c":"1.1","f":0,"q":"How many Cost Accounting Standards has the Cost Accounting Standards Board (CASB) issued so far?","o":["40","18","29","24"],"a":3,"e":"CASB of the Institute of Cost Accountants of India has issued 24 Cost Accounting Standards, from CAS 1 to CAS 24."},{"id":"q1_1-09","c":"1.1","f":0,"q":"Which form of business organisation is the least regulated in India in matters of accounting?","o":["Limited liability partnership","Partnership firm","Company","Sole proprietorship"],"a":3,"e":"A sole proprietorship has no specific law prescribing its accounts. Companies are the most regulated."},{"id":"q1_1-10","c":"1.1","f":0,"q":"A Profit and Loss Appropriation Account is normally prepared by a","o":["Partnership firm","Public library","Not-for-profit club","Sole proprietor"],"a":0,"e":"A partnership uses the appropriation account to distribute profit: interest on capital, salary and commission to partners, and the share of profit."},{"id":"q1_1-12","c":"1.1","f":0,"q":"Which financial statement is required for a company but is not usually prepared by a sole proprietor?","o":["Trading Account","Cash Flow Statement","Profit and Loss Account","Balance Sheet"],"a":1,"e":"A company prepares a Cash Flow Statement under the Companies Act, 2013. A sole proprietor normally prepares only Trading A/c, P&L A/c and Balance Sheet."},{"id":"q1_2-01","c":"1.2","f":1,"q":"The owner's personal expenses are not mixed with business expenses because of the","o":["Going concern concept","Money measurement concept","Cost concept","Business entity concept"],"a":3,"e":"The business entity concept treats the business as separate from its owner, so personal spending is drawings, not a business expense."},{"id":"q1_2-02","c":"1.2","f":1,"q":"Capital contributed by the proprietor is shown as a liability of the business because of the","o":["Business entity concept","Matching concept","Conservatism convention","Dual aspect concept"],"a":0,"e":"Since the business and the owner are separate, the business owes the capital to the owner. That is the business entity concept."},{"id":"q1_2-03","c":"1.2","f":1,"q":"Fixed assets are shown at cost less depreciation rather than at their forced sale value because of the","o":["Realisation concept","Money measurement concept","Materiality convention","Going concern concept"],"a":3,"e":"Accounts assume the business will continue, so assets are valued for use, not for an immediate sale. That is the going concern concept."},{"id":"q1_2-04","c":"1.2","f":1,"q":"A business does not record the death of its best salesman in its books because of the","o":["Accrual concept","Money measurement concept","Business entity concept","Consistency convention"],"a":1,"e":"Only events that can be measured in money are recorded. A loss of talent cannot be reliably expressed in money.","pp":1},{"id":"q1_2-05","c":"1.2","f":1,"q":"The accounting equation Assets = Liabilities + Capital is based on the","o":["Accrual concept","Cost concept","Periodicity concept","Dual aspect concept"],"a":3,"e":"Every transaction has two equal aspects. The equation always balances because of this dual aspect."},{"id":"q1_2-06","c":"1.2","f":1,"q":"Salary for March paid in April is still recorded as an expense of March. This follows the","o":["Conservatism convention","Cash basis","Accrual concept","Realisation concept"],"a":2,"e":"Under accrual, an expense is recorded when it is incurred, not when it is paid."},{"id":"q1_2-07","c":"1.2","f":1,"q":"Charging the cost of goods sold in a year against the sales of the same year follows the","o":["Cost concept","Matching concept","Consistency convention","Dual aspect concept"],"a":1,"e":"The matching concept pairs the expenses of a period with the revenues they helped earn in that period."},{"id":"q1_2-08","c":"1.2","f":1,"q":"Revenue on a sale is recognised when a legal right to receive the price arises, not when an order is received. This is the","o":["Accrual concept","Matching concept","Going concern concept","Realisation concept"],"a":3,"e":"Realisation means revenue is earned when the right to receive it is created, usually when goods are sold and delivered."},{"id":"q1_2-09","c":"1.2","f":1,"q":"A machine bought for ₹3,60,000 is now worth ₹4,00,000 in the market but is still shown at its cost less depreciation. This follows the","o":["Full disclosure convention","Materiality convention","Realisation concept","Cost concept"],"a":3,"e":"Assets are recorded at their historical cost, not at market value. Market value changes are ignored under the cost concept."},{"id":"q1_2-10","c":"1.2","f":1,"q":"Making a provision for doubtful debts is an application of the","o":["Convention of conservatism","Matching concept only","Convention of consistency","Money measurement concept"],"a":0,"e":"Conservatism says: anticipate no profit, but provide for all possible losses. A provision for doubtful debts does exactly that."},{"id":"q1_2-12","c":"1.2","f":1,"q":"Using the same depreciation method year after year so that results can be compared follows the","o":["Convention of consistency","Convention of conservatism","Convention of materiality","Accrual concept"],"a":0,"e":"Consistency means the same methods are applied each year. Results stay comparable over time."},{"id":"q1_2-13","c":"1.2","f":0,"q":"Showing figures in the financial statements rounded to the nearest rupee is based on the","o":["Convention of consistency","Cost concept","Dual aspect concept","Convention of materiality"],"a":3,"e":"Paise do not affect any user's decision, so they can be dropped. Only material items need separate attention."},{"id":"q1_2-14","c":"1.2","f":0,"q":"Disclosing a pending legal claim against the business in a note to the accounts follows the","o":["Convention of conservatism","Realisation concept","Cost concept","Convention of full disclosure"],"a":3,"e":"Full disclosure requires all material facts, including contingent liabilities, to be shown fully and fairly."},{"id":"q1_2-15","c":"1.2","f":0,"q":"Preparing the Profit and Loss Account for a period of twelve months follows the","o":["Consistency convention","Accounting period concept","Matching concept","Going concern concept"],"a":1,"e":"The life of the business is split into equal periods, usually a year, so that results can be measured regularly."},{"id":"q1_2-18","c":"1.2","f":0,"q":"GAAP stands for","o":["Government Approved Accounting Policies","Generally Accepted Accounting Principles","General Accounting and Audit Procedures","Generally Applied Audit Practices"],"a":1,"e":"GAAP is the common set of rules, conventions, standards and procedures accepted by the accounting profession."},{"id":"q1_3-02","c":"1.3","f":1,"q":"Import duty paid on raw materials is","o":["Capital expenditure","Capital receipt","Deferred revenue expenditure","Revenue expenditure"],"a":3,"e":"Raw materials are consumed in normal operations, so duty on them is part of the cost of goods, a revenue item. Duty on machinery would be capital."},{"id":"q1_3-04","c":"1.3","f":1,"q":"₹45,000 spent on overhauling a second-hand truck before it is first used in the business is","o":["Deferred revenue expenditure","Revenue expenditure","Capital expenditure","Capital loss"],"a":2,"e":"Repairs needed to put a newly bought second-hand asset into working condition are part of its cost."},{"id":"q1_3-05","c":"1.3","f":1,"q":"Wages paid to the firm's own workers for building a new storeroom are","o":["A capital loss","Revenue expenditure","Capital expenditure","Deferred revenue expenditure"],"a":2,"e":"Wages are normally revenue, but wages spent on creating a fixed asset are added to the cost of that asset."},{"id":"q1_3-06","c":"1.3","f":0,"q":"₹1,200 spent on painting the office walls during the year is","o":["Capital receipt","Deferred revenue expenditure","Revenue expenditure","Capital expenditure"],"a":2,"e":"Routine painting maintains the building. It does not add a new asset or increase capacity."},{"id":"q1_3-07","c":"1.3","f":0,"q":"Legal fees paid to defend a suit about the ownership of the existing factory land are","o":["Deferred revenue expenditure","Capital expenditure","Revenue expenditure","Capital receipt"],"a":2,"e":"The fees protect an asset the firm already owns. Nothing new is acquired, so it is a revenue expense."},{"id":"q1_3-08","c":"1.3","f":0,"q":"Registration fees and stamp duty paid on buying a building are","o":["Revenue loss","Capital expenditure","Capital loss","Revenue expenditure"],"a":1,"e":"Expenses on acquiring a property are part of its cost."},{"id":"q1_3-09","c":"1.3","f":0,"q":"Interest on a term loan taken to build a factory, for the period before production starts, is","o":["Revenue expenditure","Capital expenditure","Capital receipt","Revenue loss"],"a":1,"e":"Interest during the construction period, before the asset is ready for use, is added to the cost of the asset."},{"id":"q1_3-10","c":"1.3","f":0,"q":"Compensation paid to workers who were retrenched is","o":["Deferred revenue expenditure","Revenue expenditure","Capital loss","Capital expenditure"],"a":1,"e":"It is a cost of running the business and gives no lasting asset, so it is revenue expenditure."},{"id":"q1_3-11","c":"1.3","f":1,"q":"Under current accounting practice (AS 26), heavy advertising spent to launch a new product is treated as","o":["A capital loss","Capital expenditure","Deferred revenue expenditure carried forward for 3 years","Revenue expenditure of the year"],"a":3,"e":"AS 26 requires spending on advertising, promotion, research and training to be charged as an expense in the year it is incurred."},{"id":"q1_3-12","c":"1.3","f":1,"q":"Which of the following is a capital receipt?","o":["Bad debts recovered","Commission received","Rent received from a tenant","Sale proceeds of an old machine"],"a":3,"e":"Selling a fixed asset is outside normal trading, so the proceeds are a capital receipt. The others are revenue receipts."},{"id":"q1_3-13","c":"1.3","f":1,"q":"An insurance claim received for a machine completely destroyed by fire is a","o":["Revenue expenditure","Revenue receipt","Capital expenditure","Capital receipt"],"a":3,"e":"The claim replaces a fixed asset, so it is a capital receipt."},{"id":"q1_3-14","c":"1.3","f":0,"q":"An amount received from a customer whose debt was written off as bad two years ago is a","o":["Revenue receipt","Capital profit","Liability","Capital receipt"],"a":0,"e":"Bad debts recovered relate to normal trading and are credited to the Profit and Loss Account."},{"id":"q1_3-15","c":"1.3","f":0,"q":"A loan of ₹2,00,000 taken from a bank is a","o":["Revenue receipt","Revenue income","Capital profit","Capital receipt"],"a":3,"e":"A loan creates a liability. It is a capital receipt and does not affect profit."},{"id":"q1_3-16","c":"1.3","f":0,"q":"Premium received on issue of shares is a","o":["Capital profit","Revenue receipt","Revenue profit","Revenue income"],"a":0,"e":"It arises from raising capital, not from trading, so it is a capital profit."},{"id":"q1_3-18","c":"1.3","f":0,"q":"Which of these is a revenue loss?","o":["Discount allowed to customers","Loss on sale of land","Loss of a building by earthquake","Discount on issue of shares"],"a":0,"e":"Discount allowed arises in normal trading. The others are capital losses."},{"id":"q1_3-19","c":"1.3","f":0,"q":"Capital expenditure is shown in the","o":["Trading Account","Profit and Loss Account","Cash Flow Statement only","Balance Sheet"],"a":3,"e":"Capital expenditure creates an asset, which appears on the asset side of the Balance Sheet. Only its depreciation goes to the P&L."},{"id":"q1_3-20","c":"1.3","f":0,"q":"A dealer in second-hand cars buys a car for resale. For the dealer this is","o":["Capital loss","Deferred revenue expenditure","Revenue expenditure","Capital expenditure"],"a":2,"e":"The cars are the dealer's stock-in-trade, so buying them is a purchase of goods, a revenue item. A car bought for the dealer's own use would be capital."},{"id":"q1_3-21","c":"1.3","f":0,"q":"Import duty paid on raw materials bought for production is","o":["Revenue expenditure","Deferred revenue expenditure","A capital loss","Capital expenditure"],"a":0,"e":"Raw materials are bought for resale or production in the normal course. Duty on them is part of the cost of goods (purchases), which is revenue expenditure."},{"id":"q1_3-22","c":"1.3","f":0,"q":"Compensation received from the government for compulsory acquisition of the firm's land is a","o":["Capital receipt","Revenue income of the year","Revenue receipt","Deferred revenue receipt"],"a":0,"e":"It replaces a fixed asset taken away and is not from normal operations, so it is a capital receipt."}],"mocks":{},"cards":[["1.1","Book-keeping vs Accounting vs Accountancy","Book-keeping (record, classify) ⊂ Accounting (also summarise, analyse, communicate) ⊂ Accountancy (whole body of theory and practice)."],["1.1","Four frameworks of accounting","Conceptual, Legal (Acts), Institutional (standard-setting bodies), Regulatory (RBI, SEBI, IRDAI, TRAI)."],["1.1","Language of business","Accounting, because it communicates results and position to users."],["1.1","Sole proprietor liability","Unlimited. Owner and business are one in law but separate in accounts (business entity concept)."],["1.1","LLP","Separate legal entity with limited liability of partners, under the LLP Act, 2008."],["1.2","Going concern","The business will continue for the foreseeable future, so assets are shown at cost less depreciation, not at break-up value."],["1.2","Accrual concept","Revenue and expenses are recorded when earned or incurred, not when cash moves."],["1.2","Matching concept","Expenses of a period are matched with the revenues of that period."],["1.2","Conservatism (prudence)","Provide for all expected losses; do not anticipate profits."],["1.2","Money measurement","Only events that can be measured in money are recorded."],["1.2","Materiality","Items too small to affect decisions need not be shown separately."],["1.3","Capital expenditure","Gives benefit over more than one year; creates or improves a fixed asset (e.g. installation of a new machine)."],["1.3","Revenue expenditure","Benefit used up within the year; maintains earning capacity (e.g. repairs, wages)."],["1.3","Deferred revenue expenditure","Revenue in nature but benefit spread over a few years (e.g. heavy advertisement for a new product)."],["1.3","Capital receipt","Not from normal business: loans, capital introduced, sale of fixed assets."]],"counts":{"practice":43,"mock":100,"fullPractice":350,"fullCards":115,"fullQuestions":450}};</script>

function calcDep(){
  const c=Math.max(0,numIn("depC",0)), r=Math.max(0,numIn("depR",0)), l=Math.max(1,Math.min(50,Math.round(numIn("depL",1)))), p=Math.max(0,Math.min(100,numIn("depP",0))), y=Math.max(1,Math.min(15,Math.round(numIn("depY",5)))), k=$("#depK").value;
  sub.dep={c,r,l,p,k,y};
  if(!c){ sub.dep.out="Please enter the cost of the asset."; return; }
  if(k==="slm" && r>c){ sub.dep.out="Residual value cannot be more than the cost."; return; }
  const rows=[]; let bv=c; const slm=(c-r)/l;
  for(let i=1;i<=y;i++){ let d = k==="slm" ? (i<=l?slm:0) : bv*p/100; d=Math.round(d*100)/100; rows.push([i,bv,d,bv-d]); bv=Math.round((bv-d)*100)/100; }
  const how = k==="slm" ? `Annual depreciation = (${inr(c)} − ${inr(r)}) ÷ ${l} = <b>${inr(slm)}</b>, the same every year.` : `Each year: ${p}% of the opening book value, so the charge falls every year and the book value never reaches zero.`;
  sub.dep.out = `<p class="small">${how}</p><div class="tbl"><table><thead><tr><th>Year</th><th>Opening book value</th><th>Depreciation</th><th>Closing book value</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="mono">${inr(r[1])}</td><td class="mono">${inr(r[2])}</td><td class="mono">${inr(r[3])}</td></tr>`).join("")}</tbody></table></div>`;
}

function addMonthsClamp(d, n){ const y=d.getFullYear(), m=d.getMonth()+n, day=d.getDate(); const last=new Date(y, m+1, 0).getDate(); return new Date(y, m, Math.min(day,last)); }
function addDays(d, n){ const x=new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function parseD(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
const NAT = {"0-26":"Republic Day","7-15":"Independence Day","9-2":"Gandhi Jayanti"};
const holName = d => d.getDay()===0 ? "a Sunday" : (NAT[d.getMonth()+"-"+d.getDate()] ? NAT[d.getMonth()+"-"+d.getDate()]+", a national holiday" : "");
function calcMaturity(){
  const ds=$("#matD").value, t=$("#matT").value, n=Math.max(0,Math.min(999,parseInt($("#matN").value||"0",10)||0)), e=$("#matE").value==="1";
  const d=parseD(ds); sub.mat={d:ds,t,n,e};
  if(!d){ sub.mat.out="Please pick the bill date."; return; }
  if(t==="dem"){ sub.mat.out=`A bill payable on demand or at sight is due when it is presented. <b>No days of grace</b> are allowed.`; return; }
  const steps=[];
  let base;
  if(t==="m"){ base=addMonthsClamp(d,n); const plain=new Date(d.getFullYear(), d.getMonth()+n, d.getDate()); steps.push(`${n} month${n===1?"":"s"} after ${DMY(d)} = <b>${DMY(base)}</b>`+(plain.getDate()!==d.getDate()?` (that month has no ${d.getDate()}th, so the last day of the month is used)`:"")); }
  else { base=addDays(d,n); steps.push(`${n} day${n===1?"":"s"} after ${DMY(d)}, leaving out the date of the bill = <b>${DMY(base)}</b>`); }
  let due=addDays(base,3); steps.push(`Add 3 days of grace = <b>${DMY(due)}</b>`);
  if(e){ due=addDays(due,1); steps.push(`It was declared an emergency holiday, so the bill is due on the next day = <b>${DMY(due)}</b>`); }
  else { let h=holName(due), guard=0; while(h && guard++<7){ const prev=addDays(due,-1); steps.push(`${DMY(due)} is ${h} (a public holiday), so move to the preceding business day = <b>${DMY(prev)}</b>`); due=prev; h=holName(due); } }
  sub.mat.out = `<b>Due date: ${DMY(due)}</b><ol class="steps small">${steps.map(s=>`<li>${s}</li>`).join("")}</ol><p class="small muted">The tool knows Sundays, 26 January, 15 August and 2 October. If the due date is any other public holiday in your state, the bill is due on the business day before it.</p>`;
}

/* ---------- PRACTICE SESSION ---------- */
function orderForPractice(ids){
  const unseen=[], wrong=[], right=[];
  shuffle(ids).forEach(id=>{ const a=prog.answers[id]; if(!a) unseen.push(id); else if(!a.last) wrong.push(id); else right.push(id); });
  return unseen.concat(wrong, right);
}
function startSession(ids, title, back){
  if(!ids.length){ toast("No questions here yet"); return; }
  Tools.reset();
  go("session", {ids, i:0, title, back, picked:null, log:[]});
}

/* ---------- MOCK EXAM ---------- */
function mockKinds(){
  if(FULL) return [
    {k:"m1", t:"Mock Exam 1", d:"50 questions · 1 hour · fixed paper", n:50, min:60},
    {k:"m2", t:"Mock Exam 2", d:"50 questions · 1 hour · fixed paper", n:50, min:60},
    {k:"shuffle", t:"Shuffle Mock", d:"50 questions · 1 hour · a new paper every time, in exam weightage", n:50, min:60},
    {k:"mini", t:"Mini Mock", d:"20 questions · 24 minutes · quick check across all modules", n:20, min:24}
  ];
  return [{k:"taster", t:"Taster Mock (Module 1)", d:"10 questions · 12 minutes · Module 1 only", n:10, min:12}];
}
function buildMock(k){
  if(k==="m1"||k==="m2") return D.mocks[k].slice();
  const pool = openPool();
  if(k==="taster") return shuffle(pool).slice(0,10);
  const split = k==="mini" ? SPLIT_20 : SPLIT_50;
  let out=[];
  split.forEach((cnt,i)=>{ const ids=(byModule[i+1]||[]).slice(); out=out.concat(shuffle(orderForPractice(ids).slice(0,Math.max(cnt*3,cnt))).slice(0,cnt)); });
  return shuffle(out);
}

function tick(){
  if(view==="session"||view==="chapter"){ const g=sub.game, el=$("#mtimer"); if(g && !g.end && el) el.textContent=fmtTime((Date.now()-g.start)/1000+g.miss*5); }
  if(view!=="exam"||!prog||!prog.live) return;
  const left = prog.live.dur - (Date.now()-prog.live.start)/1000;
  const t = $("#timer"); if(t){ t.textContent = fmtTime(left); t.classList.toggle("low", left<300); }
  if(left<=0){ toast("Time is up. Your mock has been submitted."); submitMock(); }
}
function submitMock(){
  const X = prog.live; if(!X) return;
  Tools.saveNow();
  const used = Math.min(X.dur, Math.round((Date.now()-X.start)/1000));
  let right=0; const bym={};
  X.qids.forEach(id=>{ const q=Q[id], m=modOf(q.c); bym[m]=bym[m]||[0,0,0]; bym[m][1]++; const a=X.ans[id];
    if(a===undefined){ bym[m][2]++; prog.mistakes[id]=0; }
    else { const ok=a===q.a; if(ok){right++; bym[m][0]++;} record(id, ok); } });
  const score = Math.round(right*100/X.qids.length);
  prog.mocks.push({k:X.k, t:X.t, at:Date.now(), used, score, right, n:X.qids.length, qids:X.qids, ans:X.ans, bym, notes:(X.notes||"").slice(0,4000)});
  if(prog.mocks.length>60) prog.mocks=prog.mocks.slice(-60);
  prog.live=null; touchDay(); save(); Tools.close();
  go("result", {i:prog.mocks.length-1, filter:"all"});
}
function resultView(){

  const mods = Object.keys(r.bym).sort((a,b)=>a-b);
  const weakest = mods.slice().sort((a,b)=>pct(r.bym[a][0],r.bym[a][1])-pct(r.bym[b][0],r.bym[b][1]))[0];
  return shell(`<div class="stack" style="gap:16px">

      ${mods.map(m=>{ const [c,n]=r.bym[m]; return `<tr><td>${m}. ${esc(MODS[m-1].title)}</td><td class="mono">${c}/${n}</td><td class="mono">${c*2}/${n*2}</td><td><div class="bar ${pct(c,n)>=60?"g":""}" style="min-width:80px"><i style="width:${pct(c,n)}%"></i></div></td></tr>`; }).join("")}
      </tbody></table></div>
      ${weakest&&mods.length>1?`<div class="row"><span class="grow small">Weakest in this attempt: <b>${weakest}. ${esc(MODS[weakest-1].title)}</b></span><button class="btn" data-act="openChapter" data-m="${weakest}" data-t="mcq">Practise it</button></div>`:""}
      <p class="small muted">Wrong and unanswered questions have been added to your Mistake Book. This score is for practice only and does not predict your exam result.</p>
    </div>

      <div class="omr">${r.qids.map((id,k)=>{ const a=r.ans[id], q=Q[id]; return `<div class="r"><span class="n">${k+1}</span>${L.map((l,j)=>`<i class="${j===q.a?(a===j?"ok":"f"):(a===j?"bad":"")}">${l}</i>`).join("")}</div>`; }).join("")}</div>

    ${r.notes?`<details class="card"><summary><b>Your rough sheet notes</b></summary><pre class="fmt">${esc(r.notes)}</pre></details>`:""}

      <div class="explain">${esc(q.e)}</div></div>`; }).join(""):`<p class="muted">Nothing to show for this filter.</p>`}

      ${["MC","MR","M+","M−","C","7","8","9","÷","⌫","4","5","6","×","%","1","2","3","−","√","±","0",".","+","="].map(k=>`<button data-ck="${k}" class="${/^M/.test(k)?"m":/[÷×−+%√]/.test(k)?"op":k==="="?"eq":""}">${k}</button>`).join("")}
    </div>
  </div>
  <div class="panel" id="rough" role="dialog" aria-label="Rough sheet">
    <div class="ph" data-drag="rough">✏️ Rough sheet<button class="x" data-tk="close-rough" aria-label="Close rough sheet">×</button></div>
    <div class="rb"><button data-tk="pen" class="on">Pen</button><button data-tk="eraser">Eraser</button><button data-tk="clear">Clear page</button><span style="flex:1"></span><button data-tk="draw" class="on">Draw</button><button data-tk="type">Type</button></div>
    <canvas id="rcv"></canvas><textarea id="rtx" placeholder="Type your working here" style="display:none"></textarea>
  </div>`;
  const calc = root.querySelector("#calc"), rough = root.querySelector("#rough");
  const cv = root.querySelector("#rcv"), tx = root.querySelector("#rtx");
  let ctx = cv.getContext("2d"), mode = "pen", drawing = false, last = null, saveT = null;
  /* calculator */
  let cur = "0", acc = null, op = null, fresh = true, mem = 0, expr = "";
  const fmt = v => { if(!isFinite(v)) return "Error"; const r = Math.round(v*1e10)/1e10; let s = String(r); if(s.length>14) s = r.toPrecision(10).replace(/\.?0+(e|$)/,"$1"); return s; };
  const apply = (a,b,o) => o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:o==="÷"?(b===0?NaN:a/b):b;
  function show(){ root.querySelector("#cOut").textContent = cur; root.querySelector("#cExp").textContent = expr; root.querySelector("#cMem").textContent = mem? " · M="+fmt(mem) : ""; }
  function key(k){
    const v = parseFloat(cur);
    if(/^[0-9]$/.test(k)){ cur = (fresh||cur==="0"||cur==="Error") ? k : (cur.length<15? cur+k : cur); fresh=false; }
    else if(k==="."){ if(fresh||cur==="Error"){ cur="0."; fresh=false; } else if(!cur.includes(".")) cur+="."; }
    else if(k==="C"){ cur="0"; acc=null; op=null; fresh=true; expr=""; }
    else if(k==="⌫"){ if(!fresh && cur.length>1) cur=cur.slice(0,-1); else { cur="0"; fresh=true; } }
    else if(k==="±"){ if(cur!=="0" && cur!=="Error") cur = cur[0]==="-" ? cur.slice(1) : "-"+cur; }
    else if(k==="√"){ cur = fmt(Math.sqrt(v)); fresh=true; }
    else if(k==="%"){
      if(acc!==null && op==="×"){ expr=fmt(acc)+" × "+fmt(v)+"% ="; cur=fmt(acc*v/100); acc=null; op=null; }
      else if(acc!==null && op==="÷"){ expr=fmt(acc)+" ÷ "+fmt(v)+"% ="; cur=fmt(acc/(v/100)); acc=null; op=null; }
      else cur = fmt(acc!==null && (op==="+"||op==="−") ? acc*v/100 : v/100);
      fresh=true; }
    else if("+−×÷".includes(k)){ if(op && !fresh){ acc = apply(acc, v, op); cur = fmt(acc); } else if(acc===null || !op) acc = v; op = k; fresh = true; expr = fmt(acc)+" "+k; }
    else if(k==="="){ if(op){ const r = apply(acc, v, op); expr = fmt(acc)+" "+op+" "+fmt(v)+" ="; cur = fmt(r); acc=null; op=null; fresh=true; } }
    else if(k==="MC") mem=0;
    else if(k==="MR"){ cur=fmt(mem); fresh=true; }
    else if(k==="M+"){ mem+=v||0; fresh=true; }
    else if(k==="M−"){ mem-=v||0; fresh=true; }
    if(cur==="NaN") cur="Error";
    show();
  }
  calc.addEventListener("click", e=>{ const b=e.target.closest("[data-ck]"); if(b) key(b.dataset.ck); });
  document.addEventListener("keydown", e=>{
    if(!calc.classList.contains("open") || /input|textarea|select/i.test((e.target.tagName||""))) return;
    const map = {"+":"+","-":"−","*":"×","/":"÷","Enter":"=","=":"=","Backspace":"⌫","Escape":"C",".":".","%":"%"};
    if(/^[0-9]$/.test(e.key)){ key(e.key); e.preventDefault(); } else if(map[e.key]){ key(map[e.key]); e.preventDefault(); }
  });
  /* rough sheet */
  function fit(){
    const r = cv.getBoundingClientRect(); if(!r.width) return;
    const dpr = window.devicePixelRatio||1, w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(cv.width===w && cv.height===h) return;
    cv.width=w; cv.height=h; ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); restore();
  }
  function restore(){ const src = view==="exam" && prog && prog.live && prog.live.sketch; if(!src) return; const img=new Image(); img.onload=()=>{ const r=cv.getBoundingClientRect(); ctx.drawImage(img,0,0,r.width,r.height); }; img.src=src; }
  function persist(){ clearTimeout(saveT); saveT=setTimeout(saveNow, 400); }
  function saveNow(){ if(!prog||!prog.live||view!=="exam") return; try{ if(cv.width) prog.live.sketch = cv.toDataURL("image/png"); }catch(e){} prog.live.notes = tx.value; save(); }
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener("pointerdown", e=>{ drawing=true; last=pos(e); try{ cv.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); });
  cv.addEventListener("pointermove", e=>{ if(!drawing) return; const p=pos(e);
    ctx.globalCompositeOperation = mode==="eraser" ? "destination-out" : "source-over";
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#2340A8";
    ctx.lineWidth = mode==="eraser" ? 18 : 2.2; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; e.preventDefault(); });
  const end = ()=>{ if(drawing){ drawing=false; persist(); } };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
  tx.addEventListener("input", persist);
  rough.addEventListener("click", e=>{ const b=e.target.closest("[data-tk]"); if(!b) return; const k=b.dataset.tk;
    if(k==="pen"||k==="eraser"){ mode=k; rough.querySelectorAll('[data-tk="pen"],[data-tk="eraser"]').forEach(x=>x.classList.toggle("on", x.dataset.tk===k)); }
    if(k==="clear"){ if(tx.style.display!=="none") tx.value=""; else { const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); } persist(); }
    if(k==="draw"||k==="type"){ const t=k==="type"; tx.style.display=t?"block":"none"; cv.style.display=t?"none":"block"; rough.querySelectorAll('[data-tk="draw"],[data-tk="type"]').forEach(x=>x.classList.toggle("on", x.dataset.tk===k)); rough.querySelectorAll('[data-tk="pen"],[data-tk="eraser"]').forEach(x=>x.disabled=t); if(t) tx.focus(); else fit(); }
  });
  root.addEventListener("click", e=>{ const b=e.target.closest("[data-tk]"); if(!b) return; if(b.dataset.tk==="close-calc") calc.classList.remove("open"); if(b.dataset.tk==="close-rough"){ saveNow(); rough.classList.remove("open"); } });
  /* drag panels by their header (desktop and touch) */
  root.querySelectorAll("[data-drag]").forEach(h=>{
    const p = h.parentElement; let sx, sy, ox, oy, on=false;
    h.addEventListener("pointerdown", e=>{ if(e.target.closest("button")) return; on=true; const r=p.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top; try{ h.setPointerCapture(e.pointerId); }catch(x){} });
    h.addEventListener("pointermove", e=>{ if(!on) return; const r=p.getBoundingClientRect(); const x=Math.min(window.innerWidth-r.width, Math.max(0, ox+e.clientX-sx)), y=Math.min(window.innerHeight-40, Math.max(0, oy+e.clientY-sy)); Object.assign(p.style,{left:x+"px",top:y+"px",right:"auto",bottom:"auto"}); });
    h.addEventListener("pointerup", ()=>{ on=false; });
  });
  // on phones the panels sit across the bottom, so leave room to scroll the page clear of them
  function pad(){ let h=0; if(window.innerWidth<=560) [calc,rough].forEach(x=>{ if(x.classList.contains("open")) h=Math.max(h,x.offsetHeight+16); }); document.body.style.paddingBottom = h? h+"px" : ""; }
  window.addEventListener("resize", ()=>{ if(rough.classList.contains("open")) fit(); pad(); });
  return {
    toggleCalc(){ calc.classList.toggle("open"); show(); pad(); },
    toggleRough(){ const o=!rough.classList.contains("open"); rough.classList.toggle("open", o); if(o){ if(view==="exam") tx.value = (prog.live&&prog.live.notes)||""; fit(); } else saveNow(); pad(); },
    reset(){ cur="0"; acc=null; op=null; fresh=true; mem=0; expr=""; show(); tx.value=""; const r=cv.getBoundingClientRect(); if(r.width) ctx.clearRect(0,0,r.width,r.height); cv.width=0; },
    close(){ calc.classList.remove("open"); rough.classList.remove("open"); pad(); },
    saveNow
  };
})();

    nextQ(){ sub.i++; sub.picked=null; render(); window.scrollTo(0,0); },
    endSession(){ sub.done=true; render(); },
    startFlash(){ const m=+b.dataset.m; let list=D.cards.filter(c=>modOf(c[0])===m); if(b.dataset.v==="due") list=list.filter(c=>!prog.cards[c[1]]); if(!list.length){ toast("You know every card in this set"); return; } go("chapter",{m, t:"cards", flash:{list:shuffle(list),i:0,flip:false,got:0}}); },
    flip(){ sub.flash.flip=!sub.flash.flip; render(); },
    cardKnow(){ const f=sub.flash, c=f.list[f.i]; if(b.dataset.v==="1"){ prog.cards[c[1]]=1; f.got++; } else delete prog.cards[c[1]]; touchDay(); save(); f.i++; f.flip=false; render(); },
    startMatch(){ const m=+b.dataset.m; const pool=D.cards.filter(c=>modOf(c[0])===m); const items=shuffle(pool).slice(0,5); go("chapter",{m, t:"match", game:{items, order:shuffle(items.map((_,i)=>i)), done:[], sel:null, bad:null, miss:0, start:Date.now()}}); },
    mTerm(){ sub.game.sel=+b.dataset.i; sub.game.bad=null; rerender(); },
    mDef(){ const g=sub.game, i=+b.dataset.i; if(g.sel===null){ toast("Tap a term first"); return; }
      if(i===g.sel){ g.done.push(i); g.sel=null; g.bad=null;
        if(g.done.length===g.items.length){ g.end=Math.round((Date.now()-g.start)/1000)+g.miss*5; const m=sub.m; const r=prog.match[m]||{best:0,plays:0}; r.plays++; if(!r.best||g.end<r.best){ r.best=g.end; g.best=true; } prog.match[m]=r; touchDay(); save(); clearInterval(timerH); }
      } else { g.miss++; g.bad=i; }
      rerender(); },
    instr(){ go("instr",{k:b.dataset.k}); },
    startMock(){ if(!$("#agree").checked){ $("#agErr").textContent="Please tick the box to confirm you have read the instructions."; return; } startMock(b.dataset.k); },
    resume(){ go("exam"); },
    toolCalc(){ Tools.toggleCalc(); },
    toolRough(){ Tools.toggleRough(); },
    examPick(){ const id=prog.live.qids[prog.live.i]; prog.live.ans[id]=+b.dataset.k; save(); rerender(); },
    clearAns(){ delete prog.live.ans[prog.live.qids[prog.live.i]]; save(); rerender(); },
    toggleMark(){ const id=prog.live.qids[prog.live.i]; if(prog.live.mark[id]) delete prog.live.mark[id]; else prog.live.mark[id]=1; save(); rerender(); },
    examNav(){ prog.live.i=Math.min(prog.live.qids.length-1,Math.max(0,prog.live.i+ +b.dataset.d)); save(); render(); window.scrollTo(0,0); },
    examJump(){ prog.live.i=+b.dataset.i; save(); render(); window.scrollTo(0,0); },
    askSubmit(){ sub.confirm=true; render(); window.scrollTo(0,0); },
    cancelSubmit(){ sub.confirm=false; render(); },
    submitMock(){ submitMock(); },
    review(){ go("result",{i:+b.dataset.i, filter:"all"}); },
    theme(){ theme=b.dataset.v; S.set("theme",theme); applyTheme(); render(); },
    rename(){ const v=$("#rName").value.trim(), err=$("#rErr"); if(!v){ err.textContent="Please enter a name."; return; }
      if(users.some(u=>u.id!==me.id && u.name.toLowerCase()===v.toLowerCase())){ err.textContent="Another profile already uses this name."; return; }
      const u=users.find(x=>x.id===me.id); u.name=v; me=u; saveUsers(); toast("Name saved"); render(); },
    savePin(){ const err=$("#pinErr"); const u=users.find(x=>x.id===me.id);
      if(u.pin){ const o=($("#oldPin").value||"").trim(); if(hash(u.id+"|"+o)!==u.pin){ err.textContent="Your current PIN is not right."; return; } }
      const v=$("#newPin").value.trim(), v2=$("#newPin2").value.trim();
      if(v && !/^\d{4}$/.test(v)){ err.textContent="The PIN must be exactly 4 digits."; return; }
      if(v!==v2){ err.textContent="The two new PINs do not match."; return; }
      if(!v && !u.pin){ err.textContent="Enter a 4-digit PIN to add one."; return; }
      u.pin=v?hash(u.id+"|"+v):null; me=u; saveUsers(); toast(v?"PIN saved":"PIN removed"); render(); },
    exportCode(){ try{ sub.exportCode=btoa(unescape(encodeURIComponent(JSON.stringify({app:"ffca2",v:1,name:me.name,p:Object.assign({},prog,{live:null})})))); }catch(err){ sub.exportCode=""; toast("Could not create a code"); } render(); },
    copyCode(){ copyText(sub.exportCode, $("#codeOut")); },
    copyShop(){ copyText(SHOP, $("#shopUrl")); },
    askImport(){ const t=$("#codeIn").value.trim(); try{ const o=JSON.parse(decodeURIComponent(escape(atob(t)))); if(o.app!=="ffca2"||!o.p) throw 0; sub.pending=o; sub.confirmImport=true; render(); }catch(err){ $("#codeErr").textContent="That code does not look right. Copy the whole code and try again."; } },
    doImport(){ prog=Object.assign(blankProg(), sub.pending.p); prog.live=null; save(); toast("Progress restored"); go("chapters"); },
    cancelConfirm(){ sub.confirmImport=false; sub.confirmDelete=false; sub.confirmReset=false; render(); },
    askReset(){ sub.confirmReset=true; sub.confirmDelete=false; render(); },
    doReset(){ prog=blankProg(); touchDay(); save(); toast("Progress cleared"); go("chapters"); },
    askDelete(){ sub.confirmDelete=true; sub.confirmReset=false; render(); },
    doDelete(){ if(me.pin){ const v=($("#delPin")||{}).value||""; if(hash(me.id+"|"+v.trim())!==me.pin){ $("#delErr").textContent="That PIN is not right."; return; } }
      users=users.filter(u=>u.id!==me.id); saveUsers(); S.del("p."+me.id); me=null; prog=null; sess.set(null); toast("Profile deleted"); go("login",{}); }
  };
  if(H[a]){ e.preventDefault(); H[a](); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="revFilter"){ sub.filter=e.target.value; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const id=e.target.id;
    if(id==="pin"){ e.preventDefault(); $('[data-act="checkPin"]').click(); }
    else if(["nName","nPin","nPin2"].includes(id)){ e.preventDefault(); $('[data-act="createUser"]').click(); }
    else if(id==="rName"){ e.preventDefault(); $('[data-act="rename"]').click(); }
    else if(e.target.classList && e.target.classList.contains("flash")){ e.preventDefault(); e.target.click(); }
  }
  if(e.key===" " && e.target.classList && e.target.classList.contains("flash")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") tick(); else if(prog && prog.live) Tools.saveNow(); });

/* ---------- boot ---------- */
const sid = sess.get();
const su = sid && users.find(u=>u.id===sid);
if(su){ me=su; prog=loadProg(su.id); if(liveOk()) view="exam"; }
render();
})();

</script>
