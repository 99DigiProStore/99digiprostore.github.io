    var act = b.getAttribute("data-act"), s = V.step && stepById(V.step);
    switch (act) {
      case "learned": S.seen[s.id] = true; save(); var nx = STEPS[STEPS.indexOf(s) + 1]; if (nx) go(nx.id); else setTab("prog"); break;
      case "stage-do": V.stage = "do"; render(); var ta = app.querySelector("#draft"); if (ta) ta.focus(); break;
      case "stage-learn": V.stage = "learn"; render(); break;
      case "check":
        var txt = (app.querySelector("#draft").value || "").trim(); S.draft[s.id] = txt;
        if (PP.words(txt) < 3) { toast("Write your prompt first"); break; }
        V.res = PP.score(txt, s); S.best[s.id] = Math.max(S.best[s.id] || 0, V.res.total); save(); V.stage = "compare"; render(); window.scrollTo(0, 0); break;
      case "giveup": S.model[s.id] = true; S.draft[s.id] = (app.querySelector("#draft").value || "").trim(); if (S.best[s.id] == null) S.best[s.id] = S.draft[s.id] && PP.words(S.draft[s.id]) >= 3 ? Math.min(PP.score(S.draft[s.id], s).total, PASS - 1) : 0; save(); V.res = null; V.stage = "compare"; render(); break;
      case "retry": V.stage = "do"; render(); var t2 = app.querySelector("#draft"); if (t2) { t2.focus(); t2.setSelectionRange(t2.value.length, t2.value.length); } break;
      case "copymine": copy(S.draft[s.id] || ""); break;
      case "copymodel": copy(s.model); break;
      case "nextstep": var n2 = STEPS[STEPS.indexOf(s) + 1]; if (n2) go(n2.id); break;
      case "bcopy": var bt = buildText(); if (bt) copy(bt); else toast("Fill at least one box first"); break;
      case "bclear": V.b = {}; kset(ROOT + "-builder", "{}"); render(); break;
      case "print": window.print(); break;
      case "settings": setTab("settings"); break;
      case "rename": var nn = (app.querySelector("#rename").value || "").trim(); if (!nn) return; USER.name = nn; saveReg(); render(); toast("Name saved"); break;
      case "setpin":
        var np = (app.querySelector("#newpin").value || "").trim(), cp = app.querySelector("#curpin");
        if (USER.pin && hash((cp.value || "") + USER.id) !== USER.pin) return msg("pinmsg", "Current PIN doesn't match.", true);
        if (!/^\d{4}$/.test(np)) return msg("pinmsg", "The PIN must be exactly 4 digits.", true);
        USER.pin = hash(np + USER.id); saveReg(); render(); toast("PIN saved"); break;
      case "rmpin": var cp2 = app.querySelector("#curpin"); if (hash((cp2.value || "") + USER.id) !== USER.pin) return msg("pinmsg", "Enter your current PIN to remove it.", true); USER.pin = ""; saveReg(); render(); toast("PIN removed"); break;
      case "mkbackup": var code = "PPL1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); copy(code); app.querySelector("#bk").value = code; msg("bkmsg", "Backup code copied. Keep it somewhere safe."); break;
      case "restore":
        try { var raw = (app.querySelector("#bk").value || "").trim(); if (raw.indexOf("PPL1:") !== 0) throw 0; var o = JSON.parse(decodeURIComponent(escape(atob(raw.slice(5))))); if (!o || typeof o.best !== "object") throw 0; S = Object.assign(blank(), o); save(); msg("bkmsg", "Progress restored."); }
        catch (er) { msg("bkmsg", "That code doesn't look right. Copy the whole code and try again.", true); }
        break;
      case "switch": USER = null; S = null; REG.cur = null; saveReg(); V.login = { pick: null, err: "", adding: false }; render(); break;
      case "reset": if (b.getAttribute("data-sure")) { S = blank(); save(); setTab("home"); toast("Progress reset"); } else { b.setAttribute("data-sure", "1"); b.textContent = "Tap again to confirm reset"; } break;
      case "rmuser": if (b.getAttribute("data-sure")) { kdel(ROOT + "-u-" + USER.id); var id0 = USER.id; REG.users = REG.users.filter(function (u) { return u.id !== id0; }); REG.cur = null; saveReg(); USER = null; S = null; V.login = { pick: null, err: "", adding: false }; render(); } else { b.setAttribute("data-sure", "1"); b.textContent = "Tap again to remove for good"; } break;
      case "addprofile": V.login = { pick: null, err: "", adding: true }; render(); break;
      case "canceladd": V.login = { pick: null, err: "", adding: false }; render(); break;
      case "adduser":
        var name = (app.querySelector("#nuName").value || "").trim(), pin = (app.querySelector("#nuPin").value || "").trim();
        if (!name) { V.login.err = "Please enter your name."; render(); return; }
        if (pin && !/^\d{4}$/.test(pin)) { V.login.err = "The PIN must be exactly 4 digits, or leave it empty."; render(); app.querySelector("#nuName").value = name; return; }
        var uid = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nu = { id: uid, name: name, pin: pin ? hash(pin + uid) : "" };
        REG.users.push(nu); loadUser(nu); save(); V.tab = "home"; V.login = { pick: null, err: "", adding: false }; render(); break;
      case "enter":
        var pk = REG.users.filter(function (x) { return x.id === V.login.pick; })[0], v = (app.querySelector("#pin").value || "");
        if (hash(v + pk.id) !== pk.pin) { V.login.err = "That PIN doesn't match. Try again."; render(); return; }
        loadUser(pk); V.tab = "home"; V.login = { pick: null, err: "", adding: false }; render(); break;
      case "forgetpin": if (b.getAttribute("data-sure")) { kdel(ROOT + "-u-" + V.login.pick); var fp = V.login.pick; REG.users = REG.users.filter(function (u) { return u.id !== fp; }); saveReg(); V.login = { pick: null, err: "", adding: !REG.users.length }; render(); } else { b.setAttribute("data-sure", "1"); b.textContent = "Tap again to remove this profile and its progress"; } break;
    }
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "draft") { var s = stepById(V.step); S.draft[s.id] = t.value; save(); var wc = app.querySelector("#wc"); if (wc) wc.textContent = PP.words(t.value) + " words"; }
    if (t.id === "libq") { V.q = t.value; var pos = t.selectionStart; render(); var n = app.querySelector("#libq"); n.focus(); n.setSelectionRange(pos, pos); }
    if (t.hasAttribute("data-b")) {
      V.b[t.getAttribute("data-b")] = t.value; kset(ROOT + "-builder", JSON.stringify(V.b));
      var bt = buildText(), o = app.querySelector("#bout"); o.innerHTML = bt ? esc(bt) : '<span class="muted">Start typing on the left.</span>';
      app.querySelector("#bwc").textContent = PP.words(bt) + " words"; app.querySelector("#bscore").innerHTML = bScore(bt ? PP.score(bt, { facts: [] }) : null);
    }
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "pin") { e.preventDefault(); var b = app.querySelector('[data-act="enter"]'); if (b) b.click(); }
    if (e.key === "Enter" && (e.target.id === "nuName" || e.target.id === "nuPin")) { e.preventDefault(); app.querySelector('[data-act="adduser"]').click(); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "draft") { e.preventDefault(); app.querySelector('[data-act="check"]').click(); }
  });
  render();
})();

</script>
</body>
</html>
