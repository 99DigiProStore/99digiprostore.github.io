<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Learn prompt engineering by doing: short lessons, rewrite-the-weak-prompt practice scored out of 10, model answers and a ready prompt library. Works offline.">
<title>Prompt Practice (Free)</title>
<style>
/* Uses only fonts already on the device, so the file works offline and contacts no outside server. */
:root{
  --bg:#F5F5F9; --card:#FFFFFF; --fg:#1A1B2E; --muted:#5D6077; --line:#DDDEEA; --soft:#EFF0F7;
  --ink:#4338CA; --ink-2:#3730A3; --ink-soft:#E6E5FB; --hl:#FFF4C2;
  --good:#15803D; --good-soft:#DCF3E4; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#8A5A00; --warn-soft:#FBF0D9;
  --p1:#2563EB; --p2:#C2410C; --p3:#7C3AED; --p4:#0E7C86; --p5:#BE185D; --p6:#4D7C0F;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1020; --card:#181A2E; --fg:#E7E8F5; --muted:#A0A3BD; --line:#2C2F4A; --soft:#20223A;
  --ink:#A5A0FF; --ink-2:#C4C0FF; --ink-soft:#2A2858; --hl:#3A3214;
  --good:#5CCB8A; --good-soft:#163424; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14;
  --p1:#7FA8F5; --p2:#F59A6B; --p3:#B69AF7; --p4:#5CC9C9; --p5:#F08DB8; --p6:#A9C764; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1020; --card:#181A2E; --fg:#E7E8F5; --muted:#A0A3BD; --line:#2C2F4A; --soft:#20223A;
  --ink:#A5A0FF; --ink-2:#C4C0FF; --ink-soft:#2A2858; --hl:#3A3214;
  --good:#5CCB8A; --good-soft:#163424; --bad:#F2867D; --bad-soft:#3C1E1C; --warn:#E8B85C; --warn-soft:#3A2E14;
  --p1:#7FA8F5; --p2:#F59A6B; --p3:#B69AF7; --p4:#5CC9C9; --p5:#F08DB8; --p6:#A9C764; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,4.6vw,2.4rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.3rem;font-weight:750}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.3em}
li+li{margin-top:4px}
a{color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)} .small{font-size:.87rem}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.hide{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:.9rem;flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.04rem}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:.84rem;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tabs{background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-block:20px 56px}
.ed-banner{background:var(--warn-soft);color:var(--warn);font-size:.86rem;text-align:center;padding:6px 16px}
.ed-banner a{color:inherit;font-weight:700}
/* cards and buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.soft{background:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 15px;font-weight:650;text-decoration:none;color:var(--fg);line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{background:var(--ink-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.txt{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px}
textarea.txt{min-height:150px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
/* hero */
.hero{display:grid;gap:18px;padding:22px;border-radius:16px;background:linear-gradient(135deg,var(--ink-soft),var(--card));border:1px solid var(--line)}
.hero .lead{font-size:1.07rem;color:var(--muted);max-width:62ch}
.six{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.six div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:5px solid var(--c)}
.six b{display:block;font-family:var(--f-display)}
.six span{font-size:.82rem;color:var(--muted)}
/* progress bar */
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
/* module list */
.mod{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mod:hover{border-color:var(--ink)}
.num{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink);font-family:var(--f-mono);font-weight:800}
.mod.done .num{background:var(--good);color:var(--card)}
.parthead{margin-top:10px}
/* step list */
.steps{display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st:hover{border-color:var(--ink)}
.st .k{flex:none;font-family:var(--f-mono);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.k.learn{background:var(--ink-soft);color:var(--ink)}
.k.do{background:var(--hl);color:var(--warn)}
.st .ok{margin-left:auto;font-weight:800;font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.st.locked{opacity:.65}
.ok.pass{color:var(--good)} .ok.fail{color:var(--warn)}
/* stage pills */
.stage{display:flex;gap:6px;flex-wrap:wrap}
.stage span{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.stage span.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.stage span.was{color:var(--ink);border-color:var(--ink)}
/* lesson */
.lesson p+p{margin-top:10px}
.lesson ul,.lesson ol{margin-top:8px}
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.vs div{border-radius:10px;padding:12px;border:1px solid var(--line)}
.vs .b{background:var(--bad-soft)} .vs .g{background:var(--good-soft)}
.vs small{display:block;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.vs .b small{color:var(--bad)} .vs .g small{color:var(--good)}
.prompt{font-family:var(--f-mono);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.rem{background:var(--ink-soft);border-radius:10px;padding:12px 14px}
.rem b{color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:6px}
.opt:hover{border-color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
/* task */
.situ{border-left:5px solid var(--ink);background:var(--soft)}
.weak{background:var(--bad-soft);border:1px dashed var(--bad);border-radius:10px;padding:10px 12px}
.score{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem;background:conic-gradient(var(--c) calc(var(--v)*10%),var(--soft) 0);position:relative}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.ring b{position:relative;z-index:1}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--soft)}
.item .m{flex:none;font-weight:800;width:22px;text-align:center}
.item.y .m{color:var(--good)} .item.n .m{color:var(--bad)} .item.o .m{color:var(--muted,#888)} .item.o{opacity:.75}
.item .pts{margin-left:auto;font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cmp>div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.wc{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.lockbox{border:1px dashed var(--ink);background:var(--ink-soft);border-radius:var(--r);padding:16px}
/* library */
.lib{display:flex;flex-direction:column;gap:8px}
.lp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lp .prompt{margin-top:6px}
.ph{background:var(--hl);border-radius:4px;padding:0 3px;color:var(--fg)}
.lp.locked .prompt{filter:blur(4px);user-select:none}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:650;font-size:.88rem}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
/* builder */
.bf label{font-weight:700;display:flex;gap:8px;align-items:center}
.bf label i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.bf textarea.txt{min-height:64px}
.out{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:80px}
/* certificate */
.cert{border:6px double var(--ink);border-radius:14px;padding:32px 24px;text-align:center;background:var(--card)}
.cert h1{font-size:clamp(1.5rem,4vw,2.2rem)}
.cert .who{font-family:var(--f-display);font-size:1.7rem;font-weight:800;color:var(--ink);margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem}
.exrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.exrow:hover{border-color:var(--ink)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:650;z-index:50;font-size:.92rem}
footer{border-top:1px solid var(--line);padding:18px 0 28px;font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.card{padding:14px}.hero{padding:16px}.score{align-items:flex-start}}
@media print{
  .top,.tabs,.ed-banner,footer,.noprint{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .cert{border-color:#4338CA;margin-top:40px}
}

</style>
