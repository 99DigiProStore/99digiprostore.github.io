<script>
window.APP_CONFIG = {"edition":"free","title":"Prompt Practice (Free)","version":"v2.1 (October 2026)","email":"digiprostore99@gmail.com","store":"https://99digiprostore.myinstamojo.com","site":"https://99digiprostore.github.io","price":"₹99 + payment charges","fullTitle":"Prompt Learn and Practice: Basics to Advanced"};
window.MODS = [{"id":"m01","t":"What makes a good prompt","sub":"Why vague questions get vague answers, and the six parts that fix it.","part":"Basics","steps":[{"k":"learn","id":"m01l1","t":"A prompt is a brief, not a search","body":"\u003cp>A prompt is the message you type into an AI chat tool such as ChatGPT, Claude or Gemini. Most people type it like a Google search: a few words, then hope.\u003c/p>\u003cp>An AI tool is closer to a smart new assistant on their first day. It knows a lot in general, but nothing about \u003cb>you\u003c/b>, your situation or what a good answer looks like for you. If you brief it well, it does good work. If you don't, it guesses.\u003c/p>\u003cp>So the skill is not finding magic words. It is giving a clear brief.\u003c/p>","bad":"diet plan","good":"You are a nutrition coach. Make a 7-day vegetarian diet plan for me: I'm 28, work from home, want to lose 4 kg in 2 months and don't eat onion or garlic. Show it as a table with breakfast, lunch, snack and dinner. Keep meals simple and cheap to cook in an Indian kitchen.","rem":["The AI only knows what you tell it.","A short prompt is not a fast prompt: you'll spend longer fixing the answer.","Write the brief you'd give a smart new assistant."],"q":{"q":"Why does \"diet plan\" get a poor answer?","o":["The AI doesn't know about diets","It has no facts about you, so it gives a generic plan","The prompt has a spelling mistake"],"a":1,"why":"The AI knows diets well. It just doesn't know your age, goal, food habits or how you want the answer."}},{"k":"learn","id":"m01l2","t":"The six parts of a good prompt","body":"\u003cp>Almost every strong prompt has some of these six parts. You don't need all six every time, but checking them is the fastest way to improve any prompt.\u003c/p>\u003col>\u003cli>\u003cb>Role:\u003c/b> who the AI should act as. \u003ci>\"You are an experienced CA.\"\u003c/i>\u003c/li>\u003cli>\u003cb>Task:\u003c/b> what to do, with a clear action word. \u003ci>\"Explain\", \"Draft\", \"Compare\".\u003c/i>\u003c/li>\u003cli>\u003cb>Context:\u003c/b> the facts of your situation. \u003ci>Who it's for, numbers, dates, what you've tried.\u003c/i>\u003c/li>\u003cli>\u003cb>Format:\u003c/b> how the answer should look. \u003ci>A table, 5 bullets, under 100 words.\u003c/i>\u003c/li>\u003cli>\u003cb>Examples:\u003c/b> a sample of the style or output you want.\u003c/li>\u003cli>\u003cb>Limits:\u003c/b> tone, length, language and what to avoid.\u003c/li>\u003c/ol>\u003cp>An easy way to remember them: \u003cb>R-T-C-F-E-L\u003c/b>, \"Really Try Clear Format, Every Line\".\u003c/p>","rem":["Role, Task, Context, Format, Examples, Limits.","Context and Format usually make the biggest difference.","Every practice task in this lab is scored on these parts."],"q":{"q":"\"Answer in a table with 3 columns\" is which part?","o":["Role","Context","Format"],"a":2,"why":"It describes how the answer should look, so it's Format."}},{"k":"do","id":"m01t1","t":"Fix a one-line study question","who":"You are a B.Com 1st year student. Your exam is in 10 days and you don't understand depreciation. You want a simple explanation with one worked example using small numbers, then 3 practice questions.","weak":"explain depreciation","facts":[["b.com","bcom","commerce"],["10 days"],["worked example","example"],["3 practice questions","three practice questions","3 questions","three questions"]],"tip":"Start with a role (a teacher), then add who you are, what you want and how it should look.","model":"You are a patient accounts teacher. I'm a B.Com 1st year student with my exam in 10 days, and I don't understand depreciation. Explain it in simple words in under 150 words, then show one worked example with small numbers in a table, and end with 3 practice questions with answers at the bottom. Avoid jargon."},{"k":"do","id":"m01t2","t":"Fix a vague birthday message","who":"Your mother's 55th birthday is on Sunday. She loves gardening and old Hindi songs. You want a short, warm WhatsApp message in simple Hindi written in English letters (Hinglish), not too long.","weak":"write birthday wish for mom","facts":[["55"],["gardening","garden"],["hindi songs","old songs","songs"],["whatsapp"]],"tip":"Add who it's for, what she loves and where it'll be sent.","model":"You are a warm, thoughtful writer. Write a WhatsApp birthday message for my mother, who turns 55 on Sunday. She loves gardening and old Hindi songs, so mention both in a sweet way. Write it in simple Hinglish (Hindi in English letters), in 3 to 4 short lines, with 2 emojis at most. Keep it warm, not dramatic."},{"k":"learn","id":"m01l3","t":"Specific beats short","body":"\u003cp>Compare these two answers you might get back:\u003c/p>\u003cul>\u003cli>From \u003ci>\"tips for interview\"\u003c/i>: ten tips that apply to everyone, like \"be confident\" and \"dress well\".\u003c/li>\u003cli>From a prompt that says the job, your background and your worry: tips about the exact questions you'll face and how to answer them with your own story.\u003c/li>\u003c/ul>\u003cp>Every fact you add removes a guess. A good habit is to read your prompt and ask: \u003cb>\"What would a stranger have to guess here?\"\u003c/b> Then add that.\u003c/p>","rem":["Every fact you add removes a guess.","Ask: what would a stranger have to guess?","Numbers, names, dates and goals are the best facts."],"q":{"q":"Which addition helps the most for \"tips for interview\"?","o":["Adding \"please\"","Saying the job role and your background","Writing it in capital letters"],"a":1,"why":"The role and your background let the AI tailor the tips to you. Politeness and capitals don't change the content."}},{"k":"do","id":"m01t3","t":"Fix a job interview question","who":"You have an interview on Friday for a junior accountant role at a mid-size manufacturing company. You are a fresher with a B.Com and Tally skills. You're worried about the question \"Tell me about yourself\".","weak":"tips for interview","facts":[["junior accountant","accountant"],["fresher"],["tally"],["tell me about yourself"]],"tip":"Name the job, your background and the exact question you're worried about.","model":"Act as an experienced recruiter for finance roles. I have an interview on Friday for a junior accountant job at a mid-size manufacturing company. I'm a fresher with a B.Com and Tally skills. Help me answer \"Tell me about yourself\": give me a sample answer under 120 words, then 3 bullet points on what to avoid. Keep it honest and confident, not boastful."}]},{"id":"m02","t":"Role and Task","sub":"Tell the AI who to be and exactly what to do.","part":"Basics","steps":[{"k":"learn","id":"m02l1","t":"Role: who should answer?","body":"\u003cp>Starting with a role changes the voice, depth and focus of the answer. \u003ci>\"You are a GST consultant\"\u003c/i> gets a different answer from \u003ci>\"You are a class 8 teacher\"\u003c/i>, even for the same question.\u003c/p>\u003cp>Good roles are specific: not just \"an expert\" but \u003ci>\"an HR manager who hires freshers for banks\"\u003c/i>. You can also give the AI a role for the \u003cb>reader\u003c/b>: \u003ci>\"Explain it like you're talking to my grandmother.\"\u003c/i>\u003c/p>","bad":"how to save tax","good":"You are a friendly tax adviser for salaried people in India. ...","rem":["Start with \"You are ...\" or \"Act as ...\".","Make the role specific to the job.","A role sets voice and depth. It doesn't make the AI more accurate, so still check facts."],"q":{"q":"Which role is most useful for writing a polite reminder to a client who hasn't paid?","o":["You are a genius","You are an accounts manager who handles client payments politely","You are a lawyer who sues people"],"a":1,"why":"It matches the job and the tone you want. \"Genius\" adds nothing, and a lawyer would be too harsh for a first reminder."}},{"k":"do","id":"m02t1","t":"Add a role: savings advice","who":"You are 24, earn ₹30,000 a month in your first job in Pune and want to start saving. You want plain advice from someone who explains money simply, with a monthly split of your salary.","weak":"how to save money","facts":[["24"],["30000","30k","30 thousand"],["first job"],["pune"]],"tip":"Begin with \"You are a ...\". Pick a role that explains money simply.","model":"You are a friendly personal finance coach who explains money simply. I'm 24, in my first job in Pune, and earn ₹30,000 a month. Suggest how I should split my salary each month in a table with columns for item, amount and why. Keep it practical, avoid naming specific stocks or funds, and use plain English."},{"k":"do","id":"m02t2","t":"Add a role for the reader","who":"Your grandfather, 78, wants to know what UPI is and whether it is safe. He uses a basic smartphone and is nervous about fraud. You want an explanation you can read out to him.","weak":"what is upi","facts":[["78","grandfather"],["safe","safety","fraud"],["smartphone","phone"]],"tip":"Give the AI a role, and say who the reader is so it pitches the answer right.","model":"You are a patient bank officer explaining things to senior citizens. Explain what UPI is to my 78-year-old grandfather, who uses a basic smartphone and is nervous about fraud. Use very simple words and 5 short bullet points, including 2 safety rules he must never break. Avoid technical terms and keep it calm and reassuring."},{"k":"learn","id":"m02l2","t":"Task: one clear action word","body":"\u003cp>The task is the verb. \u003ci>\"Something about GST\"\u003c/i> has no verb, so the AI picks one for you, usually \"explain everything\".\u003c/p>\u003cp>Choose a verb that matches what you'll do with the answer:\u003c/p>\u003cul>\u003cli>\u003cb>Explain\u003c/b> when you want to understand.\u003c/li>\u003cli>\u003cb>Draft / Write\u003c/b> when you'll send or post it.\u003c/li>\u003cli>\u003cb>List / Suggest\u003c/b> when you want options.\u003c/li>\u003cli>\u003cb>Compare\u003c/b> when you're choosing.\u003c/li>\u003cli>\u003cb>Check / Review\u003c/b> when you already have something and want it improved.\u003c/li>\u003c/ul>\u003cp>If you have two tasks, number them: \u003ci>\"1. Explain X. 2. Then give me 3 questions to test myself.\"\u003c/i>\u003c/p>","rem":["One clear verb per task.","Pick the verb for what you'll do with the answer.","Number multiple tasks so none get skipped."],"q":{"q":"You have a draft email and want it to sound more professional. Best verb?","o":["Write","Rewrite / Improve","Explain"],"a":1,"why":"You already have the email, so you want it rewritten or improved, not a fresh one."}},{"k":"do","id":"m02t3","t":"Pick the right task: compare phones","who":"You want to buy a phone under ₹20,000. You care most about battery life and camera, and you mostly use it for UPI payments, YouTube and photos of your kids. You don't care about gaming.","weak":"best phone","facts":[["20000","20k","20 thousand"],["battery"],["camera"],["gaming"]],"tip":"Your task is to compare and choose, so say \"Compare\" and how to show the comparison.","model":"You are a tech reviewer who helps ordinary buyers. Compare 3 types of phones I should look for under ₹20,000, focusing on battery and camera. I mostly use UPI, YouTube and take photos of my kids, and I don't care about gaming. Show the comparison in a table, then tell me which features matter most. Be honest that models change, and don't invent prices."},{"k":"do","id":"m02t4","t":"Two tasks, numbered","who":"Your company is moving from Excel sheets to a new expense app. You must send a note to your team of 12 people. You want the AI to (1) write the announcement and (2) list 5 questions the team will likely ask, with answers.","weak":"write about new expense app","facts":[["12"],["excel","spreadsheet"],["5 questions","five questions","questions"]],"tip":"Number the two tasks so the AI does both.","model":"You are an office manager who writes clear internal notes. 1. Write a short announcement to my team of 12 people that we're moving from Excel sheets to a new expense app from next month, under 120 words. 2. Then list 5 questions the team will likely ask, with a one-line answer each. Keep the tone friendly and simple."}]},{"id":"m03","t":"Context","sub":"The facts only you know. This is where most prompts fail.","part":"Basics","steps":[{"k":"learn","id":"m03l1","t":"What counts as context","body":"\u003cp>Context is everything about your situation that changes the answer. Good context usually covers:\u003c/p>\u003cul>\u003cli>\u003cb>Who:\u003c/b> you, your reader, your customer.\u003c/li>\u003cli>\u003cb>What:\u003c/b> the subject, product or problem, with numbers.\u003c/li>\u003cli>\u003cb>Why:\u003c/b> your goal and what a good result looks like.\u003c/li>\u003cli>\u003cb>Where and when:\u003c/b> city, platform, deadline.\u003c/li>\u003cli>\u003cb>What you've tried:\u003c/b> so the AI doesn't repeat it.\u003c/li>\u003c/ul>\u003cp>You can paste context too: a draft, a table, an email you received. Just say what it is: \u003ci>\"Here is the client's email: ...\"\u003c/i>\u003c/p>","bad":"write a leave application","good":"Write a leave application to my manager, Mr Rao, for 3 days (12 to 14 March) for my sister's wedding in Nagpur. I've finished the month-end report early and Priya will cover urgent calls. ...","rem":["Who, what, why, where and when, and what you've tried.","Numbers and names make answers specific.","You can paste a draft or email as context: say what it is."],"q":{"q":"Which fact matters most for a leave application?","o":["The dates and the reason","Your favourite colour","The weather"],"a":0,"why":"The dates and reason are what your manager needs. The rest doesn't change the letter."}},{"k":"do","id":"m03t1","t":"Add context: leave application","who":"You need leave from 12 to 14 March (3 days) for your sister's wedding in Nagpur. Your manager is Mr Rao. You've finished the month-end report early, and your colleague Priya will handle urgent calls.","weak":"write a leave application","facts":[["12"],["14"],["wedding"],["nagpur"],["rao"],["priya"]],"tip":"Put in the dates, the reason, the manager's name and who covers your work.","model":"You are an HR professional. Write a polite leave application email to my manager, Mr Rao, asking for 3 days' leave from 12 to 14 March for my sister's wedding in Nagpur. Mention that I've finished the month-end report early and Priya will handle urgent calls. Include a subject line, keep it under 120 words and formal but warm."},{"k":"do","id":"m03t2","t":"Add context: product description","who":"You sell handmade soy wax candles from Jaipur on Instagram. They cost ₹349, burn for 25 hours and come in jasmine and sandalwood. Your buyers are mostly women aged 25 to 40 buying gifts.","weak":"write product description for candle","facts":[["soy"],["jaipur"],["349"],["25 hours"],["jasmine"],["sandalwood"],["gift"]],"tip":"Add what it is, price, features and who buys it.","model":"You are a copywriter for small Indian brands. Write an Instagram product description for my handmade soy wax candles from Jaipur. They cost ₹349, burn for 25 hours and come in jasmine and sandalwood. My buyers are mostly women aged 25 to 40 buying gifts. Write it in under 80 words, then add 5 hashtags. Keep it warm and avoid over-the-top claims."},{"k":"do","id":"m03t3","opt":["role"],"t":"Paste and explain: a confusing notice","who":"Your housing society sent a notice: \"Maintenance revised to ₹3.20 per sq ft w.e.f. 1 April. Arrears to be cleared by 30 April or 18% p.a. interest applies.\" Your flat is 950 sq ft. You want to know what it means and what you'll pay.","weak":"explain this notice","facts":[["3.20","3.2"],["950"],["18%","18 %","18 percent"],["30 april"],["1 april"]],"tip":"Paste the notice, give your flat size and ask exactly what you want to know.","model":"You are a helpful accountant. Here is my housing society's notice: \"Maintenance revised to ₹3.20 per sq ft w.e.f. 1 April. Arrears to be cleared by 30 April or 18% p.a. interest applies.\" My flat is 950 sq ft. Explain in simple words what it means, calculate my new monthly maintenance step by step, and list what I must do by 30 April in 3 bullet points."}]},{"id":"m04","t":"Format","sub":"Decide what the answer should look like before you ask.","part":"Basics","steps":[{"k":"learn","id":"m04l1","t":"Ask for the shape you'll use","body":"\u003cp>If you don't ask for a format, you usually get long paragraphs. Think about where the answer will go and ask for that shape:\u003c/p>\u003cul>\u003cli>Comparing things? Ask for a \u003cb>table\u003c/b> with named columns.\u003c/li>\u003cli>Following steps? Ask for \u003cb>numbered steps\u003c/b>.\u003c/li>\u003cli>Sending it? Ask for a \u003cb>subject line\u003c/b> and a word limit.\u003c/li>\u003cli>Revising? Ask for \u003cb>flashcards\u003c/b>, a \u003cb>checklist\u003c/b> or \u003cb>MCQs\u003c/b>.\u003c/li>\u003cli>Pasting into Excel? Ask for a table with exact column names.\u003c/li>\u003c/ul>\u003cp>Numbers make format precise: \u003ci>\"5 bullets\"\u003c/i>, \u003ci>\"under 100 words\"\u003c/i>, \u003ci>\"3 options\"\u003c/i>.\u003c/p>","bad":"tell me about mutual funds","good":"... Show it as a table with 3 columns: type of fund, risk level, who it suits. Then 3 bullet points on mistakes beginners make.","rem":["Ask for the shape you'll actually use.","Name the table columns.","Numbers make format precise: 5 bullets, under 100 words."],"q":{"q":"You want to paste the answer into Excel. Best format request?","o":["Write a nice essay","A table with columns Date, Item, Amount","Use lots of emojis"],"a":1,"why":"A table with named columns pastes straight into Excel."}},{"k":"do","id":"m04t1","t":"Ask for a table: mutual fund types","who":"You are new to investing and keep hearing about equity, debt and hybrid mutual funds. You want them compared by risk and by who each one suits, and you want to understand it in 5 minutes.","weak":"tell me about mutual funds","facts":[["equity"],["debt"],["hybrid"],["risk"]],"tip":"Ask for a table and name the columns you want.","model":"You are a patient investment educator. I'm new to investing. Compare equity, debt and hybrid mutual funds in a table with 3 columns: type, risk level, and who it suits. Then give 3 bullet points on common beginner mistakes. Keep it simple enough to read in 5 minutes and don't recommend any specific fund."},{"k":"do","id":"m04t2","t":"Ask for numbered steps: GST registration","who":"You are starting a small home bakery in Indore and think you may need GST registration. You want the steps in order, the documents needed, and when registration is actually required.","weak":"gst registration","facts":[["bakery"],["indore"],["documents"],["required","need","when"]],"tip":"This is a process, so ask for numbered steps and a separate documents list.","model":"You are a GST consultant who helps small businesses. I'm starting a small home bakery in Indore. 1. Explain when GST registration is required for a business like mine, in 2 lines. 2. List the registration steps as numbered steps. 3. Give a checklist of the documents needed. Use simple English and tell me to confirm limits on the official GST portal."},{"k":"do","id":"m04t3","opt":["role"],"t":"Ask for revision format: flashcards","who":"You are revising the Indian Constitution for a school exam. You want 10 flashcards on Fundamental Rights, each with a question on one side and a one-line answer on the other.","weak":"fundamental rights notes","facts":[["fundamental rights"],["10","ten"],["flashcards","flash cards"],["school","class"]],"tip":"Say the number of cards and what goes on each side.","model":"You are a civics teacher. Make 10 flashcards on the Fundamental Rights in the Indian Constitution for my school exam. Format each card as Q: (question) and A: (answer in one line). Cover all six rights at least once and keep the language simple for a class 9 student."}]},{"id":"m05","t":"Examples","sub":"Show one sample, and the AI copies the style.","part":"Basics","steps":[{"k":"learn","id":"m05l1","t":"Show, don't just tell","body":"\u003cp>Words like \"catchy\", \"professional\" or \"fun\" mean different things to different people. One example removes the guess.\u003c/p>\u003cp>Ways to add an example:\u003c/p>\u003cul>\u003cli>Paste one line you like: \u003ci>Example: \"Fresh from our oven to your plate, every morning.\"\u003c/i>\u003c/li>\u003cli>Give an input and output pair: \u003ci>\"Ravi, 3 years in sales\" becomes \"Ravi brings 3 years of B2B sales ...\"\u003c/i>\u003c/li>\u003cli>Point to a style: \u003ci>\"in the same style as this message: ...\"\u003c/i>\u003c/li>\u003c/ul>\u003cp>Tell the AI to \u003cb>match the style, not copy the words\u003c/b>, or you'll get your example back with small changes.\u003c/p>","bad":"write catchy taglines","good":"Write 5 taglines for my tea stall. Example of the style I like: \"Kadak chai, softer prices.\" Match the style, but don't reuse the words.","rem":["One example beats three adjectives.","Input and output pairs teach a pattern.","Say \"match the style, don't copy the words\"."],"q":{"q":"What's the risk of giving an example without any instruction?","o":["The AI ignores it","The AI copies it too closely","The AI refuses"],"a":1,"why":"It tends to echo the example. Tell it to match the style, not the words."}},{"k":"do","id":"m05t1","t":"Give a style example: taglines","ex":true,"who":"You run a tea stall near a college in Lucknow called \"Chai Point Adda\". Students love your ginger chai at ₹15. You like short, witty Hindi-English taglines like \"Kadak chai, soft prices\".","weak":"write taglines for tea shop","facts":[["chai point adda"],["lucknow"],["college","students"],["ginger"],["15"]],"tip":"Paste the tagline you like as an example and say \"match the style, don't copy it\".","model":"You are a witty copywriter for small Indian shops. Write 5 taglines for my tea stall \"Chai Point Adda\" near a college in Lucknow. Students love our ginger chai at ₹15. Example of the style I like: \"Kadak chai, soft prices\". Match this short Hindi-English style but don't reuse the words. Keep each tagline under 8 words."},{"k":"do","id":"m05t2","t":"Input and output pair: bio lines","ex":true,"who":"You're making a team page for your small CA firm. You have 4 team members' details and want one-line bios in the same pattern. Example: \"Ravi, 3 years in audit\" should become \"Ravi has 3 years of audit experience and leads our bank audits.\"","weak":"write team bios","facts":[["ca firm","firm"],["4","four"],["ravi"],["one-line","one line"]],"tip":"Give the AI the input and output pair so it learns the pattern.","model":"You are an editor for professional websites. Write one-line bios for the 4 team members of my CA firm. Follow this pattern. For example: \"Ravi, 3 years in audit\" becomes \"Ravi has 3 years of audit experience and leads our bank audits.\" Keep each bio to one line, formal and under 20 words. I'll paste the 4 members' details next."}]},{"id":"m06","t":"Limits and tone","sub":"Length, language, reader level and what to avoid.","part":"Basics","steps":[{"k":"learn","id":"m06l1","t":"Fence the answer in","body":"\u003cp>Limits stop the answer from going off track. Useful limits:\u003c/p>\u003cul>\u003cli>\u003cb>Tone:\u003c/b> polite, firm, friendly, formal, encouraging.\u003c/li>\u003cli>\u003cb>Length:\u003c/b> under 100 words, 3 lines, one page.\u003c/li>\u003cli>\u003cb>Language:\u003c/b> simple English, Hindi, Tamil, Hinglish.\u003c/li>\u003cli>\u003cb>Reader level:\u003c/b> for a class 6 student, for a CFO.\u003c/li>\u003cli>\u003cb>Don'ts:\u003c/b> no jargon, don't make up numbers, don't use emojis.\u003c/li>\u003c/ul>\u003cp>The most useful don't of all: \u003cb>\"If you don't know, say so. Don't make things up.\"\u003c/b>\u003c/p>","rem":["Tone, length, language, reader level, don'ts.","\"If you don't know, say so\" reduces made-up answers.","Limits matter most for anything you'll send."],"q":{"q":"Which limit helps most against made-up facts?","o":["Use emojis","If you're not sure, say so instead of guessing","Write more"],"a":1,"why":"It gives the AI permission to say it doesn't know."}},{"k":"do","id":"m06t1","t":"Set the tone: payment reminder","who":"A client, Mehta Traders, hasn't paid invoice INV-2207 for ₹42,500, which was due 15 days ago. It's your second reminder. You want to stay polite but firm, because you want to keep the client.","weak":"write payment reminder","facts":[["mehta"],["inv-2207","2207"],["42500","42.5k"],["15 days"],["second"]],"tip":"Set the tone (polite but firm) and say it's the second reminder.","model":"You are an accounts manager who handles client payments. Write a second payment reminder email to Mehta Traders for invoice INV-2207 of ₹42,500, which was due 15 days ago. The tone must be polite but firm because we want to keep the client. Include a subject line, keep it under 120 words and don't threaten legal action."},{"k":"do","id":"m06t2","t":"Set the reader level: explain inflation","who":"Your 11-year-old son asked why ice cream that cost ₹10 when you were a child now costs ₹40. You want to explain inflation to him with a story or everyday example, in a few minutes.","weak":"explain inflation","facts":[["11"],["ice cream"],["10"],["40"]],"tip":"Say who the reader is and their age so the AI pitches it right.","model":"You are a fun teacher who explains money to children. Explain inflation to my 11-year-old son, who asked why ice cream that cost ₹10 when I was a child now costs ₹40. Use a short story with everyday examples, in under 150 words. Use simple words only, no jargon, and end with one question I can ask him to check he understood."},{"k":"do","id":"m06t3","opt":["role"],"t":"Set the language: shop notice","who":"You run a kirana store in Chennai and will be closed on 2 and 3 November for Deepavali. Most customers read Tamil. You want a short notice for the shop door and WhatsApp, in Tamil and English.","weak":"shop closed notice","facts":[["kirana"],["chennai"],["2"],["3 november"],["deepavali","diwali"],["tamil"]],"tip":"Say the language(s), the dates and where the notice will be used.","model":"You are a helpful writer for local shops. Write a short notice for my kirana store in Chennai saying we're closed on 2 and 3 November for Deepavali and open again on 4 November. Write it in Tamil first, then English, each under 30 words, for the shop door and WhatsApp. Keep it warm and add festival wishes."}]},{"id":"m07","t":"Follow-ups and fixing answers","sub":"The first answer is a draft. Steer it.","part":"Basics","steps":[{"k":"learn","id":"m07l1","t":"Don't start over. Steer.","body":"\u003cp>An AI chat remembers the conversation, so you can fix an answer with a follow-up instead of rewriting everything. Good follow-ups are specific:\u003c/p>\u003cul>\u003cli>\u003ci>\"Make point 3 shorter and remove the jargon.\"\u003c/i>\u003c/li>\u003cli>\u003ci>\"Same content, but as a table.\"\u003c/i>\u003c/li>\u003cli>\u003ci>\"The tone is too formal. Make it sound like a friendly senior.\"\u003c/i>\u003c/li>\u003cli>\u003ci>\"You missed that the budget is ₹5,000. Redo it with that limit.\"\u003c/i>\u003c/li>\u003c/ul>\u003cp>Bad follow-ups are vague: \u003ci>\"make it better\"\u003c/i>, \u003ci>\"try again\"\u003c/i>. Say \u003cb>what\u003c/b> is wrong and \u003cb>how\u003c/b> to fix it.\u003c/p>","rem":["Say what's wrong and how to fix it.","Point to the exact part: \"point 3\", \"the second paragraph\".","Remind it of facts it ignored."],"q":{"q":"The AI's answer is too long. Best follow-up?","o":["Make it better","Cut this to 5 bullets under 60 words, keep the main point about deadlines","Try again"],"a":1,"why":"It says exactly what to change and what to keep."}},{"k":"do","id":"m07t1","opt":["role","detail"],"t":"Write a follow-up: too formal","who":"You asked for an Instagram caption for your café's new cold coffee (₹129) and the AI gave you something that reads like a bank letter. You want it fun, with 2 emojis, under 40 words, and aimed at college students.","weak":"make it better","facts":[["cold coffee"],["129"],["2 emojis","two emojis"],["40"],["college"]],"tip":"Tell it what's wrong (too formal) and exactly how to fix it.","model":"You are a fun social media writer. The caption you wrote is too formal and reads like a bank letter. Rewrite it for our café's new cold coffee at ₹129, aimed at college students. Make it fun and casual, under 40 words, with 2 emojis and one clear line asking people to visit. Don't use the words \"esteemed\" or \"delighted\"."},{"k":"do","id":"m07t2","opt":["role","detail"],"t":"Write a follow-up: it ignored your budget","who":"You asked for a 3-day Goa trip plan for 2 people, and the AI suggested a ₹9,000-a-night resort. Your total budget is ₹25,000 including travel from Pune by train.","weak":"try again","facts":[["goa"],["3-day","3 day","3 days","three days"],["25000","25k"],["pune"],["train"]],"tip":"Remind it of the fact it ignored and ask it to redo the plan within it.","model":"You are a budget travel planner. Your plan ignored my budget. Redo the 3-day Goa trip for 2 people with a total budget of ₹25,000, including train travel from Pune. Show a day-by-day table with costs, keep the total under budget and add a row with the total. Only suggest budget stays and say if any price is a rough guess."},{"k":"learn","id":"m07l2","t":"Let the AI ask you questions first","body":"\u003cp>When you don't know what details to give, flip it: ask the AI to interview you first.\u003c/p>\u003cp>\u003ci>\"Before you answer, ask me up to 5 questions you need to give a good answer. Ask them one at a time.\"\u003c/i>\u003c/p>\u003cp>This works well for resumes, business plans, trip plans and anything personal. You answer, and the final result is built on your real facts.\u003c/p>","rem":["\"Ask me up to 5 questions first\" works when you don't know what to include.","\"One at a time\" keeps it easy to answer.","Then tell it to produce the final result."],"q":{"q":"When is \"ask me questions first\" most useful?","o":["When you want a one-word answer","When you're not sure what details matter","Never"],"a":1,"why":"It lets the AI find the facts it needs from you."}},{"k":"do","id":"m07t3","t":"Ask it to interview you: business plan","who":"You want to start a tiffin service in Hyderabad for office workers but don't know how to write a business plan or what details matter. You'd like the AI to ask you questions first, then write a one-page plan.","weak":"business plan for tiffin service","facts":[["tiffin"],["hyderabad"],["office"],["questions"],["one-page","one page"]],"tip":"Ask the AI to ask you questions first, one at a time, then write the plan.","model":"You are a small business mentor. I want to start a tiffin service in Hyderabad for office workers. Before you write anything, ask me up to 7 questions you need, one at a time. After I answer, write a one-page business plan with headings: customers, menu, pricing, costs, and first month steps. Keep it simple and don't invent numbers I haven't given."}]},{"id":"m07s","t":"When a short prompt is enough","sub":"Not every prompt needs all six parts. Know when to keep it short.","part":"Basics","steps":[{"k":"learn","id":"m07sl1","t":"Match the prompt to the job","body":"\u003cp>The six parts are a toolbox, not a form you must fill every time. For a quick ask, a short prompt is the \u003cb>better\u003c/b> prompt: faster to type and just as good an answer.\u003c/p>\u003cp>A short prompt is enough for:\u003c/p>\u003cul>\u003cli>\u003cb>Facts and meanings:\u003c/b> \u003ci>\"What does EBITDA stand for?\"\u003c/i>\u003c/li>\u003cli>\u003cb>Quick conversions and sums:\u003c/b> \u003ci>\"Convert 72 kg to pounds.\"\u003c/i>\u003c/li>\u003cli>\u003cb>Small edits:\u003c/b> \u003ci>\"Fix the grammar: ...\"\u003c/i>\u003c/li>\u003cli>\u003cb>Word help:\u003c/b> \u003ci>\"5 formal synonyms for 'important'.\"\u003c/i>\u003c/li>\u003cli>\u003cb>Follow-ups in the same chat:\u003c/b> the AI already has the context, so \u003ci>\"Shorter, 3 bullets\"\u003c/i> is enough.\u003c/li>\u003c/ul>\u003cp>\u003cb>The rule:\u003c/b> the more the answer depends on \u003cb>you\u003c/b> (your situation, reader or goal), the more parts you add. If any stranger would want the same answer, keep it short.\u003c/p>","bad":"You are a world-class linguistics expert with 20 years of experience. I am writing something and I need help. Please tell me, in a friendly and clear tone, using simple words, what the opposite of 'generous' is.","good":"Opposite of 'generous'? Give 3 options.","rem":["Quick facts, conversions, small edits and follow-ups need short prompts.","Add parts only when the answer depends on your situation.","Short and clear beats long and padded."],"q":{"q":"Which of these needs a full six-part prompt?","o":["What is 18% of 4,500?","A cover letter for a job I'm applying to","Spell 'accommodation'"],"a":1,"why":"A cover letter depends on you, the job and the reader. The other two have one right answer for everyone."}},{"k":"do","id":"m07st1","t":"Quick meaning","short":12,"who":"You're reading a report and see the word \"accrual\". You just want its meaning in one simple line so you can keep reading.","weak":"You are an expert accounting professor with many years of experience. I am reading a report and I came across a word I don't know. Please explain the word accrual to me in one line, in a simple and friendly way, without jargon.","facts":[["accrual"],["one line","1 line","one sentence","one simple line"]],"tip":"This is a quick fact. One clear line is the best prompt here.","model":"Explain \"accrual\" in one simple line."},{"k":"do","id":"m07st2","t":"Quick grammar fix","short":15,"who":"You typed a chat message to a client: \"He don't know about the meeting.\" You want it corrected before you send it.","weak":"Act as a professional English editor and grammar expert. I am writing a message to a client and I want it to sound correct and professional. Here is my sentence: he don't know about the meeting. Please fix any grammar mistakes and keep the meaning the same.","facts":[["he don't know"],["fix","correct"]],"tip":"Paste the sentence and say \"fix\". That's all the AI needs.","model":"Fix the grammar: \"He don't know about the meeting.\""},{"k":"do","id":"m07st3","t":"Quick conversion","short":12,"who":"A form asks for your height in centimetres. You know it's 5 feet 8 inches.","weak":"You are a helpful maths teacher who explains things clearly. I need to fill in a form that asks for my height in centimetres, but I only know my height in feet and inches, which is 5 feet 8 inches. Please convert it for me.","facts":[["5 feet 8","5 ft 8","5'8"],["cm","centimetre","centimeter"]],"tip":"One number, one unit: keep it short.","model":"Convert 5 feet 8 inches to cm."},{"k":"do","id":"m07st4","t":"Quick word help","short":15,"who":"You're writing a formal email and keep using the word \"important\". You want 5 formal alternatives.","weak":"You are an experienced business writing coach. I am writing a formal email to senior management and I keep using the word important again and again, which sounds repetitive. Could you please give me 5 formal synonyms that I could use instead?","facts":[["important"],["5","five"],["formal"]],"tip":"Say the word, how many options and the style. Done.","model":"Give 5 formal synonyms for \"important\"."},{"k":"do","id":"m07st5","t":"Follow-up in the same chat","short":12,"who":"The AI just wrote you a long reply about saving tax. You're in the same chat and want it as 3 short bullet points.","weak":"You are a tax expert. Earlier in this chat you wrote a reply about saving tax for salaried people. It is too long for me to read. Please take that same reply and make it shorter, in 3 bullet points, keeping the most important ideas.","facts":[["3","three"],["bullet","points"]],"tip":"The AI remembers the chat, so you don't need to repeat the context.","model":"Make it shorter: 3 bullet points."}]},{"id":"m08","t":"Safe and smart use","sub":"Protect your data and check what the AI says.","part":"Basics","steps":[{"k":"learn","id":"m08l1","t":"Never paste these","body":"\u003cp>Anything you type into an AI tool may be stored by the company that runs it. Never paste:\u003c/p>\u003cul>\u003cli>Aadhaar, PAN, bank account or card numbers, OTPs or passwords.\u003c/li>\u003cli>Client or employee personal data your employer hasn't approved.\u003c/li>\u003cli>Confidential company figures, unless your company allows that tool.\u003c/li>\u003c/ul>\u003cp>Instead, \u003cb>replace real details with placeholders\u003c/b>: \u003ci>[Client name]\u003c/i>, \u003ci>[Amount]\u003c/i>, \u003ci>Employee A\u003c/i>. You'll still get a useful answer, then fill in the real details yourself.\u003c/p>","rem":["No Aadhaar, PAN, bank numbers, OTPs or passwords.","Use placeholders like [Client name].","Follow your employer's AI policy."],"q":{"q":"You want help writing a salary letter. What should you do with the employee's PAN?","o":["Paste it so the letter is complete","Use a placeholder like [PAN] and fill it in later","Ask the AI to guess it"],"a":1,"why":"Placeholders keep personal data out of the chat."}},{"k":"learn","id":"m08l2","t":"AI can be confidently wrong","body":"\u003cp>AI tools sometimes state wrong facts, old rules or made-up numbers in a very confident voice. This matters most for \u003cb>tax, law, health, money and exam answers\u003c/b>.\u003c/p>\u003cp>Habits that protect you:\u003c/p>\u003cul>\u003cli>Ask it to \u003cb>show its working\u003c/b> for any calculation, then check it.\u003c/li>\u003cli>Ask: \u003ci>\"What here might be out of date or uncertain?\"\u003c/i>\u003c/li>\u003cli>Check rules and rates on official websites (income tax, GST, RBI, your exam body).\u003c/li>\u003cli>For health or legal matters, use the answer to prepare questions for a real professional.\u003c/li>\u003c/ul>","rem":["Confident is not the same as correct.","Ask for working and for what might be out of date.","Verify tax, law, health and money on official sources."],"q":{"q":"The AI gives you a tax slab rate. What's the smart next step?","o":["Trust it","Check it on the official income tax website","Ask the same question again"],"a":1,"why":"Rules change every year. Official sources are the final word."}},{"k":"do","id":"m08t1","t":"Use placeholders: salary letter","who":"As an HR assistant, you need a salary increment letter for an employee. The employee is Rahul Sharma, but you must not paste his name or PAN into an AI tool. The raise is 12% from 1 April, and the letter should thank the employee for good performance.","weak":"salary increment letter for Rahul Sharma PAN ABCDE1234F","facts":[["12%","12 %","12 percent"],["1 april"],["performance"],["[","placeholder"]],"forbid":["Rahul Sharma","ABCDE1234F"],"tip":"Replace the name and PAN with placeholders like [Employee name].","model":"You are an experienced HR manager. Draft a salary increment letter for [Employee name], [Designation], giving a 12% raise from 1 April, with the new salary as [New CTC]. Thank them for good performance this year. Use placeholders in square brackets for all personal details, keep it formal and warm, and fit it on one page with a subject line."},{"k":"do","id":"m08t2","t":"Ask it to show working and flag doubts","who":"You want to know the EMI on a ₹6,00,000 car loan at 9.5% interest for 5 years. You don't fully trust AI maths, so you want the formula, the step-by-step working and a note on what to double-check with the bank.","weak":"car loan emi","facts":[["600000","6 lakh","6 lakhs"],["9.5"],["5 years","five years","60 months"],["formula"],["bank"]],"tip":"Ask it to show the formula and steps, and to say what you should verify.","model":"You are a careful finance teacher. Calculate the EMI on a car loan of ₹6,00,000 at 9.5% annual interest for 5 years. Show the formula first, then numbered steps of the working, then the final EMI. After that, list 3 things I should double-check with the bank, such as processing fees. If any step is uncertain, say so."}]},{"id":"m09","t":"Study and exams","sub":"Use AI as a tutor that tests you, not a copy machine.","part":"Practice","steps":[{"k":"learn","id":"m09l1","t":"Make it teach, not just tell","body":"\u003cp>The best study prompts make the AI act like a tutor: explain at your level, then test you. Three patterns that work:\u003c/p>\u003cul>\u003cli>\u003cb>Explain like I'm new:\u003c/b> \u003ci>\"Explain X for a class 10 student, with one everyday example.\"\u003c/i>\u003c/li>\u003cli>\u003cb>Test me:\u003c/b> \u003ci>\"Give me 10 MCQs on X, one at a time. Wait for my answer, then tell me if I'm right and why.\"\u003c/i>\u003c/li>\u003cli>\u003cb>Find my gaps:\u003c/b> \u003ci>\"Here's my answer. Mark it out of 5 like an examiner and tell me what's missing.\"\u003c/i>\u003c/li>\u003c/ul>\u003cp>Always mention your \u003cb>exam, class or syllabus\u003c/b>, so the depth is right.\u003c/p>","rem":["Say your class, course or exam.","\"One at a time, wait for my answer\" turns it into a quiz.","Ask it to mark your answer like an examiner."],"q":{"q":"Which prompt makes the AI a quiz master?","o":["Tell me about photosynthesis","Ask me 10 MCQs on photosynthesis one at a time and wait for my answer","Write an essay on photosynthesis"],"a":1,"why":"\"One at a time and wait\" makes it test you instead of just telling you."}},{"k":"do","id":"m09t1","t":"Turn notes into a quiz","who":"You are a class 12 student revising the chapter \"Electrochemistry\" for CBSE board exams. You want 10 MCQs, asked one at a time, with the right answer and a one-line reason after each of your replies.","weak":"electrochemistry questions","facts":[["class 12"],["electrochemistry"],["cbse"],["10","ten"],["one at a time"]],"tip":"Ask for a set number of MCQs, one at a time, and say what to do after each answer.","model":"You are a strict but kind chemistry tutor. Quiz me on the class 12 CBSE chapter Electrochemistry. Ask 10 MCQs one at a time, with 4 options each. Wait for my answer, then tell me if I'm right and give a one-line reason. At the end, give my score out of 10 and the 2 topics I should revise. Don't show the answers before I reply."},{"k":"do","id":"m09t2","t":"Explain a hard topic simply","who":"You're a BBA student and don't understand the time value of money. You learn best with everyday Indian examples, like FDs or saving for a bike. You want it explained in under 200 words with one small calculation.","weak":"time value of money","facts":[["bba"],["fd","fixed deposit"],["bike"],["200"],["calculation"]],"tip":"Say your course, how you learn best and the length.","model":"You are a finance teacher who uses everyday examples. Explain the time value of money to me, a BBA student, in under 200 words. Use Indian examples like an FD or saving for a bike, then show one small calculation step by step. Avoid formulas with Greek letters and keep the language simple."},{"k":"do","id":"m09t3","t":"Get your answer marked","locked":true},{"k":"do","id":"m09t4","t":"Make a study timetable","locked":true},{"k":"learn","id":"m09l2","t":"Use AI honestly","locked":true},{"k":"do","id":"m09t5","t":"Feedback, not ghost-writing","locked":true},{"k":"do","id":"m09t6","t":"Make a mind map outline","locked":true},{"k":"do","id":"m09t7","t":"Practise a viva","locked":true},{"k":"do","id":"m09t8","t":"Learn a new language phrase set","locked":true},{"k":"learn","id":"m09l3","t":"Ask for the exam pattern","locked":true},{"k":"do","id":"m09t9","t":"Make a timed mock","locked":true},{"k":"do","id":"m09t10","t":"Summarise a long chapter","locked":true},{"k":"do","id":"m09t11","t":"Clear one doubt fast","locked":true},{"k":"do","id":"m09t12","t":"Plan revision for weak spots","locked":true}]},{"id":"m10","t":"Jobs and career","sub":"Resumes, cover letters, interviews and offers.","part":"Practice","steps":[{"k":"learn","id":"m10l1","t":"Give it your real story","body":"\u003cp>AI writes generic resumes when you give it nothing. Recruiters spot them in seconds. The fix: give it \u003cb>your facts\u003c/b> and the \u003cb>job description\u003c/b>.\u003c/p>\u003cul>\u003cli>Paste the job ad and ask it to match your experience to the requirements.\u003c/li>\u003cli>Give numbers: \u003ci>\"handled 300 invoices a month\"\u003c/i>, \u003ci>\"reduced errors by 20%\"\u003c/i>.\u003c/li>\u003cli>Ask it to \u003cb>never invent\u003c/b> experience or skills you don't have.\u003c/li>\u003c/ul>\u003cp>\u003ci>\"Use only the facts I give you. If something is missing, ask me instead of making it up.\"\u003c/i>\u003c/p>","rem":["Paste the job ad.","Give numbers from your real work.","\"Use only my facts, don't invent\"."],"q":{"q":"Why say \"don't invent experience\"?","o":["AI may add skills you don't have, which can fail you in the interview","It makes the answer longer","It's polite"],"a":0,"why":"Made-up claims get caught in interviews and background checks."}},{"k":"do","id":"m10t1","t":"Resume bullet points with numbers","who":"You worked 2 years as an accounts executive in a Delhi logistics firm. You processed about 300 vendor invoices a month, did bank reconciliations for 4 accounts and cut payment delays by 15%. You want strong resume bullets.","weak":"resume points for accountant","facts":[["2 years","two years"],["logistics"],["300"],["reconciliation"],["15%","15 %","15 percent"]],"tip":"Give your numbers and ask it to use only your facts.","model":"You are a resume writer for finance professionals. Write 5 resume bullet points for my 2 years as an accounts executive at a Delhi logistics firm. I processed about 300 vendor invoices a month, did bank reconciliation for 4 accounts and cut payment delays by 15%. Start each bullet with a strong verb, keep each under 20 words and don't invent anything I haven't said."},{"k":"do","id":"m10t2","t":"Match a resume to a job ad","who":"You're applying for a \"Financial Analyst\" role at a Bengaluru startup. The ad asks for Excel modelling, MIS reporting and SQL basics. You have strong Excel and MIS experience but only beginner SQL.","weak":"make my resume better","facts":[["financial analyst"],["bengaluru","bangalore"],["excel"],["mis"],["sql"],["beginner"]],"tip":"Give the role, the ad's requirements and your honest skill levels.","model":"You are a recruiter for finance roles at startups. I'm applying for a Financial Analyst role at a Bengaluru startup that asks for Excel modelling, MIS reporting and SQL basics. I have strong Excel and MIS experience but only beginner SQL. Review my resume against these needs and give me a table: requirement, how my resume shows it, what to change. Be honest about gaps and don't overstate my SQL. Resume: [paste]"},{"k":"do","id":"m10t3","t":"Short cover letter","locked":true},{"k":"do","id":"m10t4","t":"LinkedIn headline and About","locked":true},{"k":"learn","id":"m10l2","t":"Practise interviews out loud","locked":true},{"k":"do","id":"m10t5","t":"Run a mock interview","locked":true},{"k":"do","id":"m10t6","t":"Answer a tricky question","locked":true},{"k":"do","id":"m10t7","t":"Negotiate an offer politely","locked":true},{"k":"learn","id":"m10l3","t":"Ask for options, then choose","locked":true},{"k":"do","id":"m10t8","t":"Resignation email, 3 versions","locked":true},{"k":"do","id":"m10t9","t":"Plan a career switch","locked":true},{"k":"do","id":"m10t10","t":"Follow-up after an interview","locked":true},{"k":"do","id":"m10t11","t":"Prepare questions to ask them","locked":true},{"k":"do","id":"m10t12","t":"Write a referral request","locked":true}]},{"id":"m11","t":"Office work and email","sub":"Emails, meeting notes, reports and difficult messages.","part":"Practice","steps":[{"k":"learn","id":"m11l1","t":"Emails: purpose, reader, action","body":"\u003cp>Every work email prompt needs three things:\u003c/p>\u003cul>\u003cli>\u003cb>Purpose:\u003c/b> inform, request, remind, apologise, decline.\u003c/li>\u003cli>\u003cb>Reader:\u003c/b> your boss, a client, a vendor, the whole team. This sets the tone.\u003c/li>\u003cli>\u003cb>Action:\u003c/b> what you want the reader to do, and by when.\u003c/li>\u003c/ul>\u003cp>Add \u003cb>\"include a subject line\"\u003c/b> and a word limit. Most work emails are better under 120 words.\u003c/p>","rem":["Purpose, reader, action.","Subject line plus a word limit.","Say the deadline you need."],"q":{"q":"Which detail most changes an email's tone?","o":["Who the reader is","The font","The day of the week"],"a":0,"why":"A CEO, a client and a teammate each need a different tone."}},{"k":"do","id":"m11t1","t":"Request data from another team","who":"You need last quarter's sales data by region from the sales team by Thursday for the board MIS report. The sales head is Mr Bose. Last time the data came late, so you want to be clear but friendly.","weak":"email for data","facts":[["quarter"],["region"],["thursday"],["mis"],["bose"]],"tip":"Say what data, by when, why and who it's for.","model":"You are a finance manager who writes clear emails. Write an email to Mr Bose, the sales head, asking for last quarter's sales data by region by Thursday for the board MIS report. Mention the format I need: an Excel table by region and month. Keep it under 110 words with a subject line, friendly but clear about the deadline, without mentioning that it was late last time."},{"k":"do","id":"m11t2","t":"Decline a request politely","who":"A colleague asked you to take over the vendor onboarding project. You're already handling the GST audit until 30 June and can't take more. You want to say no politely and suggest someone else, Neha, who has done onboarding before.","weak":"say no to colleague","facts":[["vendor onboarding","onboarding"],["gst audit"],["30 june"],["neha"]],"tip":"Give the reason, the date you're busy until and an alternative.","model":"You are a polite workplace communicator. Write a short message to a colleague declining to take over the vendor onboarding project, because I'm handling the GST audit until 30 June. Suggest Neha, who has done onboarding before, and offer a 15-minute handover chat after June. Keep it under 90 words, warm and respectful, not apologetic."},{"k":"do","id":"m11t3","t":"Apologise to a client","locked":true},{"k":"do","id":"m11t4","t":"Write to the whole team","locked":true},{"k":"learn","id":"m11l2","t":"Notes, summaries and reports","locked":true},{"k":"do","id":"m11t5","t":"Meeting notes to action items","locked":true},{"k":"do","id":"m11t6","t":"Summarise for a busy boss","locked":true},{"k":"do","id":"m11t7","t":"Monthly report draft","locked":true},{"k":"learn","id":"m11l3","t":"Difficult messages","locked":true},{"k":"do","id":"m11t8","t":"Push back on a deadline","locked":true},{"k":"do","id":"m11t9","t":"Reply to an angry customer","locked":true},{"k":"do","id":"m11t10","t":"Chase a colleague, nicely","locked":true},{"k":"do","id":"m11t11","t":"Make a checklist from a process","locked":true},{"k":"do","id":"m11t12","t":"Draft a short policy","locked":true}]},{"id":"m12","t":"Excel and data","sub":"Get formulas that work on your sheet the first time.","part":"Practice","steps":[{"k":"learn","id":"m12l1","t":"Describe your sheet like a map","body":"\u003cp>AI can't see your spreadsheet. To get a formula that works first time, describe it like a map:\u003c/p>\u003cul>\u003cli>\u003cb>Columns:\u003c/b> \"A has dates, B has customer names, C has amounts.\"\u003c/li>\u003cli>\u003cb>Rows:\u003c/b> \"Headers in row 1, data in rows 2 to 500.\"\u003c/li>\u003cli>\u003cb>Where the answer goes:\u003c/b> \"in D2, then copied down.\"\u003c/li>\u003cli>\u003cb>Your Excel version\u003c/b> if it matters (e.g. Excel 2016 doesn't have XLOOKUP).\u003c/li>\u003c/ul>\u003cp>Ask it to \u003cb>explain the formula\u003c/b> in one line, so you can check it does what you meant.\u003c/p>","bad":"formula for total sales","good":"Column A has dates, B has region, C has amount. Data is in rows 2 to 500. Give me a formula in F2 that totals amounts for the region typed in E2 ...","rem":["Columns, rows, where the answer goes.","Mention your Excel version if needed.","Ask for a one-line explanation, then test it."],"q":{"q":"What's missing from \"give me a VLOOKUP for my sheet\"?","o":["Which columns hold what and where the answer goes","The word please","Nothing"],"a":0,"why":"Without the layout, the AI has to guess column letters."}},{"k":"do","id":"m12t1","opt":["role","limits"],"t":"Sum by condition","who":"Your sheet has dates in column A, region in column B and sale amount in column C, with data in rows 2 to 500. You want a formula in F2 that totals sales for the region typed in E2.","weak":"formula for total sales","facts":[["column a"],["column b"],["column c"],["500"],["f2"],["e2"]],"tip":"Describe the columns, rows and the cell where the answer goes.","model":"You are an Excel expert. My sheet has dates in column A, region in column B and sale amount in column C, with data in rows 2 to 500. Write a formula for cell F2 that totals sales for the region typed in E2. Give the formula first, then explain it in 2 lines. Use SUMIFS and avoid helper columns."},{"k":"do","id":"m12t2","opt":["role","limits"],"t":"Lookup without errors","who":"Sheet \"Orders\" has product codes in column A. Sheet \"Prices\" has codes in column A and prices in column B. You use Excel 2016, so no XLOOKUP. You want the price in Orders column D and \"Not found\" if a code is missing.","weak":"vlookup formula","facts":[["orders"],["prices"],["column a"],["2016"],["xlookup"],["not found"]],"tip":"Name both sheets, the columns, your Excel version and what to show on errors.","model":"You are an Excel trainer. I use Excel 2016, so don't use XLOOKUP. Sheet \"Orders\" has product codes in column A; sheet \"Prices\" has codes in column A and prices in column B. Write a formula for Orders column D that brings the price and shows \"Not found\" if the code is missing. Give the formula for D2, then explain each part in a numbered list of 3 steps."},{"k":"do","id":"m12t3","t":"Fix a formula that's broken","locked":true},{"k":"do","id":"m12t4","t":"Clean messy names","locked":true},{"k":"learn","id":"m12l2","t":"Data tasks: give a sample","locked":true},{"k":"do","id":"m12t5","t":"Plan a PivotTable","locked":true},{"k":"do","id":"m12t6","t":"Choose the right chart","locked":true},{"k":"do","id":"m12t7","t":"Flag overdue invoices","locked":true},{"k":"do","id":"m12t8","t":"Ask for a formula explained","locked":true},{"k":"learn","id":"m12l3","t":"Always test AI formulas","locked":true},{"k":"do","id":"m12t9","t":"GST calculation columns","locked":true},{"k":"do","id":"m12t10","t":"Find duplicates","locked":true},{"k":"do","id":"m12t11","t":"Turn steps into a macro idea","locked":true},{"k":"do","id":"m12t12","t":"Build a simple budget sheet","locked":true}]},{"id":"m13","t":"Small business and selling","sub":"Listings, customer replies, pricing ideas and plans.","part":"Practice","steps":[{"k":"learn","id":"m13l1","t":"Know your customer, tell the AI","body":"\u003cp>Business prompts work when the AI knows \u003cb>who buys and why\u003c/b>. Before asking for a post, listing or offer, give it:\u003c/p>\u003cul>\u003cli>\u003cb>Customer:\u003c/b> age, city, budget, what problem they have.\u003c/li>\u003cli>\u003cb>Product:\u003c/b> what it is, price, what makes it different.\u003c/li>\u003cli>\u003cb>Channel:\u003c/b> WhatsApp, Instagram, a marketplace listing, a shop board.\u003c/li>\u003cli>\u003cb>Goal:\u003c/b> more enquiries, repeat orders, festival sales.\u003c/li>\u003c/ul>\u003cp>Add an honesty limit: \u003ci>\"Don't make claims I can't prove, like 'best in India' or '100% guaranteed'.\"\u003c/i>\u003c/p>","rem":["Customer, product, channel, goal.","Price and what's different about you.","No claims you can't prove."],"q":{"q":"Why add \"no claims I can't prove\"?","o":["AI may write 'best in India' style claims that can mislead buyers","It's shorter","It's a rule of grammar"],"a":0,"why":"Misleading claims can break consumer rules and lose trust."}},{"k":"do","id":"m13t1","t":"Marketplace product listing","who":"You sell cotton kurtis made in Jaipur on an online marketplace at ₹799. They come in sizes S to XXL, are machine washable and have pockets. Your buyers are working women who want comfortable office wear.","weak":"kurti description","facts":[["cotton"],["jaipur"],["799"],["xxl"],["pockets"],["office"]],"tip":"Give product facts, price, buyer and the listing format.","model":"You are an e-commerce copywriter. Write a marketplace listing for my cotton kurtis made in Jaipur, priced at ₹799, in sizes S to XXL, machine washable, with pockets. My buyers are working women who want comfortable office wear. Give a title under 80 characters, 5 bullet points and a 50-word description. Don't make claims I can't prove."},{"k":"do","id":"m13t2","t":"WhatsApp broadcast for a festival","who":"Your sweet shop in Ahmedabad is taking Diwali pre-orders for kaju katli (₹1,100/kg) and mixed boxes (₹650). Orders close on 28 October and free delivery is within 5 km. You'll send it to 300 customers on WhatsApp.","weak":"diwali offer message","facts":[["ahmedabad"],["kaju katli"],["1100"],["650"],["28 october"],["5 km"]],"tip":"Give products, prices, last date, delivery and the channel.","model":"You are a marketing writer for local shops. Write a WhatsApp broadcast for my sweet shop in Ahmedabad taking Diwali pre-orders: kaju katli at ₹1,100/kg and mixed boxes at ₹650. Orders close on 28 October, with free delivery within 5 km. Keep it under 70 words with 3 emojis at most, warm and festive, and end with how to order. No fake urgency."},{"k":"do","id":"m13t3","t":"Reply to a bad review","locked":true},{"k":"do","id":"m13t4","t":"Price a new service","locked":true},{"k":"learn","id":"m13l2","t":"Plans and numbers","locked":true},{"k":"do","id":"m13t5","t":"Break-even for a food stall","locked":true},{"k":"do","id":"m13t6","t":"First-month launch plan","locked":true},{"k":"do","id":"m13t7","t":"Customer FAQ for your website","locked":true},{"k":"do","id":"m13t8","t":"Supplier negotiation message","locked":true},{"k":"learn","id":"m13l3","t":"Brand voice in one paragraph","locked":true},{"k":"do","id":"m13t9","t":"Write your brand voice","locked":true},{"k":"do","id":"m13t10","t":"Thank-you note with a review ask","locked":true},{"k":"do","id":"m13t11","t":"Plan stock for a sale season","locked":true},{"k":"do","id":"m13t12","t":"Write a simple invoice template","locked":true}]},{"id":"m14","t":"Money and everyday life","sub":"Budgets, travel, cooking, forms and everyday questions.","part":"Practice","steps":[{"k":"learn","id":"m14l1","t":"Everyday help, with care","body":"\u003cp>AI is great for everyday planning: meal plans, trip plans, budgets, letters to the society or the electricity board. The same rules apply: \u003cb>give your real situation\u003c/b> and \u003cb>say the format\u003c/b>.\u003c/p>\u003cp>Extra care for three areas:\u003c/p>\u003cul>\u003cli>\u003cb>Money:\u003c/b> it can explain options but isn't your adviser. Don't act on a single answer for investments or loans.\u003c/li>\u003cli>\u003cb>Health:\u003c/b> use it to understand terms and prepare questions for your doctor, not to diagnose.\u003c/li>\u003cli>\u003cb>Legal:\u003c/b> use it to understand a document, then confirm with a lawyer for anything serious.\u003c/li>\u003c/ul>","rem":["Real situation plus format, as always.","Money, health and legal: understand, then confirm with a professional.","Never share OTPs, card numbers or Aadhaar."],"q":{"q":"Best use of AI for a medical report you don't understand?","o":["Ask it to diagnose you","Ask it to explain the terms and list questions for your doctor","Ignore the doctor"],"a":1,"why":"It helps you understand and have a better talk with your doctor."}},{"k":"do","id":"m14t1","t":"Monthly family budget","who":"Your family's take-home income is ₹62,000 a month. Rent is ₹15,000 and the home loan EMI is ₹11,000. You want to save at least ₹8,000 a month and cut food delivery spending, which is around ₹5,000.","weak":"budget plan","facts":[["62000","62k"],["15000","15k"],["11000","11k"],["8000","8k"],["5000","5k"]],"tip":"Give income, fixed costs, savings goal and the problem spend.","model":"You are a practical family budget coach. Our take-home income is ₹62,000 a month, rent is ₹15,000 and the home loan EMI is ₹11,000. We want to save at least ₹8,000 a month and cut food delivery, which is about ₹5,000 now. Make a monthly budget table with category, amount and tip, and give 4 bullet ideas to cut delivery spend. Keep it realistic, not strict."},{"k":"do","id":"m14t2","t":"Weekly meal plan on a budget","who":"You cook for 3 people in Kolkata, mostly fish and rice, with a weekly grocery budget of ₹2,500. One person is diabetic. You want a 7-day dinner plan and a shopping list.","weak":"meal plan","facts":[["3 people","three people","family of 3"],["kolkata"],["fish"],["2500"],["diabetic","diabetes"],["shopping list"]],"tip":"Give the people, food habits, budget and health needs.","model":"You are a home cooking planner. Make a 7-day dinner plan for 3 people in Kolkata who mostly eat fish and rice, within a weekly grocery budget of ₹2,500. One person is diabetic, so keep sugar low and portions of rice controlled. Show the plan as a table, then a shopping list grouped by vegetables, fish and pantry. Remind me to check diet changes with a doctor."},{"k":"do","id":"m14t3","t":"Plan a family trip","locked":true},{"k":"do","id":"m14t4","t":"Complaint to the electricity board","locked":true},{"k":"do","id":"m14t5","t":"Understand a medical report","locked":true},{"k":"learn","id":"m14l2","t":"Compare options fairly","locked":true},{"k":"do","id":"m14t6","t":"Compare savings options","locked":true},{"k":"do","id":"m14t7","t":"Choose a mobile plan","locked":true},{"k":"do","id":"m14t8","t":"Fill a form, step by step","locked":true},{"k":"do","id":"m14t9","t":"Plan a small party","locked":true},{"k":"do","id":"m14t10","t":"Write to a school teacher","locked":true}]},{"id":"m15","t":"Social media and content","sub":"Posts, reels, captions and content calendars.","part":"Practice","steps":[{"k":"learn","id":"m15l1","t":"Hook, value, action","body":"\u003cp>Good social posts have three parts, and your prompt should ask for all three:\u003c/p>\u003cul>\u003cli>\u003cb>Hook:\u003c/b> the first line that stops the scroll.\u003c/li>\u003cli>\u003cb>Value:\u003c/b> a tip, a story or a clear offer.\u003c/li>\u003cli>\u003cb>Action:\u003c/b> what you want people to do: comment, save, visit, DM.\u003c/li>\u003c/ul>\u003cp>Also say the \u003cb>platform\u003c/b> (Instagram, LinkedIn, YouTube Shorts), the \u003cb>audience\u003c/b> and the \u003cb>length\u003c/b>. Ask for \u003cb>3 hook options\u003c/b> and pick the best.\u003c/p>","rem":["Hook, value, action.","Platform, audience, length.","Ask for 3 hooks and choose."],"q":{"q":"What's the 'hook'?","o":["The hashtags","The first line that stops people scrolling","The link"],"a":1,"why":"If the first line doesn't grab attention, nobody reads the rest."}},{"k":"do","id":"m15t1","t":"Reel script","who":"You're a fitness coach in Pune making a 30-second Instagram reel for office workers: \"3 stretches you can do at your desk\". You want the script with on-screen text, what to show, and a closing line asking people to save it.","weak":"reel script fitness","facts":[["pune"],["30-second","30 second","30 sec"],["office"],["3 stretches","three stretches"],["save"]],"tip":"Give the topic, length, audience and the structure you want.","model":"You are a short-video scriptwriter. Write a 30-second Instagram reel script for me, a fitness coach in Pune, for office workers: \"3 stretches you can do at your desk\". Show it as a table with time, what to show, voice-over and on-screen text. Start with a strong hook, end by asking people to save it, and keep the words simple and safe."},{"k":"do","id":"m15t2","t":"LinkedIn post from an experience","who":"You just finished your first year as a CA article assistant. The biggest lesson was that asking questions early saves hours of rework. You want a LinkedIn post with a short story, 3 lessons and a question for readers.","weak":"linkedin post","facts":[["first year","1 year","one year"],["article"],["questions"],["rework"],["3 lessons","three lessons"]],"tip":"Give the experience, the lesson and the structure.","model":"You are a LinkedIn writing coach. Write a post about finishing my first year as a CA article assistant. The biggest lesson was that asking questions early saves hours of rework. Start with a 1-line hook, tell a short story, share 3 lessons as bullet points and end with a question for readers. Keep it under 180 words, humble and honest, with 3 hashtags."},{"k":"do","id":"m15t3","t":"Content calendar","locked":true},{"k":"do","id":"m15t4","t":"YouTube video titles","locked":true},{"k":"learn","id":"m15l2","t":"Repurpose one idea many ways","locked":true},{"k":"do","id":"m15t5","t":"Turn a post into a carousel","locked":true},{"k":"do","id":"m15t6","t":"Captions in two languages","locked":true},{"k":"do","id":"m15t7","t":"Reply to comments","locked":true},{"k":"do","id":"m15t8","t":"Write a newsletter intro","locked":true},{"k":"do","id":"m15t9","t":"Video ideas from FAQs","locked":true}]},{"id":"m17","t":"Creative writing and ideas","sub":"Stories, poems, speeches and brainstorming that sound like you.","part":"Practice","steps":[{"k":"learn","id":"m17l1","t":"Give creative prompts a brief","body":"\u003cp>Creative prompts fail when they are too open. \"Write a story\" gets a generic story. Give the AI a \u003cb>brief\u003c/b>, like a client would:\u003c/p>\u003cul>\u003cli>\u003cb>Who it's for:\u003c/b> a 6-year-old, your wife, wedding guests.\u003c/li>\u003cli>\u003cb>The feeling:\u003c/b> funny, warm, inspiring, spooky but not scary.\u003c/li>\u003cli>\u003cb>Real details:\u003c/b> names, places, inside jokes, a moral.\u003c/li>\u003cli>\u003cb>Length and shape:\u003c/b> 300 words, 4 lines that rhyme, a 2-minute speech.\u003c/li>\u003c/ul>\u003cp>Real details are what make it sound like you and not like a greeting card.\u003c/p>","rem":["Say who it's for and the feeling you want.","Add real names, places and details.","Give the length and shape."],"q":{"q":"Which detail makes a toast sound personal?","o":["Make it nice","The couple met in a Pune college library in 2015","Use good words"],"a":1,"why":"Real details are what make writing sound like you."}},{"k":"do","id":"m17t1","t":"A bedtime story with a lesson","who":"Your daughter Anika is 6 and loves elephants. She has started grabbing toys from her younger brother. You want a 300-word bedtime story about sharing, with an elephant as the hero, that you can read aloud in 3 minutes.","weak":"write a kids story","facts":[["anika"],["6"],["elephant"],["sharing","share"],["300"]],"tip":"Give the age, what she loves, the lesson and the length.","model":"You are a children's storyteller. Write a bedtime story of about 300 words for my 6-year-old daughter Anika, who loves elephants. The hero is a little elephant who learns about sharing with a younger friend. Use simple words and short sentences so I can read it aloud in 3 minutes, end with a gentle one-line lesson, and avoid anything scary."},{"k":"do","id":"m17t2","t":"An anniversary poem in your style","ex":true,"who":"Your 10th wedding anniversary is on Saturday. Your wife Meera loves filter coffee and rainy evenings in Kochi, where you met. You want a short rhyming poem, sweet and a little funny, like the line you once wrote her: \"You steal my blanket, and my heart\".","weak":"anniversary poem","facts":[["10th","10"],["meera"],["coffee"],["kochi"]],"tip":"Add the real details and show a line in the style you like.","model":"You are a poet who writes warm, playful love poems. Write a rhyming poem for my wife Meera for our 10th wedding anniversary. We met in Kochi, and she loves filter coffee and rainy evenings, so mention both. Keep it to 3 short verses of 4 lines, sweet and a little funny, in the same style as this line I once wrote her: \"You steal my blanket, and my heart\". Avoid big, dramatic words."},{"k":"do","id":"m17t3","t":"A wedding toast","locked":true},{"k":"learn","id":"m17l2","t":"Brainstorm wide, then pick","locked":true},{"k":"do","id":"m17t4","t":"Name a new shop","locked":true},{"k":"do","id":"m17t5","t":"Ideas for a farewell","locked":true}]},{"id":"m18","t":"Language, research and new skills","sub":"Translate, simplify, look into a decision and learn something new.","part":"Practice","steps":[{"k":"learn","id":"m18l1","t":"Translate the meaning, not the words","body":"\u003cp>Word-for-word translation sounds stiff. Tell the AI \u003cb>who will read it\u003c/b> and \u003cb>how it should sound\u003c/b>:\u003c/p>\u003cp>\u003ci>\"Translate this into simple spoken Hindi for my parents, not formal government Hindi.\"\u003c/i>\u003c/p>\u003cp>To simplify difficult text, like a rental agreement or a bank letter, paste it and ask for plain words plus \u003cb>what it means for you\u003c/b>. For anything legal or medical, ask it to flag what you should confirm with a professional.\u003c/p>","rem":["Say who will read it and the tone.","Paste the exact text.","Ask what it means for you, and what to double-check."],"q":{"q":"Which translation prompt is better?","o":["Translate to Tamil","Translate into everyday spoken Tamil for my grandmother, short sentences","Tamil please"],"a":1,"why":"It says who reads it and how it should sound."}},{"k":"do","id":"m18t1","t":"Translate for your parents","opt":["role"],"who":"Your company sent a message in English: \"The office will remain closed on 15 August. Salary for August will be credited on 1 September.\" You want to forward it to your parents in simple spoken Marathi, not formal Marathi.","weak":"translate to marathi","facts":[["15 august"],["1 september"],["marathi"],["salary"]],"tip":"Paste the text and say who will read it and how it should sound.","model":"Translate this message into simple spoken Marathi for my parents, not formal or bookish Marathi: \"The office will remain closed on 15 August. Salary for August will be credited on 1 September.\" Keep the dates and the salary point clear, use short sentences, and give it in Marathi script followed by the same lines in English letters."},{"k":"do","id":"m18t2","t":"Make a rental clause plain","who":"Your rental agreement in Hyderabad says: \"The Licensee shall give 2 months' notice prior to vacating, failing which the security deposit of ₹60,000 shall be forfeited to the extent of 2 months' rent.\" Rent is ₹20,000. You want to know what this means for you.","weak":"explain this clause","facts":[["2 months"],["60000"],["20000"],["notice"]],"tip":"Paste the exact clause, add your numbers and ask what it means for you.","model":"You are a property lawyer who explains things in plain English. Here is a clause from my rental agreement in Hyderabad: \"The Licensee shall give 2 months' notice prior to vacating, failing which the security deposit of ₹60,000 shall be forfeited to the extent of 2 months' rent.\" My rent is ₹20,000. Explain it in simple words, show with numbers what I'd lose if I leave without notice, and list 2 points I should confirm with a lawyer. Keep it under 150 words."},{"k":"do","id":"m18t3","t":"Look into a decision","locked":true},{"k":"learn","id":"m18l2","t":"Learn a skill with a plan","locked":true},{"k":"do","id":"m18t4","t":"A 30-day skill plan","locked":true},{"k":"do","id":"m18t5","t":"Prepare for a doctor visit","locked":true}]},{"id":"m19","t":"Coding, planning and work roles","sub":"Simple code, daily planning, teaching, customer support and fitness.","part":"Practice","steps":[{"k":"learn","id":"m19l1","t":"Prompts for code, even if you're not a coder","body":"\u003cp>You don't need to be a programmer to get useful code. Tell the AI:\u003c/p>\u003cul>\u003cli>\u003cb>The tool:\u003c/b> Python, Excel VBA, Google Sheets, Windows.\u003c/li>\u003cli>\u003cb>What goes in and what should come out:\u003c/b> \"a folder of 200 photos named IMG_001\" to \"Goa_2025_001\".\u003c/li>\u003cli>\u003cb>Your level:\u003c/b> \"I've never run code, explain how to run it step by step.\"\u003c/li>\u003cli>\u003cb>Safety:\u003c/b> \"Don't delete anything; make a copy first.\"\u003c/li>\u003c/ul>\u003cp>For an error, paste the \u003cb>exact error message\u003c/b> and the code, not \"it's not working\".\u003c/p>","rem":["Name the tool and your level.","Describe the input and the output you want.","Paste exact errors, and ask for safe steps."],"q":{"q":"What should you paste when code fails?","o":["Just \"it's broken\"","The exact error message and the code","Nothing; ask for new code"],"a":1,"why":"The exact error tells the AI what went wrong."}},{"k":"do","id":"m19t1","t":"A small script to rename files","who":"You have 200 photos in a folder named IMG_001.jpg to IMG_200.jpg from your Goa trip. You want them renamed Goa_2025_001.jpg and so on. You have Python on your Windows laptop but have never run a script.","weak":"code to rename files","facts":[["200"],["img_001"],["goa_2025_001","goa_2025"],["python"],["windows"]],"tip":"Give the tool, the before and after names, and your level.","model":"You are a patient Python teacher. Write a simple Python script for my Windows laptop that renames 200 photos in one folder from IMG_001.jpg to IMG_200.jpg into Goa_2025_001.jpg and so on. I've never run a script, so explain step by step how to save and run it. Make it copy the files into a new folder instead of renaming the originals, so nothing is lost. Add a short comment on each line."},{"k":"do","id":"m19t2","t":"Explain an error message","opt":["role","limits"],"who":"Your Python script stops with: \"FileNotFoundError: [Errno 2] No such file or directory: 'sales.csv'\". The file sales.csv is on your Desktop and the script is in your Documents folder.","weak":"python error help","facts":[["filenotfounderror"],["sales.csv"],["desktop"],["documents"]],"tip":"Paste the exact error and say where the files are.","model":"My Python script stops with this error: \"FileNotFoundError: [Errno 2] No such file or directory: 'sales.csv'\". The file sales.csv is on my Desktop and the script is in my Documents folder. Explain why this happens in 2 lines, then give 2 ways to fix it as numbered steps, with the exact line of code to change."},{"k":"do","id":"m19t3","t":"Plan a busy week","locked":true},{"k":"learn","id":"m19l2","t":"Prompts for people-facing roles","locked":true},{"k":"do","id":"m19t4","t":"A teacher's lesson plan","locked":true},{"k":"do","id":"m19t5","t":"Reply to an angry customer","locked":true},{"k":"do","id":"m19t6","t":"A safe beginner fitness plan","locked":true}]},{"id":"m29","t":"Files, photos and screenshots","sub":"Prompt well when you attach a PDF, a sheet, a photo or a screenshot.","part":"Practice","steps":[{"k":"learn","id":"m29l1","t":"Say what the file is and what to do with it","body":"\u003cp>Most AI chat tools let you attach a PDF, an Excel or CSV file, a photo or a screenshot. Attaching a file is not a prompt. \"See attached\" makes the AI guess what you want.\u003c/p>\u003cp>A good file prompt says three things:\u003c/p>\u003cul>\u003cli>\u003cb>What the file is:\u003c/b> \"a photo of our restaurant bill\", \"a 40-page insurance policy\".\u003c/li>\u003cli>\u003cb>What to do with it:\u003c/b> split, find, summarise, check, turn into a table.\u003c/li>\u003cli>\u003cb>How to answer:\u003c/b> the format, and to quote the page or line it used.\u003c/li>\u003c/ul>\u003cp>Check your tool first: not every tool or plan accepts files, and some read photos better than others.\u003c/p>","rem":["Name the file and what's in it.","Say exactly what to do with it.","Ask it to quote the page or line it used."],"q":{"q":"Which prompt works best with an attached policy PDF?","o":["See attached","Using only the attached 40-page policy, tell me if flood damage is covered and quote the clause with its page number","Read this"],"a":1,"why":"It names the file, the question and how to show the source."}},{"k":"do","id":"m29t1","t":"Split a restaurant bill from a photo","opt":["role"],"who":"You took a photo of your restaurant bill. Six friends ate, the total is ₹4,860 including GST, and you added a ₹500 tip in cash. Two friends didn't have drinks, which cost ₹1,200 in total. You want a fair split.","weak":"split this bill","facts":[["photo"],["4860"],["500"],["1200"],["drinks"]],"tip":"Say what the photo shows, the extra facts that aren't on the bill, and how to split.","model":"I've attached a photo of our restaurant bill. 6 friends ate, the total is ₹4,860 including GST, and we added a ₹500 tip in cash. 2 friends didn't have drinks, which cost ₹1,200 in total, so only the other 4 should share that. First list the items you read from the photo, then calculate a fair split step by step and show it in a table with name, share and amount. Round to the nearest rupee."},{"k":"do","id":"m29t2","t":"Find one answer in a long PDF","who":"You uploaded the 40-page insurance policy PDF for your scooter. After heavy rain in Chennai, water entered the engine. You want to know if flood damage is covered, what you must do to claim, and you want the exact clause and page number.","weak":"is flood covered","facts":[["40-page","40 page"],["flood"],["chennai"],["claim"],["page number"]],"tip":"Name the file, ask one clear question, and ask it to quote the clause and page.","model":"You are an insurance claims advisor. Using only the attached 40-page insurance policy for my scooter, tell me whether flood damage is covered. Water entered the engine after heavy rain in Chennai. Quote the exact clause with its page number, then list the steps to make a claim in numbered points. If the policy doesn't say, write \"Not mentioned\" instead of guessing. Keep it in simple English."},{"k":"learn   function go(id) {

    if (b.hasAttribute("data-mod")) { V.mod = b.getAttribute("data-mod"); return setTab("mod"); }
    if (b.hasAttribute("data-go")) return go(b.getAttribute("data-go"));
    if (b.hasAttribute("data-cat")) { V.cat = b.getAttribute("data-cat"); return render(); }
    if (b.hasAttribute("data-copy")) { var p = LIB.filter(function (x) { return x.id === b.getAttribute("data-copy"); })[0]; return copy(p.p); }
    if (b.hasAttribute("data-tobuild")) { var lp = LIB.filter(function (x) { return x.id === b.getAttribute("data-tobuild"); })[0]; V.b = { task: lp.p }; kset(ROOT + "-builder", JSON.stringify(V.b)); return setTab("build"); }
    if (b.hasAttribute("data-theme")) { var th = b.getAttribute("data-theme"); kset(ROOT + "-theme", th); applyTheme(th); return toast("Theme updated"); }
    if (b.hasAttribute("data-user")) { var pu = REG.users.filter(function (x) { return x.id === b.getAttribute("data-user"); })[0]; if (!pu.pin) { loadUser(pu); V.tab = "home"; return render(); } V.login = { pick: pu.id, err: "", adding: false }; return render(); }
