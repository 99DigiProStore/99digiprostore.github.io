<style>/* System fonts only, so the file works offline and contacts no outside server. */
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --fg:#2B1A1A; --muted:#6E5A55; --line:#EADBCB; --soft:#F6ECDF;

  --good:#1F7A4A; --good-soft:#DFF2E6; --bad:#B42318; --bad-soft:#FBE4E1;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1214; --card:#24191C; --fg:#F3E9E4; --muted:#BCA9A2; --line:#3D2C30; --soft:#2E2024;
  --ink:#F08AA4; --ink-2:#F7B3C4; --ink-soft:#43222C; --gold:#E9B44C; --gold-soft:#3A2E14;
  --good:#5CCB8A; --good-soft:#163424; --bad:#F2867D; --bad-soft:#3C1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1214; --card:#24191C; --fg:#F3E9E4; --muted:#BCA9A2; --line:#3D2C30; --soft:#2E2024;
  --ink:#F08AA4; --ink-2:#F7B3C4; --ink-soft:#43222C; --gold:#E9B44C; --gold-soft:#3A2E14;
  --good:#5CCB8A; --good-soft:#163424; --bad:#F2867D; --bad-soft:#3C1E1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0 0 .4em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.86rem}

header.top{background:var(--ink);color:#fff;padding:14px 16px 0}
:root[data-theme="dark"] header.top{background:#3A1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#3A1520}}
.top-row{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;font-weight:700;flex:1;min-width:200px}

.top-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.top-btn:hover{background:rgba(255,255,255,.24)}
nav.tabs{max-width:1100px;margin:10px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#fff;opacity:.8;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr}.grid.fgrid{grid-template-columns:1fr}.grid>*{min-width:0}.stat .val{font-size:1.3rem}.stat{padding:12px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .lab{font-size:.82rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:.85rem;color:var(--muted)}
.stat.hl{background:var(--ink-soft);border-color:transparent}
.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bar.over i{background:var(--bad)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:160px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--ink-2)}
:root[data-theme="dark"] .btn{color:#1A1214}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1A1214}}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink-soft)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 6px;font-weight:600;border-radius:6px}
.linkbtn:hover{background:var(--ink-soft)}
.linkbtn.del{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=search],select,textarea{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:600;font-size:.88rem;margin-bottom:10px}
label.f span{display:block;margin-bottom:4px}

.chk{display:inline-flex;align-items:center;gap:6px;margin:0 12px 6px 0;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--soft)}
td.act{white-space:nowrap;text-align:right}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.yes{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.maybe{background:var(--gold-soft);color:var(--gold)}
.pill.b{background:var(--ink-soft);color:var(--ink)}
.namebtn{background:none;border:0;padding:0;font-weight:700;text-align:left;cursor:pointer;color:inherit}
.namebtn:hover{color:var(--ink);text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.due{color:var(--bad);font-weight:600}

.notice{background:var(--gold-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice .grow{flex:1;min-width:200px}
.hero{background:linear-gradient(135deg,var(--ink-soft),var(--gold-soft));border-radius:var(--r);padding:20px;margin-bottom:16px}
.hero .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;color:var(--ink)}

.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 14px;cursor:pointer;color:var(--ink);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.tasks h3{margin-top:18px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}
.task.done span.t{text-decoration:line-through;color:var(--muted)}
.task span.t{flex:1}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(30,10,15,.5)}
dialog form{padding:20px}
dialog .dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding-top:8px}
.lookup{background:var(--soft);border-radius:9px;padding:8px 10px;margin:-4px 0 12px;font-size:.86rem}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
footer.foot{max-width:1100px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.82rem}

@media (max-width:640px){
  .hide-sm{display:none}
  th,td{padding:8px 7px}
  .hero .big{font-size:1.8rem}
  td.act,th.act{display:none}
  .brand{font-size:1.05rem}
  .brand small{font-size:.72rem}
  .namebtn{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
}
@media print{
  header.top,nav.tabs,.toolbar,.notice,.no-print,td.act,th.act,footer.foot,#toast{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  main{padding:0;max-width:none}
  .card,.tbl-wrap,.stat{border-color:#999;break-inside:avoid}
  .print-title{display:block!important}
}
.print-title{display:none}

<script>/* Indian Wedding Planner and Shagun Book — 99DigiProStore. Everything stays on this device. */
(function(){
'use strict';
var DEMO=!!window.WPS_DEMO,BUY=window.WPS_BUY||'';
var KEY=DEMO?'wps-demo':'wps-v1';
var VERSION=1;

var DEFAULT_FUNCS=['Roka / Engagement','Haldi','Mehendi','Sangeet','Wedding','Reception'];
var CATS=['Venue','Catering','Decoration & flowers','Photo & video','Clothes','Jewellery','Makeup & mehendi artist','Music, DJ & band','Invitation cards','Gifts & return gifts','Travel & stay','Pandit & rituals','Transport & cars','Other'];
var RELS=['Family','Relatives','Friends','Neighbours','Office','Other'];
var TASKS=[
 ['6 months or more before',['Fix the wedding date and muhurat','Agree on a total budget with both families','Make a first guest list from both sides','Shortlist and book the venue','Book the caterer and fix the menu tasting date','Book photographer and videographer']],
 ['3 to 4 months before',['Book decorator, DJ or band','Book makeup and mehendi artist','Book pandit or priest and list ritual items','Plan rooms and travel for outstation guests','Start shopping for clothes and jewellery','Design and order invitation cards or e-invites']],
 ['1 to 2 months before',['Send invitations (cards and WhatsApp)','Confirm the number of plates with the caterer','Plan return gifts','Book cars for baraat, bride and guests','Fittings for all outfits','Make the function-wise schedule and share it with family']],
 ['2 weeks before',['Call guests who have not replied (RSVP)','Pay pending advances as agreed','Pack ritual items for each function','Give final headcount to caterer and venue','Plan who receives guests and who handles shagun']],
 ['Wedding week',['Keep an envelope box and a person to note shagun','Keep cash ready for tips and last-minute payments','Charge phones and power banks; share vendor numbers with 2 people','Confirm arrival times with every vendor','Save a backup of this planner and send it to a family member']],
 ['After the wedding',['Enter all shagun and gifts in the Shagun Book','Pay all final balances and collect receipts','Send thank-you messages','Collect photos and videos from the photographer','Save a final backup file']]
];

/* ---------- storage ---------- */
var storageOK=true;
function load(){
  if(DEMO)return fresh();
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);return fix(d);}}catch(e){storageOK=false;}
  return fresh();
}
function save(){
  S.meta.changed=Date.now();
  if(DEMO)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fresh(){
  var d={v:VERSION,meta:{created:Date.now(),changed:0,backup:0},
    wedding:{names:'',date:'',city:'',budget:0},
    functions:DEFAULT_FUNCS.map(function(n){return {id:uid(),name:n,date:'',time:'',venue:'',notes:''};}),
    budget:[],guests:[],gifts:[],tasks:[]};
  TASKS.forEach(function(g){g[1].forEach(function(t){d.tasks.push({id:uid(),when:g[0],text:t,done:false});});});
  return d;
}
function arr(x){return Array.isArray(x)?x:[];}
function fix(d){
  var f=fresh();
  if(!d||typeof d!=='object')return f;
  d.v=VERSION;
  d.meta=Object.assign({created:Date.now(),changed:0,backup:0},d.meta||{});
  d.wedding=Object.assign(f.wedding,d.wedding||{});
  d.functions=arr(d.functions);d.budget=arr(d.budget);d.guests=arr(d.guests);d.gifts=arr(d.gifts);
  d.tasks=Array.isArray(d.tasks)?d.tasks:f.tasks;
  d.guests.forEach(function(g){g.funcs=arr(g.funcs);});
  return d;
}
var S=load();

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[,₹\s]/g,''));return isFinite(n)?n:0;}
var nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
function inr(n){n=Math.round(num(n));return (n<0?'−':'')+'₹'+nf.format(Math.abs(n));}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function pdate(s){if(!s)return null;var p=s.split('-');if(p.length!==3)return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?null:d;}
function fdate(s){var d=pdate(s);if(!d)return '';return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function daysTo(s){var d=pdate(s);if(!d)return null;return Math.round((d-today())/864e5);}
function funcName(id){var f=S.functions.find(function(x){return x.id===id;});return f?f.name:'';}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},1800);}
function cost(b){return num(b.actual)>0?num(b.actual):num(b.est);}
function bal(b){return Math.max(0,cost(b)-num(b.paid));}
function sum(a,f){return a.reduce(function(s,x){return s+f(x);},0);}
var STOP=['ji','family','uncle','aunty','auntie','and','the','mr','mrs','sir','madam','bhai','didi','wedding','son','daughter'];
function nameMatch(name,q){var n=norm(name);q=norm(q);if(!q)return false;if(n.indexOf(q)>=0)return true;
  var w=q.replace(/[^a-z0-9\u0900-\u0fff ]/g,' ').split(' ').filter(function(x){return x.length>=3&&STOP.indexOf(x)<0;});
  return w.length>0&&w.some(function(x){return (' '+n.replace(/[^a-z0-9\u0900-\u0fff ]/g,' ')+' ').indexOf(' '+x)>=0;});}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}

/* ---------- tabs ---------- */
var TABS=[['home','Home'],['functions','Functions'],['budget','Budget & payments'],['guests','Guest list'],['shagun','Shagun book'],['checklist','Checklist'],['backup','Backup & help']];
var cur='home';
try{var lt=localStorage.getItem(KEY+'-tab');if(lt&&TABS.some(function(t){return t[0]===lt;}))cur=lt;}catch(e){}
function nav(){
  $('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===cur)+'">'+t[1]+'</button>';}).join('');
}
function go(t){cur=t;try{localStorage.setItem(KEY+'-tab',t);}catch(e){}render();window.scrollTo(0,0);}

function render(){
  nav();
  var v=VIEWS[cur]();
  $('#main').innerHTML=banner()+v;
  var a=$('#tabs [aria-selected="true"]');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'nearest'});
}
function banner(){
  if(DEMO)return '<div class="notice no-print"><div class="grow"><b>Demo with an example wedding.</b> Try anything. Changes are not saved, and backup, print and download are turned off.</div>'+(BUY?'<a class="btn sm" href="'+esc(BUY)+'" target="_top">Get the full planner for ₹99</a>':'')+'</div>';
  if(!storageOK)return '<div class="notice"><div class="grow"><b>This browser is not saving your work.</b> Before you close it, tap <b>Save backup file</b>. Next time, open the planner and use <b>Open backup file</b>.</div><button class="btn sm" data-act="backup">Save backup file</button></div>';
  var has=S.budget.length+S.guests.length+S.gifts.length;
  if(has&&S.meta.changed>S.meta.backup&&(Date.now()-S.meta.backup)>3*864e5)
    return '<div class="notice no-print"><div class="grow">You have changes that are not in a backup file yet. Save one now and send it to a family member, so nothing is lost if this phone or browser is cleared.</div><button class="btn sm" data-act="backup">Save backup file</button></div>';
  return '';
}

/* ---------- views ---------- */
var VIEWS={};
var guestFilter={q:'',side:'',func:'',rsvp:''};
var giftDir='in',giftQ='';

VIEWS.home=function(){
  var w=S.wedding,dt=daysTo(w.date);
  var planned=sum(S.budget,cost),paid=sum(S.budget,function(b){return num(b.paid);}),due=sum(S.budget,bal);
  var B=num(w.budget);
  var people=sum(S.guests,function(g){return Math.max(1,num(g.count));});
  var yes=sum(S.guests.filter(function(g){return g.rsvp==='yes';}),function(g){return Math.max(1,num(g.count));});
  var gin=S.gifts.filter(function(g){return g.dir==='in';});
  var thanks=gin.filter(function(g){return !g.thanked;}).length;
  var td=S.tasks.filter(function(t){return t.done;}).length;
  var h='';
  if(!w.names&&!S.budget.length&&!S.guests.length)
    h+='<div class="card"><h3>Welcome! Start in 3 steps</h3><ol><li>Tap <b>Edit wedding details</b> and add the names, date and total budget.</li><li>Add your guests in <b>Guest list</b>. You can paste many names at once.</li><li>Add each booking and advance in <b>Budget & payments</b>.</li></ol><p class="muted small">Want to look around first? <button class="linkbtn" data-act="sample">Load an example wedding</button> (you can clear it later in Backup & help).</p></div>';
  h+='<div class="hero"><div class="toolbar" style="margin:0"><div class="grow"><div class="muted small">'+(w.city?esc(w.city)+' · ':'')+(w.date?fdate(w.date):'Date not set')+'</div><div class="big">'+(w.names?esc(w.names):'Our Wedding')+'</div>'+
    (dt==null?'':dt>0?'<div><b>'+dt+'</b> day'+(dt===1?'':'s')+' to go</div>':dt===0?'<div><b>Today is the day!</b></div>':'<div>Married '+(-dt)+' day'+(dt===-1?'':'s')+' ago</div>')+
    '</div><button class="btn" data-act="editWedding">Edit wedding details</button></div></div>';
  var pct=B>0?Math.min(100,planned/B*100):0;
  h+='<div class="grid">'+
    stat('Total budget',B?inr(B):'Not set',B?(planned>B?'<span class="due">Over by '+inr(planned-B)+'</span>':inr(B-planned)+' not yet planned'):'Set it in wedding details','',B?'<div class="bar'+(planned>B?' over':'')+'"><i style="width:'+pct+'%"></i></div>':'')+
    stat('Planned spend',inr(planned),S.budget.length+' item'+(S.budget.length===1?'':'s'))+
    stat('Paid so far',inr(paid),'Advances and payments')+
    stat('Balance to pay',inr(due),'Still owed to vendors','hl')+
    stat('Guests',nf.format(people)+' people',S.guests.length+' invites · '+nf.format(yes)+' confirmed')+
    stat('Shagun received',inr(sum(gin,function(g){return num(g.amount);})),gin.length+' entries'+(thanks?' · '+thanks+' thank-you'+(thanks===1?'':'s')+' pending':''))+
    stat('Checklist',td+' of '+S.tasks.length,'tasks done','','<div class="bar"><i style="width:'+(S.tasks.length?td/S.tasks.length*100:0)+'%"></i></div>')+
  '</div>';
  // upcoming payments
  var up=S.budget.filter(function(b){return bal(b)>0&&b.due;}).sort(function(a,b){return a.due<b.due?-1:1;}).slice(0,6);
  h+='<div class="card" style="margin-top:16px"><h3>Next payments due</h3>';
  if(!up.length)h+='<p class="muted">No due dates yet. Add a "balance due date" to bookings in Budget & payments.</p>';

/* ---------- forms ---------- */
var dlg,dlgSubmit;
function openForm(title,fields,data,onSave,onDelete,extra){
  var h='<form method="dialog" id="frm"><h3>'+esc(title)+'</h3>';
  fields.forEach(function(f){
    if(f.row){h+='<div class="row2">'+f.row.map(function(x){return field(x,data);}).join('')+'</div>';}
    else h+=field(f,data);
  });
  h+=(extra||'')+'<div class="dlg-foot">'+(onDelete?'<button type="button" class="btn danger" id="dlgDel" style="margin-right:auto">Delete</button>':'')+'<button type="button" class="btn ghost" id="dlgCancel">Cancel</button><button type="submit" class="btn">Save</button></div></form>';
  dlg.innerHTML=h;
  dlgSubmit=function(){
    var out={};
    eachField(fields,function(f){
      if(f.type==='checks'){out[f.k]=[].slice.call(dlg.querySelectorAll('input[name="'+f.k+'"]:checked')).map(function(i){return i.value;});}
      else if(f.type==='check'){out[f.k]=$('#f_'+f.k,dlg).checked;}
      else{var el=$('#f_'+f.k,dlg);out[f.k]=el?el.value.trim():'';}
    });
    var err=onSave(out);
    if(err){toast(err);return false;}
    dlg.close();save();render();return true;
  };
  $('#dlgCancel',dlg).onclick=function(){dlg.close();};
  if(onDelete)$('#dlgDel',dlg).onclick=function(){
    var b=this;if(b.dataset.sure){onDelete();dlg.close();save();render();toast('Deleted');}else{b.dataset.sure='1';b.textContent='Tap again to delete';}
  };
  dlg.showModal();
  var first=dlg.querySelector('input,select,textarea');if(first&&!('ontouchstart' in window))first.focus();
}
function eachField(fields,cb){fields.forEach(function(f){if(f.row)f.row.forEach(cb);else cb(f);});}
function field(f,d){
  var v=d&&d[f.k]!=null?d[f.k]:(f.def!=null?f.def:'');
  var lab='<span>'+esc(f.label)+(f.hint?' <em>'+esc(f.hint)+'</em>':'')+'</span>';
  if(f.type==='select')return '<label class="f">'+lab+'<select id="f_'+f.k+'">'+f.opts.map(function(o){o=Array.isArray(o)?o:[o,o];return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></label>';
  if(f.type==='textarea')return '<label class="f">'+lab+'<textarea id="f_'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></label>';
  if(f.type==='checks')return '<div class="f" style="font-weight:600;font-size:.88rem;margin-bottom:10px"><span style="display:block;margin-bottom:4px">'+esc(f.label)+'</span>'+(f.opts.length?f.opts.map(function(o){return '<label class="chk"><input type="checkbox" name="'+f.k+'" value="'+esc(o[0])+'"'+((v||[]).indexOf(o[0])>=0?' checked':'')+'>'+esc(o[1])+'</label>';}).join(''):'<span class="muted">Add functions first.</span>')+'</div>';
  if(f.type==='check')return '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="f_'+f.k+'"'+(v?' checked':'')+'>'+esc(f.label)+'</label>';
  var t=f.type||'text',im=t==='money'?' inputmode="numeric"':'';if(t==='money')t='text';
  return '<label class="f">'+lab+'<input type="'+t+'" id="f_'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+im+(f.list?' list="'+f.list+'"':'')+(t==='number'?' min="0"':'')+'></label>';
}
function funcOpts(){return S.functions.map(function(f){return [f.id,f.name];});}
function moneyErr(o,keys){for(var i=0;i<keys.length;i++){var v=o[keys[i]];if(v!==''&&!isFinite(parseFloat(v.replace(/[,₹\s]/g,''))))return 'Please enter amounts as numbers, like 25000';}return '';}

}

function editGuest(id){

}
function editGift(id){
  var g=id&&S.gifts.find(function(x){return x.id===id;});
  var dir=g?g.dir:giftDir;
  openForm((g?'Edit ':'Add ')+(dir==='in'?'shagun received':'shagun given'),dir==='in'?FORMS.giftIn():FORMS.giftOut,g||{date:new Date().toISOString().slice(0,10)},function(o){
    if(!o.name)return 'Please enter a name';
    var e=moneyErr(o,['amount']);if(e)return e;cleanMoney(o,['amount']);
    if(g)Object.assign(g,o);else S.gifts.push(Object.assign({id:uid(),dir:dir},o));
  },g?function(){S.gifts=S.gifts.filter(function(x){return x!==g;});}:null,'<div id="lk"></div>');

  function lk(){
    var q=norm(inp.value),box=$('#lk',dlg);if(!box)return;
    if(q.length<3){box.innerHTML='';return;}
    var m=S.gifts.filter(function(x){return x!==g&&nameMatch(x.name,q);}).slice(0,4);

function addTask(){
  var groups=[];S.tasks.forEach(function(t){if(groups.indexOf(t.when)<0)groups.push(t.when);});
  TASKS.forEach(function(t){if(groups.indexOf(t[0])<0)groups.push(t[0]);});
  openForm('Add task',[{k:'text',label:'Task',ph:'e.g. Book mehendi artist for 20 people'},{k:'when',label:'When',type:'select',opts:groups}],{},function(o){if(!o.text)return 'Please write the task';S.tasks.push({id:uid(),when:o.when,text:o.text,done:false});});
}
function pasteGuests(){
  openForm('Paste many names',[{k:'list',label:'One guest or family per line',type:'textarea',ph:'Sharma family, 4\nRohit Verma\nNeha & Karan, 2',hint:'add a comma and a number for more people'},{row:[{k:'side',label:'Side',type:'select',opts:[['Bride','Bride side'],['Groom','Groom side'],['Common','Common']],def:guestFilter.side||'Bride'},{k:'group',label:'Group',type:'select',opts:[''].concat(RELS)}]},{k:'funcs',label:'Invite all of them to',type:'checks',opts:funcOpts()}],{funcs:S.functions.map(function(f){return f.id;})},function(o){
    var lines=o.list.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    if(!lines.length)return 'Paste at least one name';
    var n=0;
    lines.forEach(function(l){
      var m=l.match(/^(.*?)[,\-–:]\s*(\d{1,3})\s*(people|persons|log|members|pax)?$/i);
      var name=(m?m[1]:l).replace(/^[\d.)\s•*-]+(?=\D)/,'').trim(),cnt=m?m[2]:'1';
      if(!name)return;
      S.guests.push({id:uid(),name:name,count:String(Math.max(1,+cnt)),side:o.side,group:o.group,funcs:o.funcs.slice(),rsvp:'',invited:false,stay:false,phone:'',notes:''});n++;
    });
    toast(n+' guest'+(n===1?'':'s')+' added');
  });
}
function cater(){
  var opts=[['','All / general']].concat(funcOpts());
  var wed=S.functions.find(function(f){return /wedding|shaadi|vivah/i.test(f.name);});
  var def=wed?funcCount(wed.id):{yes:0,all:0};
  openForm('Catering calculator',[{k:'func',label:'Function',type:'select',opts:opts,def:wed?wed.id:''},{row:[{k:'plates',label:'Number of plates',type:'number',def:def.yes||def.all||''},{k:'rate',label:'Rate per plate (₹)',type:'money'}]},{row:[{k:'buffer',label:'Extra plates (%)',type:'number',def:10,hint:'for walk-ins'},{k:'tax',label:'GST or taxes (%)',type:'number',def:0,hint:'ask your caterer'}]}],{},function(o){
    var plates=Math.ceil(num(o.plates)*(1+num(o.buffer)/100)-1e-9),amt=plates*num(o.rate)*(1+num(o.tax)/100);
    if(!plates||!num(o.rate))return 'Enter plates and rate per plate';
    S.budget.push({id:uid(),cat:'Catering',func:o.func,item:plates+' plates × '+inr(o.rate)+(num(o.tax)?' + '+num(o.tax)+'% tax':''),vendor:'',phone:'',est:String(Math.round(amt)),actual:'',paid:'',due:'',notes:'From catering calculator: '+num(o.plates)+' plates + '+num(o.buffer)+'% extra'});
    toast('Added '+inr(amt)+' to Budget');
  },null,'<div id="cpre" class="lookup"></div>');
  function pre(){var p=Math.ceil(num($('#f_plates',dlg).value)*(1+num($('#f_buffer',dlg).value)/100)-1e-9),a=p*num($('#f_rate',dlg).value)*(1+num($('#f_tax',dlg).value)/100);$('#cpre',dlg).innerHTML='Plates to order: <b>'+nf.format(p)+'</b> · Estimated cost: <b>'+inr(a)+'</b>';}
  ['plates','rate','buffer','tax'].forEach(function(k){$('#f_'+k,dlg).addEventListener('input',pre);});pre();
}

/* ---------- backup / csv ---------- */
function download(name,text,type){
  var blob=new Blob([text],{type:type}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}
function slug(){return (S.wedding.names||'wedding').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,30)||'wedding';}
function demoOnly(){toast('Available in the full planner');}
function backup(){
  if(DEMO)return demoOnly();
  S.meta.backup=Date.now();save();
  var d=new Date().toISOString().slice(0,10);
  download('Wedding-Planner-Backup-'+slug()+'-'+d+'.json',JSON.stringify({app:'99DigiProStore Wedding Planner',saved:new Date().toISOString(),data:S}),'application/json');
  toast('Backup file saved to Downloads');render();
}
function restore(file){
  if(DEMO)return demoOnly();
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),d=j&&j.data?j.data:j;
      if(!d||!Array.isArray(d.guests)||!Array.isArray(d.budget))throw 0;
      S=fix(d);S.meta.backup=Date.now();save();render();toast('Backup opened');
    }catch(e){toast('That file is not a planner backup');}
  };
  r.readAsText(file);
}
function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\r\n');}
var CSV={
  csvBudget:function(){download('Budget-'+slug()+'.csv',csv([['Category','Item','Function','Vendor','Phone','Estimate','Final amount','Paid','Balance','Due date','Notes']].concat(S.budget.map(function(b){return [b.cat,b.item,funcName(b.func),b.vendor,b.phone,b.est,b.actual,b.paid,bal(b),b.due,b.notes];}))),'text/csv');},
  csvGuests:function(){download('Guests-'+slug()+'.csv',csv([['Name','People','Side','Group','Phone','Functions','Invite sent','Reply','Needs room','Notes']].concat(S.guests.map(function(g){return [g.name,g.count,g.side,g.group,g.phone,g.funcs.map(funcName).join('; '),g.invited?'Yes':'No',{yes:'Coming',no:'Not coming',maybe:'Maybe'}[g.rsvp]||'',g.stay?'Yes':'',g.notes];}))),'text/csv');},
  csvGifts:function(){download('Shagun-'+slug()+'.csv',csv([['Type','Name','Relation','Function / occasion','Cash','Gift','Date','Thank-you sent','Notes']].concat(S.gifts.map(function(g){return [g.dir==='in'?'Received':'Given',g.name,g.relation,g.dir==='in'?funcName(g.func):g.occasion,g.amount,g.item,g.date,g.dir==='in'?(g.thanked?'Yes':'No'):'',g.notes];}))),'text/csv');}
};

function theme(){try{return localStorage.getItem(KEY+'-theme')||'';}catch(e){return '';}}
function setTheme(v){try{v?localStorage.setItem(KEY+'-theme',v):localStorage.removeItem(KEY+'-theme');}catch(e){}if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');}

/* ---------- events ---------- */
var confirmReset=0;
function onClick(e){
  var t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return;}
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='toggleTask'){var k=S.tasks.find(function(x){return x.id===id;});if(k){k.done=t.checked;save();render();}return;}
  switch(a){
    case 'editWedding':editWedding();break;
    case 'addFunc':editFunc();break;case 'editFunc':editFunc(id);break;
    case 'addBudget':editBudget();break;case 'editBudget':editBudget(id);break;
    case 'addGuest':editGuest();break;case 'editGuest':editGuest(id);break;
    case 'addGift':editGift();break;case 'editGift':editGift(id);break;
    case 'paste':pasteGuests();break;case 'cater':cater();break;case 'addTask':addTask();break;
    case 'delTask':S.tasks=S.tasks.filter(function(x){return x.id!==id;});save();render();break;
    case 'cycleRsvp':var g=S.guests.find(function(x){return x.id===id;});if(g){g.rsvp={'':'yes',yes:'maybe',maybe:'no',no:''}[g.rsvp||''];save();render();}break;
    case 'toggleInvite':var gi=S.guests.find(function(x){return x.id===id;});if(gi){gi.invited=!gi.invited;save();render();}break;
    case 'toggleThanks':var gf=S.gifts.find(function(x){return x.id===id;});if(gf){gf.thanked=!gf.thanked;save();render();}break;
    case 'giftDir':giftDir=t.dataset.v;render();break;
    case 'backup':backup();break;
    case 'restore':if(DEMO)demoOnly();else $('#restoreFile').click();break;
    case 'print':if(DEMO)demoOnly();else window.print();break;
    case 'csvBudget':case 'csvGuests':case 'csvGifts':if(DEMO)demoOnly();else CSV[a]();break;
    case 'sample':
      if((S.budget.length||S.guests.length||S.gifts.length)&&!t.dataset.sure){t.dataset.sure='1';t.textContent='This replaces your current planner. Tap again';return;}
      sample();break;
    case 'reset':
      if(!t.dataset.sure){t.dataset.sure='1';t.textContent='Sure? This deletes everything. Tap again';return;}
      S=fresh();save();go('home');toast('Planner cleared');break;
    case 'theme':setTheme(t.dataset.v);render();break;
  }
}
function onInput(e){
  var id=e.target.id;
  if(id==='gq'){guestFilter.q=e.target.value;rerenderKeep('gq');}
  else if(id==='sq'){giftQ=e.target.value;rerenderKeep('sq');}
}
function onChange(e){
  var id=e.target.id;
  if(id==='gside'){guestFilter.side=e.target.value;render();}
  else if(id==='gfunc'){guestFilter.func=e.target.value;render();}
  else if(id==='grsvp'){guestFilter.rsvp=e.target.value;render();}
  else if(id==='restoreFile'&&e.target.files[0]){restore(e.target.files[0]);e.target.value='';}
}
function rerenderKeep(id){var el=$('#'+id),p=el.selectionStart;render();var n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}}

function init(){
  setTheme(theme());
  dlg=$('#dlg');
  dlg.addEventListener('submit',function(e){e.preventDefault();dlgSubmit&&dlgSubmit();});
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('change',onChange);
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}catch(e){storageOK=false;}
  if(DEMO){sample();return;}
  render();
}
window.__wps={get state(){return S;},sample:sample};
init();
})();
